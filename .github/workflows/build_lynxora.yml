                  root.addView(ui.text("Riwayat percakapan", 22f, T.text, true))
                  root.addView(ui.text("Ketuk untuk menyalin, tekan lama untuk menghapus.", 12.5f, T.muted), ui.lp(top = 2))

                  cari = ui.isian("Cari di riwayat", "", false)
                  root.addView(cari, ui.lp(top = 12))
                  cari.addTextChangedListener(object : TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, st: Int, c: Int, a: Int) {}
                      override fun onTextChanged(s: CharSequence?, st: Int, b: Int, c: Int) {}
                      override fun afterTextChanged(s: Editable?) { gambar() }
                  })

                  daftar = LinearLayout(this)
                  daftar.orientation = LinearLayout.VERTICAL
                  val sv = ScrollView(this)
                  sv.addView(daftar)
                  root.addView(sv, LinearLayout.LayoutParams(ui.MATCH, 0, 1f))

                  val bawah = LinearLayout(this)
                  bawah.orientation = LinearLayout.HORIZONTAL
                  val hapus = ui.tombol("Hapus semua", 1) { konfirmasiHapusSemua() }
                  val tutup = ui.tombol("Tutup", 0) { finish() }
                  val a = ui.bobot()
                  a.rightMargin = ui.dp(8)
                  bawah.addView(hapus, a)
                  bawah.addView(tutup, ui.bobot())
                  root.addView(bawah, ui.lp(top = 10))

                  setContentView(root)
                  muat()
              }

              private fun muat() {
                  semua = Store.chat(this).toMutableList()
                  gambar()
              }

              private fun gambar() {
                  daftar.removeAllViews()
                  val q = cari.text.toString().trim().lowercase()
                  var n = 0
                  for (i in semua.indices.reversed()) {
                      val m = semua[i]
                      if (q.isNotEmpty() && !m.second.lowercase().contains(q)) continue
                      n++
                      val k = ui.kartu()
                      k.addView(ui.text(if (m.first) "Kamu" else "Lynxora", 11.5f, T.muted, true))
                      k.addView(ui.text(m.second.take(600), 14f, T.text), ui.lp(top = 3))
                      k.setOnClickListener {
                          val cb = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                          cb.setPrimaryClip(ClipData.newPlainText("Lynxora", m.second))
                          Toast.makeText(this, "Disalin", Toast.LENGTH_SHORT).show()
                      }
                      k.setOnLongClickListener {
                          AlertDialog.Builder(this)
                              .setTitle("Hapus pesan ini?")
                              .setPositiveButton("Hapus") { _, _ -> hapusSatu(i) }
                              .setNegativeButton("Batal", null)
                              .show()
                          true
                      }
                      daftar.addView(k, ui.lp(top = 8))
                  }
                  if (n == 0) {
                      daftar.addView(ui.text(if (semua.isEmpty()) "Belum ada riwayat." else "Tidak ada yang cocok.", 14f, T.muted), ui.lp(top = 20))
                  }
              }

              private fun hapusSatu(i: Int) {
                  if (i < 0 || i >= semua.size) return
                  semua.removeAt(i)
                  Store.simpanChat(this, semua)
                  OverlayService.instance?.muatUlangRiwayat()
                  gambar()
              }

              private fun konfirmasiHapusSemua() {
                  AlertDialog.Builder(this)
                      .setTitle("Hapus semua riwayat?")
                      .setMessage("Tindakan ini tidak bisa dibatalkan.")
                      .setPositiveButton("Hapus semua") { _, _ ->
                          semua.clear()
                          Store.simpanChat(this, semua)
                          OverlayService.instance?.muatUlangRiwayat()
                          gambar()
                      }
                      .setNegativeButton("Batal", null)
                      .show()
              }
          }
