              </item>
              <item>
                  <shape android:shape="rectangle">
                      <gradient
                          android:startColor="#7c3aed"
                          android:endColor="#8b5cf6"
                          android:angle="135"
                          android:type="linear" />
                      <corners android:radius="12dp" />
                  </shape>
              </item>
          </selector>
          __END_D3__
          cat > app/src/main/res/drawable/kg_icon_bg.xml <<'__END_D4__'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <solid android:color="#1a1228" />
              <stroke android:width="1dp" android:color="#2a1f4a" />
          </shape>
          __END_D4__
          cat > app/src/main/res/drawable/kg_glow_top.xml <<'__END_D5__'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android" android:shape="oval">
              <gradient
                  android:type="radial"
                  android:gradientRadius="180dp"
                  android:startColor="#1a0d3d"
                  android:endColor="#08080a" />
          </shape>
          __END_D5__
          mkdir -p $(dirname app/src/main/java/com/asisten/hp/Ai.kt)
          cat > app/src/main/java/com/asisten/hp/Ai.kt <<'__END_5__'
          package com.asisten.hp

          import android.content.Context
          import android.net.ConnectivityManager
          import android.net.NetworkCapabilities
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.SocketTimeoutException
          import java.net.URL
          import java.net.UnknownHostException
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class Provider(val nama: String, val url: String, val model: String, val anthropic: Boolean)

          // kode: kode HTTP, atau -1 jaringan gagal, -2 waktu habis, -3 offline
          class AiRes(val ok: Boolean, val teks: String, val kode: Int = 0)

          class Rencana(val balas: String, val aksi: List<String>, val lanjut: Boolean, val saran: List<String> = emptyList())

          class DaftarModel(val ok: Boolean, val daftar: List<String>, val pesan: String)

          object Ai {
              val providers = listOf(
                  Provider("Gemini (Google, ada paket gratis)", "https://generativelanguage.googleapis.com/v1beta/openai/chat/completions", "gemini-flash-latest", false),
                  Provider("Claude (Anthropic)", "https://api.anthropic.com/v1/messages", "claude-haiku-5-5", true),
                  Provider("OpenAI", "https://api.openai.com/v1/chat/completions", "gpt-5.4-mini", false),
                  Provider("Kustom (OpenAI-compatible)", "https://openrouter.ai/api/v1/chat/completions", "openai/gpt-5.4-mini", false)
              )

              val namaPendek = listOf("Gemini", "Claude", "OpenAI", "Kustom")

              private val history = mutableListOf<Pair<String, String>>()
              @Volatile private var tanpaReasoning = false
              @Volatile var errorTerakhir: String = ""

              private fun prefs(c: Context) = c.getSharedPreferences("lynxora_ai", Context.MODE_PRIVATE)

              // Pindahkan kunci lama (teks biasa, satu penyedia) ke penyimpanan terenkripsi per penyedia.
              private fun migrasi(c: Context) {
                  val p = prefs(c)
                  if (p.getBoolean("migrasi5", false)) return
                  val lama = p.getString("key", "") ?: ""
                  val e = p.edit()
                  if (lama.isNotBlank()) {
                      val pi = p.getInt("provider", 0).coerceIn(0, providers.size - 1)
                      e.putString("k_" + pi, Secure.kunciKan(lama))
                      val m = p.getString("model", null)
                      val u = p.getString("url", null)
                      if (m != null) e.putString("m_" + pi, m)
                      if (u != null) e.putString("u_" + pi, u)
                  }
                  e.remove("key").remove("model").remove("url")
                  e.putBoolean("migrasi5", true)
                  e.apply()
              }

              fun provider(c: Context): Int = prefs(c).getInt("provider", 0).coerceIn(0, providers.size - 1)
              fun pilihProvider(c: Context, i: Int) { prefs(c).edit().putInt("provider", i.coerceIn(0, providers.size - 1)).apply() }

              fun key(c: Context, i: Int = provider(c)): String {
                  migrasi(c)
                  return Secure.bukaKunci(prefs(c).getString("k_" + i, "") ?: "")
              }

              fun model(c: Context, i: Int = provider(c)): String {
                  migrasi(c)
                  val m = prefs(c).getString("m_" + i, null)
                  return if (m.isNullOrBlank()) providers[i].model else m
              }

              fun url(c: Context, i: Int = provider(c)): String {
                  migrasi(c)
                  val u = prefs(c).getString("u_" + i, null)
                  return if (u.isNullOrBlank()) providers[i].url else u
              }

              fun simpanProv(c: Context, i: Int, key: String, model: String, url: String) {
                  migrasi(c)
                  prefs(c).edit()
                      .putString("k_" + i, Secure.kunciKan(key))
                      .putString("m_" + i, model.ifBlank { providers[i].model })
                      .putString("u_" + i, url.ifBlank { providers[i].url })
                      .apply()
              }

              fun siap(c: Context): Boolean = key(c).isNotBlank()

              fun jumlahKunci(c: Context): Int {
                  var n = 0
                  for (i in providers.indices) if (key(c, i).isNotBlank()) n++
                  return n
              }

              fun bolehLayar(c: Context): Boolean = prefs(c).getBoolean("layar", true)
              fun setBolehLayar(c: Context, v: Boolean) { prefs(c).edit().putBoolean("layar", v).apply() }

              val gayaNama = listOf("Singkat", "Santai", "Rinci")
              private val gayaTeks = listOf(
                  "Gaya jawaban: singkat dan padat.",
                  "Gaya jawaban: santai dan akrab seperti teman.",
                  "Gaya jawaban: rinci dan terstruktur, boleh lebih panjang."
              )

              fun nama(c: Context): String = prefs(c).getString("nama", "") ?: ""
              fun gaya(c: Context): Int = prefs(c).getInt("gaya", 0).coerceIn(0, 2)
              fun suara(c: Context): Boolean = prefs(c).getBoolean("suara", false)

              fun simpanEkstra(c: Context, nama: String, gaya: Int, suara: Boolean) {
                  prefs(c).edit()
                      .putString("nama", nama)
                      .putInt("gaya", gaya)
                      .putBoolean("suara", suara)
                      .apply()
              }

              fun reset() {
                  synchronized(history) { history.clear() }
              }

              // ---------- prompt sistem ----------

              private const val PERINTAH =
                  "buka <nama app> | cari <teks> (Google) | youtube <teks> | spotify <teks> | maps <tempat> | arahkan <tujuan> | " +
                      "ketik <teks> (mengisi kolom input yang aktif) | tap <teks tombol persis di layar> | scroll bawah | scroll atas | " +
                      "kembali | beranda | notifikasi | screenshot | senter nyala | senter mati | volume naik | volume turun | volume max | volume mute | " +
                      "jeda musik | lanjut musik | lagu berikutnya | lagu sebelumnya | " +
                      "alarm jam 6.30 | timer 5 menit | hitung 12*5 | cuaca <kota> | terjemah <teks> | " +
                      "kirim wa <nomor atau nama kontak> <pesan> | telepon <nomor atau nama kontak> | tempel | salin layar | " +
                      "catat <teks> | ingatkan <angka> <detik/menit/jam> <pesan> | ingat <fakta tentang pengguna> | baca notifikasi | " +
                      "kamera | selfie | rekam video | wifi | bluetooth | kecerahan | lokasi | tunggu <detik>"

              private fun sistem(c: Context): String {
                  val now = SimpleDateFormat("EEEE, d MMMM yyyy HH.mm", Locale("id", "ID")).format(Date())
                  val baris = mutableListOf<String>()
                  baris.add(
                      "Kamu adalah Lynxora, asisten AI yang hidup di HP Android pengguna. Jawab ramah dan jelas. " +
                          "Pakai bahasa yang dipakai pengguna (default Bahasa Indonesia). " +
                          "Jangan pernah memakai emoji. Hindari format markdown berat; boleh pakai **tebal** dan daftar dengan tanda minus."
                  )
                  baris.add("Sekarang: $now.")
                  if (Pref.bolehKontrol(c)) {
                      baris.add("Kamu bisa mengendalikan HP lewat perintah. Balas HANYA dengan satu objek JSON, tanpa teks lain dan tanpa blok kode:")
                      baris.add("{\"balas\":\"teks untuk pengguna\",\"aksi\":[\"perintah 1\",\"perintah 2\"],\"lanjut\":false,\"saran\":[\"usulan 1\",\"usulan 2\"]}")
                      baris.add(
                          "balas = jawaban singkat untuk pengguna. aksi = daftar perintah yang dijalankan berurutan (boleh kosong). " +
                              "lanjut = true kalau setelah aksi selesai kamu perlu melihat isi layar untuk langkah berikutnya. " +
                              "saran = 0 sampai 3 usulan pertanyaan atau perintah lanjutan yang sangat singkat (maksimal 4 kata), hanya bila benar-benar berguna."
                      )
                      baris.add("Perintah yang tersedia: $PERINTAH.")
                      baris.add(
                          "Aturan: (1) Pertanyaan biasa, saran, penjelasan, atau menulis teks dijawab di balas dengan aksi kosong. " +
                              "(2) Setelah perintah buka, layar butuh waktu, jadi pakai lanjut:true untuk melihat layar sebelum tap atau ketik. " +
                              "(3) Layar dilaporkan sebagai daftar teks; tanda [tombol] berarti bisa diketuk. Pada tap pakai teks yang persis ada di layar. " +
                              "(4) Untuk kirim wa dan telepon, aplikasi otomatis meminta konfirmasi pengguna, jadi cukup jelaskan di balas. " +
                              "Kalau pengguna minta dibuatkan pesan, tulis pesannya langsung di perintah kirim wa. " +
                              "(5) Jangan pernah meminta, membaca ulang, atau mengetik password, PIN, atau kode OTP. " +
                              "(6) Kamu tidak bisa melihat gambar, hanya teks di layar. " +
                              "(7) Kalau pengguna menyebut fakta pribadi yang berguna untuk diingat (nama orang dekat, kebiasaan), simpan dengan perintah ingat. " +
                              "(8) Kalau tugas tidak mungkin dilakukan, jelaskan singkat di balas."
                      )
                  } else {
                      baris.add(
                          "Mode hanya jawab: kamu TIDAK bisa mengendalikan HP. Jawab pertanyaan dengan teks biasa saja, tanpa JSON. " +
                              "Kalau pengguna meminta aksi di HP, jelaskan bahwa kontrol HP dimatikan di pengaturan."
                      )
                  }
                  val mem = Store.memori(c)
                  if (mem.isNotEmpty()) baris.add("Yang kamu ketahui tentang pengguna: " + mem.joinToString("; ") + ".")
                  if (nama(c).isNotBlank()) baris.add("Pengguna ingin dipanggil: " + nama(c) + ".")
                  baris.add(gayaTeks[gaya(c)])
                  return baris.joinToString("\n")
              }

              // ---------- panggilan ----------

              // Blocking: panggil dari thread latar belakang.
              fun tanya(c: Context, pesan: String): AiRes {
                  val snap = synchronized(history) {
                      history.add("user" to pesan)
                      while (history.size > 14) history.removeAt(0)
                      while (history.isNotEmpty() && history[0].first != "user") history.removeAt(0)
                      history.toList()
                  }
                  val res = panggilSemua(c, snap, sistem(c))
                  synchronized(history) {
                      if (res.ok) {
                          history.add("assistant" to res.teks)
                      } else if (history.isNotEmpty() && history[history.size - 1].first == "user") {
                          history.removeAt(history.size - 1)
                      } else {
                          // tidak ada yang perlu dilakukan
                      }
                  }
                  return res
              }

              fun tes(c: Context): AiRes =
                  panggil(c, provider(c), listOf("user" to "Balas hanya dengan kata: OK"), "Kamu asisten singkat.")

              // Coba penyedia terpilih dulu; kalau gagal, coba penyedia lain yang kuncinya sudah diisi.
              private fun panggilSemua(c: Context, riwayat: List<Pair<String, String>>, sys: String): AiRes {
                  val utama = provider(c)
                  val urut = mutableListOf(utama)
                  for (i in providers.indices) {
                      if (i != utama && key(c, i).isNotBlank()) urut.add(i)
                  }
                  var pertama: AiRes? = null
                  for (idx in urut) {
                      val r = panggil(c, idx, riwayat, sys)
                      if (r.ok) {
                          errorTerakhir = ""
                          var masuk = sys.length
                          for (m in riwayat) masuk += m.second.length
                          Store.catatPakai(c, masuk, r.teks.length)
                          return r
                      }
                      if (pertama == null) pertama = r
                      if (r.kode == -3) break
                  }
                  val gagal = pertama ?: AiRes(false, "AI belum diatur.", 0)
                  errorTerakhir = gagal.teks
                  return gagal
              }

              private fun online(c: Context): Boolean {
                  return try {
                      val cm = c.getSystemService(Context.CONNECTIVITY_SERVICE) as ConnectivityManager
                      val n = cm.activeNetwork ?: return false
                      val cap = cm.getNetworkCapabilities(n) ?: return false
                      cap.hasCapability(NetworkCapabilities.NET_CAPABILITY_INTERNET)
                  } catch (e: Exception) {
                      true
                  }
              }

              private fun panggil(c: Context, idx: Int, riwayat: List<Pair<String, String>>, sys: String): AiRes {
                  val p = providers[idx]
                  val kunciApi = key(c, idx)
                  if (kunciApi.isBlank()) return AiRes(false, "Kunci API " + namaPendek[idx] + " belum diisi.", 401)
                  if (!online(c)) return AiRes(false, "Tidak ada koneksi internet.", -3)
                  return try {
                      val alamat = url(c, idx)
                      val body = JSONObject()
                      body.put("model", model(c, idx))
                      val pakaiReasoning = !p.anthropic && !tanpaReasoning && alamat.contains("generativelanguage.googleapis.com")
                      if (pakaiReasoning) body.put("reasoning_effort", "low")
                      val msgs = JSONArray()
                      if (p.anthropic) {
                          body.put("max_tokens", 1024)
                          body.put("system", sys)
                      } else {
                          msgs.put(JSONObject().put("role", "system").put("content", sys))
                      }
                      for (m in riwayat) {
                          msgs.put(JSONObject().put("role", m.first).put("content", m.second))
                      }
                      body.put("messages", msgs)

                      val conn = URL(alamat).openConnection() as HttpURLConnection
                      conn.requestMethod = "POST"
                      conn.connectTimeout = 10000
                      conn.readTimeout = 40000
                      conn.doOutput = true
                      conn.setRequestProperty("Content-Type", "application/json")
                      if (p.anthropic) {
                          conn.setRequestProperty("x-api-key", kunciApi)
                          conn.setRequestProperty("anthropic-version", "2023-06-01")
                      } else {
                          conn.setRequestProperty("Authorization", "Bearer " + kunciApi)
                      }
                      conn.outputStream.use { it.write(body.toString().toByteArray(Charsets.UTF_8)) }
                      val code = conn.responseCode
                      val stream = if (code in 200..299) conn.inputStream else conn.errorStream
                      val txt = stream?.bufferedReader()?.use { it.readText() } ?: ""
                      if (code !in 200..299) {
                          if (code == 400 && pakaiReasoning && Regex("(?i)reasoning|thinking|effort").containsMatchIn(txt)) {
                              tanpaReasoning = true
                              return panggil(c, idx, riwayat, sys)
                          }
                          return AiRes(false, pesanError(code, txt, idx), code)
                      }
                      val out = if (p.anthropic) teksAnthropic(txt) else teksOpenAi(txt)
                      if (out.isBlank()) {
                          AiRes(false, "AI tidak memberi jawaban. Coba ulangi atau ganti model.", 0)
                      } else {
                          AiRes(true, out, code)
                      }
                  } catch (e: SocketTimeoutException) {
                      AiRes(false, "AI terlalu lama menjawab. Periksa sinyal atau pilih model yang lebih cepat.", -2)
                  } catch (e: UnknownHostException) {
                      AiRes(false, "Tidak bisa menjangkau server AI. Periksa koneksi internet atau URL endpoint.", -1)
                  } catch (e: Exception) {
                      AiRes(false, "Gagal terhubung ke AI: " + (e.message ?: "tidak diketahui"), -1)
                  }
              }

              // Mengambil daftar model dari penyedia agar pengguna tinggal memilih (tidak perlu mengetik nama model).
              fun daftarModel(c: Context, idx: Int, kunciBaru: String, urlBaru: String): DaftarModel {
                  val p = providers[idx]
                  val kunciApi = if (kunciBaru.isBlank()) key(c, idx) else kunciBaru
                  if (kunciApi.isBlank()) return DaftarModel(false, emptyList(), "Isi kunci API dulu.")
                  if (!online(c)) return DaftarModel(false, emptyList(), "Tidak ada koneksi internet.")
                  return try {
                      val dasar = if (urlBaru.isBlank()) url(c, idx) else urlBaru
                      val alamat = if (dasar.contains("/chat/completions")) {
                          dasar.substringBefore("/chat/completions") + "/models"
                      } else if (dasar.contains("/messages")) {
                          dasar.substringBefore("/messages") + "/models"
                      } else {
                          dasar.trimEnd('/') + "/models"
                      }
                      val conn = URL(alamat).openConnection() as HttpURLConnection
                      conn.requestMethod = "GET"
                      conn.connectTimeout = 10000
                      conn.readTimeout = 20000
                      if (p.anthropic) {
                          conn.setRequestProperty("x-api-key", kunciApi)
                          conn.setRequestProperty("anthropic-version", "2023-06-01")
                      } else {
                          conn.setRequestProperty("Authorization", "Bearer " + kunciApi)
                      }
                      val code = conn.responseCode
                      val stream = if (code in 200..299) conn.inputStream else conn.errorStream
                      val txt = stream?.bufferedReader()?.use { it.readText() } ?: ""
                      if (code !in 200..299) return DaftarModel(false, emptyList(), pesanError(code, txt, idx))
                      val arr = JSONObject(txt).optJSONArray("data")
                          ?: return DaftarModel(false, emptyList(), "Penyedia tidak mengirim daftar model.")
                      val buang = listOf("embedding", "tts", "whisper", "image", "audio", "realtime", "transcribe", "moderation", "dall", "imagen", "veo")
                      val hasil = ArrayList<String>()
                      for (n in 0 until arr.length()) {
                          var id = arr.getJSONObject(n).optString("id", "")
                          if (id.startsWith("models/")) id = id.removePrefix("models/")
                          if (id.isBlank()) continue
                          val l = id.lowercase()
                          if (alamat.contains("generativelanguage") && !l.contains("gemini")) continue
                          if (buang.any { l.contains(it) }) continue
                          hasil.add(id)
                      }
                      hasil.sortDescending()
                      if (hasil.isEmpty()) {
                          DaftarModel(false, emptyList(), "Tidak ada model yang cocok.")
                      } else {
                          DaftarModel(true, hasil.take(150), "")
                      }
                  } catch (e: Exception) {
                      DaftarModel(false, emptyList(), "Gagal mengambil daftar: " + (e.message ?: "jaringan bermasalah"))
                  }
              }

              private fun teksOpenAi(txt: String): String {
                  val j = JSONObject(txt)
                  val ch = j.optJSONArray("choices") ?: return ""
                  if (ch.length() == 0) return ""
                  return ch.getJSONObject(0).optJSONObject("message")?.optString("content", "") ?: ""
              }

              private fun teksAnthropic(txt: String): String {
                  val a = JSONObject(txt).optJSONArray("content") ?: return ""
                  for (i in 0 until a.length()) {
                      val o = a.getJSONObject(i)
                      if (o.optString("type") == "text") return o.optString("text", "")
                  }
                  return ""
              }

              private fun pesanError(code: Int, txt: String, idx: Int): String {
                  val nama = namaPendek[idx]
                  val rinci = errMsg(txt)
                  return when {
                      code == 401 || code == 403 -> "Kunci API $nama ditolak. Periksa kunci di tab AI."
                      code == 404 -> "Model atau alamat tidak ditemukan di $nama. Periksa nama model di tab AI."
                      code == 429 -> "Kuota $nama habis atau terlalu sering dipakai. Tunggu sebentar lalu coba lagi."
                      code == 400 && rinci.contains("API key", ignoreCase = true) -> "Kunci API $nama tidak valid."
                      code in 500..599 -> "Server $nama sedang bermasalah (kode $code). Coba lagi sebentar."
                      else -> "AI error $code: $rinci"
                  }
              }

              private fun errMsg(t: String): String {
                  return try {
                      val s = t.trim().removePrefix("[").removeSuffix("]")
                      val m = JSONObject(s).optJSONObject("error")?.optString("message")
                      if (m.isNullOrBlank()) t.take(200) else m.take(200)
                  } catch (e: Exception) {
                      t.take(200)
                  }
              }

              // ---------- membaca balasan ----------

              fun bersih(t: String): String = Fmt.tanpaEmoji(t).trim()

              private fun ambilJson(s: String): String? {
                  val a = s.indexOf('{')
                  if (a < 0) return null
                  var depth = 0
                  var inStr = false
                  var esc = false
                  for (i in a until s.length) {
                      val ch = s[i]
                      if (inStr) {
                          if (esc) {
                              esc = false
                          } else if (ch == '\\') {
                              esc = true
                          } else if (ch == '"') {
                              inStr = false
                          }
                      } else {
                          if (ch == '"') {
                              inStr = true
                          } else if (ch == '{') {
                              depth++
                          } else if (ch == '}') {
                              depth--
                              if (depth == 0) return s.substring(a, i + 1)
                          }
                      }
                  }
                  return null
              }

              fun urai(t: String): Rencana {
                  val s = t.trim()
                  val js = ambilJson(s)
                  if (js != null) {
                      try {
                          val j = JSONObject(js)
                          val arr = j.optJSONArray("aksi")
                          val list = mutableListOf<String>()
                          if (arr != null) {
                              for (i in 0 until arr.length()) {
                                  val x = arr.optString(i)
                                  if (x.isNotBlank()) list.add(x)
                              }
                          }
                          val sr = j.optJSONArray("saran")
                          val saran = mutableListOf<String>()
                          if (sr != null) {
                              for (i in 0 until sr.length()) {
                                  val x = bersih(sr.optString(i))
                                  if (x.isNotBlank() && x.length <= 40 && saran.size < 3) saran.add(x)
                              }
                          }
                          return Rencana(bersih(j.optString("balas", "")), list, j.optBoolean("lanjut", false), saran)
                      } catch (e: Exception) {
                          // jatuh ke teks biasa di bawah
                      }
                  }
                  val polos = s.replace("```json", "").replace("```", "")
                  return Rencana(bersih(polos), emptyList(), false)
              }
          }
