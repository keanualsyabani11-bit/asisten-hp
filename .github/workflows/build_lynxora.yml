                  <EditText
                      android:id="@+id/et_key"
                      android:layout_width="match_parent"
                      android:layout_height="52dp"
                      android:background="@drawable/kg_input_bg"
                      android:hint="APK-XXXX-XXXX-XXXX-XXXX"
                      android:textColorHint="#48485a"
                      android:textColor="#f0f0f8"
                      android:textSize="14sp"
                      android:fontFamily="monospace"
                      android:paddingStart="16dp"
                      android:paddingEnd="16dp"
                      android:inputType="textCapCharacters|textNoSuggestions"
                      android:imeOptions="actionDone"
                      android:maxLines="1"
                      android:singleLine="true" />
                  <TextView
                      android:id="@+id/tv_counter"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_gravity="end"
                      android:layout_marginTop="5dp"
                      android:text="0 / 23"
                      android:textColor="#48485a"
                      android:textSize="10sp" />
                  <TextView
                      android:id="@+id/tv_status"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_gravity="center_horizontal"
                      android:layout_marginTop="10dp"
                      android:textSize="12sp"
                      android:visibility="gone" />
                  <Button
                      android:id="@+id/btn_activate"
                      android:layout_width="match_parent"
                      android:layout_height="52dp"
                      android:layout_marginTop="20dp"
                      android:background="@drawable/kg_btn_bg"
                      android:text="Aktifkan"
                      android:textColor="#ffffff"
                      android:textSize="15sp"
                      android:textStyle="bold"
                      android:stateListAnimator="@null" />
              </LinearLayout>
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:layout_alignParentBottom="true"
                  android:layout_centerHorizontal="true"
                  android:layout_marginBottom="28dp"
                  android:text="Hubungi admin untuk mendapatkan key"
                  android:textColor="#2a2a36"
                  android:textSize="11sp" />
          </RelativeLayout>
          __END_LAYOUT_KG__
          mkdir -p app/src/main/res/drawable
          cat > app/src/main/res/drawable/kg_card_bg.xml <<'__END_D1__'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <shape android:shape="rectangle">
                      <solid android:color="#1a1a28" />
                      <corners android:radius="20dp" />
