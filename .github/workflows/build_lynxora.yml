          package com.asisten.hp

          // Perlindungan data sensitif: aplikasi yang tidak boleh dibaca/dikendalikan dan penyamaran teks.
          object Privasi {
              private val kataPaket = listOf(
                  "bank", "bca", "mandiri", "bri.", ".bri", "bni", "btn", "cimb", "permata", "danamon", "jago", "jenius",
                  "seabank", "blu.", "ocbc", "maybank", "mobilebanking", "livin", "brimo", "wondr",
                  "id.dana", "ovo", "gopay", "shopeepay", "linkaja", "paypal", "wallet", "dompet",
                  "authenticator", "bitwarden", "lastpass", "1password", "keepass", "dashlane", "keeper",
                  "binance", "tokocrypto", "indodax", "pintu", "ajaib", "bibit", "stockbit"
              )

              fun sensitifPkg(pkg: String?): Boolean {
                  if (pkg.isNullOrEmpty()) return false
                  val p = pkg.lowercase()
                  if (p.startsWith("com.google.android.apps.walletnfcrel")) return true
                  for (k in kataPaket) if (p.contains(k)) return true
                  return false
              }

              private val reKartu = Regex("\\b(?:\\d[ -]?){13,19}\\b")
              private val reKode = Regex("(?i)\\b(otp|kode|code|pin|cvv|verifikasi)\\b([^\\d\\n]{0,20})(\\d{4,8})\\b")
              private val reKodeBalik = Regex("(?i)\\b(\\d{4,8})\\b([^\\d\\n]{0,25})\\b(otp|kode rahasia|kode verifikasi|verification code)\\b")

              fun samarkan(t: String): String {
                  var s = t
                  s = reKartu.replace(s, "[nomor disamarkan]")
                  s = reKode.replace(s) { m -> m.groupValues[1] + m.groupValues[2] + "[disamarkan]" }
                  s = reKodeBalik.replace(s) { m -> "[disamarkan]" + m.groupValues[2] + m.groupValues[3] }
                  return s
              }
          }
