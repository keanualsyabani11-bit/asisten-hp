          package com.asisten.hp

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject
          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          class Pakai(val req: Int, val masuk: Int, val keluar: Int)

          object Store {
              private fun p(c: Context) = c.getSharedPreferences("lynxora_data", Context.MODE_PRIVATE)

              private fun daftar(c: Context, kunci: String): List<String> {
                  return try {
                      val a = JSONArray(p(c).getString(kunci, "[]"))
                      val out = mutableListOf<String>()
                      for (i in 0 until a.length()) out.add(a.getString(i))
                      out
                  } catch (e: Exception) {
                      emptyList()
                  }
              }

              private fun tulis(c: Context, kunci: String, l: List<String>) {
                  val a = JSONArray()
                  for (x in l) a.put(x)
                  p(c).edit().putString(kunci, a.toString()).apply()
              }

              private fun tambah(c: Context, kunci: String, t: String, maks: Int) {
                  val l = daftar(c, kunci).toMutableList()
                  l.add(t)
                  while (l.size > maks) l.removeAt(0)
                  tulis(c, kunci, l)
              }

              // ---------- pemakaian AI (perkiraan: 1 token kira-kira 4 karakter) ----------
              private fun kunciHari(): String = "pakai_" + SimpleDateFormat("yyyyMMdd", Locale.US).format(Date())

              fun catatPakai(c: Context, karakterMasuk: Int, karakterKeluar: Int) {
                  try {
                      val k = kunciHari()
                      val o = try {
                          JSONObject(p(c).getString(k, "{}"))
                      } catch (e: Exception) {
                          JSONObject()
                      }
                      o.put("req", o.optInt("req", 0) + 1)
                      o.put("in", o.optInt("in", 0) + karakterMasuk / 4)
                      o.put("out", o.optInt("out", 0) + karakterKeluar / 4)
                      val ed = p(c).edit()
                      ed.putString(k, o.toString())
                      val lama = p(c).all.keys.filter { it.startsWith("pakai_") && it != k }.sorted()
                      if (lama.size > 6) {
                          for (x in lama.take(lama.size - 6)) ed.remove(x)
                      }
                      ed.apply()
                  } catch (e: Exception) {
                      // pencatatan gagal tidak boleh mengganggu jawaban
                  }
              }

              private fun bacaPakai(c: Context, key: String): Pakai {
                  return try {
                      val o = JSONObject(p(c).getString(key, "{}"))
                      Pakai(o.optInt("req", 0), o.optInt("in", 0), o.optInt("out", 0))
                  } catch (e: Exception) {
                      Pakai(0, 0, 0)
                  }
              }

              fun pakaiHariIni(c: Context): Pakai = bacaPakai(c, kunciHari())

              fun pakaiMingguIni(c: Context): Pakai {
                  var r = 0
                  var m = 0
                  var k = 0
                  for (key in p(c).all.keys.filter { it.startsWith("pakai_") }) {
                      val x = bacaPakai(c, key)
                      r += x.req
                      m += x.masuk
                      k += x.keluar
                  }
                  return Pakai(r, m, k)
              }

              // ---------- mode siap pakai ----------
              fun modeBawaan(): Map<String, List<String>> = linkedMapOf(
                  "mode game" to listOf("volume max", "buka ml"),
                  "mode belajar" to listOf("volume mute", "timer 25 menit"),
                  "mode tidur" to listOf("senter mati", "volume mute", "alarm jam 5.30")
              )

              fun cariMode(c: Context, nama: String): List<String>? = makro(c)[nama] ?: modeBawaan()[nama]

              // ---------- ekspor dan impor (kunci API tidak ikut) ----------
              fun ekspor(c: Context): String {
                  val o = JSONObject()
                  o.put("versi", 1)
                  val m = JSONObject()
                  for ((k, v) in makro(c)) {
                      val a = JSONArray()
                      for (x in v) a.put(x)
                      m.put(k, a)
                  }
                  o.put("makro", m)
                  o.put("memori", JSONArray(memori(c)))
                  o.put("catatan", JSONArray(catatan(c)))
                  val al = JSONObject()
                  for ((k, v) in alamat(c)) al.put(k, v)
                  o.put("alamat", al)
                  o.put("chips", Pref.chipTeks(c))
                  o.put("app_sembunyi", Pref.appSembunyiTeks(c))
                  o.put("nama", Ai.nama(c))
                  o.put("gaya", Ai.gaya(c))
                  return o.toString(2)
              }

              // Mengembalikan ringkasan hasil, atau null jika teks bukan cadangan Lynxora yang valid.
              fun impor(c: Context, teks: String): String? {
                  return try {
                      val o = JSONObject(teks.trim())
                      if (!o.has("versi")) return null
                      var n = 0
                      val m = o.optJSONObject("makro")
                      if (m != null) {
                          val ks = m.keys()
                          while (ks.hasNext()) {
                              val k = ks.next()
                              val a = m.getJSONArray(k)
                              val l = mutableListOf<String>()
                              for (i in 0 until a.length()) l.add(a.getString(i))
                              simpanMakro(c, k, l)
                              n++
                          }
                      }
                      val mem = o.optJSONArray("memori")
                      if (mem != null) for (i in 0 until mem.length()) { tambahMemori(c, mem.getString(i)); n++ }
                      val cat = o.optJSONArray("catatan")
                      if (cat != null) for (i in 0 until cat.length()) { tambahCatatan(c, cat.getString(i)); n++ }
                      val al = o.optJSONObject("alamat")
                      if (al != null) {
                          val ks = al.keys()
                          while (ks.hasNext()) {
                              val k = ks.next()
                              simpanAlamat(c, k, al.getString(k))
                              n++
                          }
                      }
                      if (o.has("chips")) Pref.setChipTeks(c, o.getString("chips"))
                      if (o.has("app_sembunyi")) Pref.setAppSembunyiTeks(c, o.getString("app_sembunyi"))
                      if (o.has("nama") || o.has("gaya")) {
                          Ai.simpanEkstra(c, o.optString("nama", Ai.nama(c)), o.optInt("gaya", Ai.gaya(c)), Ai.suara(c))
                      }
                      "Berhasil memulihkan " + n.toString() + " data dan pengaturan."
                  } catch (e: Exception) {
                      null
                  }
              }

              // ---------- catatan ----------
              fun catatan(c: Context): List<String> = daftar(c, "catatan")
              fun tambahCatatan(c: Context, t: String) = tambah(c, "catatan", t, 100)
              fun hapusCatatan(c: Context) { p(c).edit().remove("catatan").apply() }

              // ---------- memori jangka panjang ----------
              fun memori(c: Context): List<String> = daftar(c, "memori")
              fun tambahMemori(c: Context, t: String) {
                  val l = memori(c)
                  if (l.any { it.equals(t, ignoreCase = true) }) return
                  tambah(c, "memori", t, 40)
              }
              fun hapusMemori(c: Context) { p(c).edit().remove("memori").apply() }

              // ---------- log aksi ----------
              fun log(c: Context): List<String> = daftar(c, "log")
              fun catatLog(c: Context, t: String) {
                  val jam = SimpleDateFormat("HH:mm:ss", Locale.US).format(Date())
                  tambah(c, "log", jam + "  " + t.replace("\n", " ").take(160), 80)
              }
              fun hapusLog(c: Context) { p(c).edit().remove("log").apply() }

              // ---------- alamat tersimpan ----------
              fun alamat(c: Context): Map<String, String> {
                  return try {
                      val o = JSONObject(p(c).getString("alamat", "{}"))
                      val out = linkedMapOf<String, String>()
                      val ks = o.keys()
                      while (ks.hasNext()) {
                          val k = ks.next()
                          out[k] = o.getString(k)
                      }
                      out
                  } catch (e: Exception) {
                      emptyMap()
                  }
              }

              fun simpanAlamat(c: Context, nama: String, isi: String) {
                  val m = LinkedHashMap(alamat(c))
                  m[nama] = isi
                  val o = JSONObject()
                  for ((k, v) in m) o.put(k, v)
                  p(c).edit().putString("alamat", o.toString()).apply()
              }

              // ---------- makro ----------
              fun makro(c: Context): Map<String, List<String>> {
                  return try {
                      val o = JSONObject(p(c).getString("makro", "{}"))
                      val out = linkedMapOf<String, List<String>>()
                      val ks = o.keys()
                      while (ks.hasNext()) {
                          val k = ks.next()
                          val a = o.getJSONArray(k)
                          val l = mutableListOf<String>()
                          for (i in 0 until a.length()) l.add(a.getString(i))
                          out[k] = l
                      }
                      out
                  } catch (e: Exception) {
                      emptyMap()
                  }
              }

              private fun tulisMakro(c: Context, m: Map<String, List<String>>) {
                  val o = JSONObject()
                  for ((k, v) in m) {
                      val a = JSONArray()
                      for (x in v) a.put(x)
                      o.put(k, a)
                  }
                  p(c).edit().putString("makro", o.toString()).apply()
              }

              fun simpanMakro(c: Context, nama: String, aksi: List<String>) {
                  val m = LinkedHashMap(makro(c))
                  m[nama] = aksi
                  tulisMakro(c, m)
              }

              fun hapusMakro(c: Context, nama: String): Boolean {
                  val m = LinkedHashMap(makro(c))
                  if (!m.containsKey(nama)) return false
                  m.remove(nama)
                  tulisMakro(c, m)
                  return true
              }

              // ---------- riwayat chat ----------
              fun chat(c: Context): List<Pair<Boolean, String>> {
                  return try {
                      val a = JSONArray(p(c).getString("chat", "[]"))
                      val out = mutableListOf<Pair<Boolean, String>>()
                      for (i in 0 until a.length()) {
                          val o = a.getJSONObject(i)
                          out.add(Pair(o.optBoolean("u", false), o.optString("t", "")))
                      }
                      out
                  } catch (e: Exception) {
                      emptyList()
                  }
              }

              fun simpanChat(c: Context, l: List<Pair<Boolean, String>>) {
                  val a = JSONArray()
                  for (m in l) {
                      a.put(JSONObject().put("u", m.first).put("t", m.second))
                  }
                  p(c).edit().putString("chat", a.toString()).apply()
              }
          }
