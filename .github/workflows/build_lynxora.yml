          package com.asisten.hp

          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.os.Build
          import android.os.Bundle
          import android.view.KeyEvent
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo

          class AsistenAccessibilityService : AccessibilityService() {

              companion object {
                  var instance: AsistenAccessibilityService? = null
              }

              // Dihitung setiap ada jendela aplikasi lain yang muncul (dipakai untuk menunggu aplikasi terbuka).
              @Volatile var jumlahGanti = 0
              @Volatile var paketAktif: String = ""

              override fun onServiceConnected() {
                  instance = this
              }

              override fun onUnbind(intent: Intent?): Boolean {
                  instance = null
                  return super.onUnbind(intent)
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {
                  if (event == null || event.eventType != AccessibilityEvent.TYPE_WINDOW_STATE_CHANGED) return
                  val pkg = event.packageName?.toString() ?: return
                  if (pkg == packageName || pkg == "android" || pkg.contains("systemui") || pkg.contains("inputmethod")) return
                  paketAktif = pkg
                  jumlahGanti++
                  OverlayService.instance?.paketBerubah(pkg)
              }

              // Tombol volume turun ditekan (bagian dari Power + Volume turun untuk screenshot): sembunyikan bubble sebentar.
              override fun onKeyEvent(event: KeyEvent?): Boolean {
                  if (event != null && event.keyCode == KeyEvent.KEYCODE_VOLUME_DOWN && event.action == KeyEvent.ACTION_DOWN) {
                      if (Pref.sembunyiSS(this)) OverlayService.instance?.sembunyiSementara(2500L)
                  }
                  return false
              }

              override fun onInterrupt() {}

              private val pesanTerlarang =
                  "Tidak diizinkan di aplikasi sensitif (bank, dompet digital, kata sandi). Matikan perlindungan di tab AI jika perlu."

              private fun terlarang(): Boolean {
                  if (!Pref.lindungi(this)) return false
                  val pkg = rootInActiveWindow?.packageName?.toString()
                  return Privasi.sensitifPkg(pkg)
              }

              fun global(action: Int, ok: String): String =
                  if (performGlobalAction(action)) ok else "Gagal"

              fun ketik(text: String): String {
                  if (terlarang()) return pesanTerlarang
                  val root = rootInActiveWindow ?: return "Layar tidak terbaca"
                  val node = root.findFocus(AccessibilityNodeInfo.FOCUS_INPUT) ?: findEditable(root)
                      ?: return "Tidak ada kolom input. Tap kolomnya dulu"
                  val args = Bundle()
                  args.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text)
                  return if (node.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)) {
                      "Mengetik: $text"
                  } else {
                      "Gagal mengetik"
                  }
              }

              fun tap(text: String): String {
                  if (terlarang()) return pesanTerlarang
                  val root = rootInActiveWindow ?: return "Layar tidak terbaca"
                  val nodes = root.findAccessibilityNodeInfosByText(text)
                  for (n in nodes) {
                      var x: AccessibilityNodeInfo? = n
                      while (x != null && !x.isClickable) x = x.parent
                      if (x != null && x.performAction(AccessibilityNodeInfo.ACTION_CLICK)) {
                          return "Tap: $text"
                      }
                  }
                  return "Tidak menemukan: $text"
              }

              // Ketuk elemen pertama yang cocok dengan salah satu kata (teks atau deskripsi ikon).
              fun tapPertama(daftar: List<String>, gagal: String): String {
                  if (terlarang()) return pesanTerlarang
                  val root = rootInActiveWindow ?: return "Layar tidak terbaca"
                  for (t in daftar) {
                      for (n in root.findAccessibilityNodeInfosByText(t)) {
                          var x: AccessibilityNodeInfo? = n
                          while (x != null && !x.isClickable) x = x.parent
                          if (x != null && x.performAction(AccessibilityNodeInfo.ACTION_CLICK)) return "Tap: $t"
                      }
                  }
                  return gagal
              }

              // Menekan tombol cari/enter di keyboard pada kolom yang sedang aktif.
              fun enter(): String {
                  if (terlarang()) return pesanTerlarang
                  val root = rootInActiveWindow ?: return "Layar tidak terbaca"
                  val node = root.findFocus(AccessibilityNodeInfo.FOCUS_INPUT) ?: findEditable(root)
                  if (node != null && Build.VERSION.SDK_INT >= 30) {
                      if (node.performAction(AccessibilityNodeInfo.AccessibilityAction.ACTION_IME_ENTER.id)) return "Enter"
                  }
                  return tapPertama(listOf("Cari", "Search", "Telusuri"), "Tidak menemukan tombol cari")
              }

              fun scroll(down: Boolean): String {
                  if (terlarang()) return pesanTerlarang
                  val root = rootInActiveWindow ?: return "Layar tidak terbaca"
                  val node = findScrollable(root) ?: return "Tidak ada yang bisa di-scroll"
                  val act = if (down) AccessibilityNodeInfo.ACTION_SCROLL_FORWARD
                  else AccessibilityNodeInfo.ACTION_SCROLL_BACKWARD
                  return if (node.performAction(act)) "Scroll" else "Gagal scroll"
              }

              fun tempel(): String {
                  if (terlarang()) return pesanTerlarang
                  val root = rootInActiveWindow ?: return "Layar tidak terbaca"
                  val node = root.findFocus(AccessibilityNodeInfo.FOCUS_INPUT) ?: findEditable(root)
                      ?: return "Tidak ada kolom input. Tap kolomnya dulu"
                  return if (node.performAction(AccessibilityNodeInfo.ACTION_PASTE)) "Menempel dari clipboard" else "Gagal menempel"
              }

              fun bacaLayar(): String {
                  val root = rootInActiveWindow ?: return ""
                  if (terlarang()) return ""
                  val sb = StringBuilder()
                  kumpul(root, sb)
                  return Privasi.samarkan(sb.toString().take(3000))
              }

              private fun kumpul(n: AccessibilityNodeInfo?, sb: StringBuilder) {
                  if (n == null || sb.length > 3000) return
                  if (n.isPassword) return
                  if (n.isVisibleToUser) {
                      val t = n.text?.toString() ?: n.contentDescription?.toString()
                      if (!t.isNullOrBlank()) {
                          sb.append(t.trim())
                          if (n.isClickable) sb.append(" [tombol]")
                          sb.append('\n')
                      }
                  }
                  for (i in 0 until n.childCount) kumpul(n.getChild(i), sb)
              }

              private fun findEditable(n: AccessibilityNodeInfo?): AccessibilityNodeInfo? {
                  if (n == null) return null
                  if (n.isEditable) return n
                  for (i in 0 until n.childCount) {
                      val r = findEditable(n.getChild(i))
                      if (r != null) return r
                  }
                  return null
              }

              private fun findScrollable(n: AccessibilityNodeInfo?): AccessibilityNodeInfo? {
                  if (n == null) return null
                  if (n.isScrollable) return n
                  for (i in 0 until n.childCount) {
                      val r = findScrollable(n.getChild(i))
                      if (r != null) return r
                  }
                  return null
              }
          }
