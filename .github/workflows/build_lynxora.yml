              private fun izinKontak(ctx: Context): Boolean =
                  ctx.checkSelfPermission(Manifest.permission.READ_CONTACTS) == PackageManager.PERMISSION_GRANTED

              private fun cariKontak(ctx: Context, nama: String): String? {
                  if (!izinKontak(ctx)) return null
                  var cur: android.database.Cursor? = null
                  return try {
                      cur = ctx.contentResolver.query(
                          ContactsContract.CommonDataKinds.Phone.CONTENT_URI,
                          arrayOf(ContactsContract.CommonDataKinds.Phone.NUMBER),
                          ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + " LIKE ?",
                          arrayOf("%" + nama + "%"),
                          ContactsContract.CommonDataKinds.Phone.DISPLAY_NAME + " ASC"
                      )
                      if (cur != null && cur.moveToFirst()) cur.getString(0) else null
                  } catch (e: Exception) {
                      null
                  } finally {
                      cur?.close()
                  }
              }

              private fun normalNomor(mentah: String): String {
                  val no = mentah.filter { it.isDigit() }
                  return if (no.startsWith("0")) "62" + no.drop(1) else if (no.startsWith("8")) "62$no" else no
              }

              private fun telepon(ctx: Context, rest: String): Hasil {
                  val adaHuruf = rest.any { it.isLetter() }
                  if (!adaHuruf && rest.count { it.isDigit() } >= 5) {
                      return start(ctx, Intent(Intent.ACTION_DIAL, Uri.parse("tel:" + Uri.encode(rest))), "Menelepon $rest")
                  }
                  if (!izinKontak(ctx)) return Hasil("Tidak ada izin Kontak. Izinkan di aplikasi Lynxora AI untuk menelepon lewat nama.", false)
                  val no = cariKontak(ctx, rest) ?: return Hasil("Tidak menemukan kontak: $rest", false)
                  return start(ctx, Intent(Intent.ACTION_DIAL, Uri.parse("tel:" + Uri.encode(no))), "Menelepon $rest")
              }

              private fun kirimWa(ctx: Context, s: String): Hasil {
                  val kata = s.split(" ").filter { it.isNotEmpty() }
                  if (kata.isEmpty()) return Hasil("Format: kirim wa <nomor atau nama> isi pesan", false)
                  var no = ""
                  var pakai = 0
                  if (kata[0].count { it.isDigit() } >= 8) {
                      no = normalNomor(kata[0])
                      pakai = 1
                  } else {
                      if (!izinKontak(ctx)) return Hasil("Tidak ada izin Kontak. Izinkan di aplikasi Lynxora AI, atau pakai nomor: kirim wa 0812xxxx pesan", false)
                      var n = minOf(3, kata.size)
                      while (n >= 1 && no.isEmpty()) {
                          val ketemu = cariKontak(ctx, kata.take(n).joinToString(" "))
                          if (ketemu != null) {
                              no = normalNomor(ketemu)
                              pakai = n
                          }
                          n--
                      }
                      if (no.isEmpty()) return Hasil("Tidak menemukan kontak: " + kata.take(2).joinToString(" "), false)
                  }
                  if (no.length < 8) return Hasil("Format: kirim wa 0812xxxx isi pesan", false)
                  val pesan = kata.drop(pakai).joinToString(" ")
                  val r = view(ctx, "https://wa.me/" + no + "?text=" + Uri.encode(pesan), "Membuka chat WhatsApp")
                  Handler(Looper.getMainLooper()).postDelayed({
                      val svc = AsistenAccessibilityService.instance
                      if (svc != null && pesan.isNotEmpty()) {
                          if (svc.tap("Kirim").startsWith("Tidak")) svc.tap("Send")
                      }
                  }, 3500)
                  return r
              }

