              private fun media(ctx: Context, a: String): Hasil? {
                  val kode = when {
                      a in setOf("jeda", "pause", "jeda musik", "pause musik") -> KeyEvent.KEYCODE_MEDIA_PAUSE
                      a in setOf("lanjut musik", "play musik", "putar musik", "lanjutkan musik") -> KeyEvent.KEYCODE_MEDIA_PLAY
                      a in setOf("lagu berikutnya", "lagu selanjutnya", "next", "skip lagu", "ganti lagu") -> KeyEvent.KEYCODE_MEDIA_NEXT
                      a in setOf("lagu sebelumnya", "sebelumnya", "previous", "prev") -> KeyEvent.KEYCODE_MEDIA_PREVIOUS
                      else -> return null
                  }
                  val am = ctx.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  am.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, kode))
                  am.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_UP, kode))
                  val teks = when (kode) {
                      KeyEvent.KEYCODE_MEDIA_PAUSE -> "Musik dijeda"
                      KeyEvent.KEYCODE_MEDIA_PLAY -> "Musik dilanjutkan"
                      KeyEvent.KEYCODE_MEDIA_NEXT -> "Lagu berikutnya"
                      else -> "Lagu sebelumnya"
                  }
                  return Hasil(teks, false)
              }

              private fun salinLayar(ctx: Context): Hasil {
                  val s = AsistenAccessibilityService.instance
                      ?: return Hasil("Tidak bisa: aktifkan layanan Aksesibilitas dulu", false)
                  val t = s.bacaLayar()
                  if (t.isBlank()) return Hasil("Tidak ada teks di layar yang bisa disalin", false)
                  val cm = ctx.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                  cm.setPrimaryClip(ClipData.newPlainText("Lynxora", t))
                  return Hasil("Teks layar disalin ke clipboard", false)
              }

              private fun bacaNotif(ctx: Context): Hasil {
                  if (NotifService.instance == null) {
                      try {
                          ctx.startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
                      } catch (e: Exception) {
                          // abaikan
                      }
                      return Hasil("Tidak bisa membaca notifikasi. Aktifkan akses notifikasi untuk Lynxora AI, lalu coba lagi.", false)
                  }
                  val l = NotifService.terbaru()
                  if (l.isEmpty()) return Hasil("Belum ada notifikasi baru sejak Lynxora aktif", false)
                  return Hasil(Privasi.samarkan(l.takeLast(10).reversed().joinToString("\n")), false)
              }

              private fun alarm(ctx: Context, s: String): Hasil {
                  val m = Regex("(\\d{1,2})(?:[.:](\\d{2}))?").find(s)
                      ?: return Hasil("Contoh: alarm jam 6.30", false)
                  var jam = m.groupValues[1].toInt()
                  val mnt = if (m.groupValues[2].isEmpty()) 0 else m.groupValues[2].toInt()
                  if ((s.contains("sore") || s.contains("malam")) && jam < 12) jam += 12
                  if (jam > 23 || mnt > 59) return Hasil("Jam tidak valid", false)
                  val i = Intent(AlarmClock.ACTION_SET_ALARM)
                      .putExtra(AlarmClock.EXTRA_HOUR, jam)
                      .putExtra(AlarmClock.EXTRA_MINUTES, mnt)
                      .putExtra(AlarmClock.EXTRA_MESSAGE, "Lynxora AI")
                      .putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                  return start(ctx, i, "Alarm dipasang " + String.format("%02d.%02d", jam, mnt))
              }

              private fun timer(ctx: Context, s: String): Hasil {
                  val m = Regex("(\\d+)\\s*(detik|dtk|menit|mnt|jam)?").find(s)
                      ?: return Hasil("Contoh: timer 5 menit", false)
                  val n = m.groupValues[1].toInt()
                  val u = m.groupValues[2]
                  val detik = when (u) {
                      "detik", "dtk" -> n
                      "jam" -> n * 3600
                      else -> n * 60
                  }
                  val satuan = if (u.isEmpty()) "menit" else u
                  val i = Intent(AlarmClock.ACTION_SET_TIMER)
                      .putExtra(AlarmClock.EXTRA_LENGTH, detik)
                      .putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                  return start(ctx, i, "Timer $n $satuan dimulai")
              }

