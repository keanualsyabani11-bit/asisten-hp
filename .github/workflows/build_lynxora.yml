          package com.asisten.hp

          import android.graphics.Typeface
          import android.text.Spanned
          import android.text.SpannableStringBuilder
          import android.text.style.StyleSpan
          import android.text.style.TypefaceSpan

          // Merapikan teks balasan: menghapus emoji dan menampilkan format sederhana (tebal, kode, judul).
          object Fmt {
              private val reEmoji = Regex(
                  "[\\x{1F000}-\\x{1FAFF}\\x{2600}-\\x{27BF}\\x{2B00}-\\x{2BFF}\\x{FE0F}\\x{200D}\\x{20E3}\\x{2190}-\\x{21FF}\\x{231A}-\\x{23FF}\\x{25A0}-\\x{25FF}]"
              )

              fun tanpaEmoji(t: String): String = reEmoji.replace(t, "")

              fun render(t: String): CharSequence {
                  val sb = SpannableStringBuilder()
                  val baris = tanpaEmoji(t).split("\n")
                  for ((i, mentah) in baris.withIndex()) {
                      var b = mentah
                      var judul = false
                      if (b.startsWith("#")) {
                          b = b.trimStart('#').trim()
                          judul = true
                      }
                      if (b.startsWith("* ")) b = "- " + b.substring(2)
                      val awal = sb.length
                      sebaris(sb, b)
                      if (judul) sb.setSpan(StyleSpan(Typeface.BOLD), awal, sb.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                      if (i < baris.size - 1) sb.append('\n')
                  }
                  return sb
              }

              private fun sebaris(sb: SpannableStringBuilder, b: String) {
                  var i = 0
                  while (i < b.length) {
                      if (b.startsWith("**", i)) {
                          val e = b.indexOf("**", i + 2)
                          if (e > i + 2) {
                              val s = sb.length
                              sb.append(b.substring(i + 2, e))
                              sb.setSpan(StyleSpan(Typeface.BOLD), s, sb.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                              i = e + 2
                              continue
                          }
                      }
                      if (b[i] == '`') {
                          val e = b.indexOf('`', i + 1)
                          if (e > i + 1) {
                              val s = sb.length
                              sb.append(b.substring(i + 1, e))
                              sb.setSpan(TypefaceSpan("monospace"), s, sb.length, Spanned.SPAN_EXCLUSIVE_EXCLUSIVE)
                              i = e + 1
                              continue
                          }
                      }
                      sb.append(b[i])
                      i++
                  }
              }
          }
