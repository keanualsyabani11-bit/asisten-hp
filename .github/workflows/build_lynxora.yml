              private fun startFg() {
                  val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(
                      NotificationChannel("lynxora", "Lynxora AI", NotificationManager.IMPORTANCE_LOW)
                  )
                  val stopPi = PendingIntent.getService(
                      this, 0, Intent(this, OverlayService::class.java).setAction("STOP"),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val bukaPi = PendingIntent.getService(
                      this, 1, Intent(this, OverlayService::class.java).setAction("BUKA"),
                      PendingIntent.FLAG_IMMUTABLE or PendingIntent.FLAG_UPDATE_CURRENT
                  )
                  val n: Notification = Notification.Builder(this, "lynxora")
                      .setContentTitle("Lynxora AI aktif")
                      .setContentText("Ketuk untuk membuka panel")
                      .setSmallIcon(R.drawable.ic_notif)
                      .setContentIntent(bukaPi)
                      .addAction(Notification.Action.Builder(Icon.createWithResource(this, R.drawable.ic_close), "Hentikan", stopPi).build())
                      .build()
                  val mic = checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED
                  if (Build.VERSION.SDK_INT >= 34) {
                      var t = ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE
                      if (mic) t = t or ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE
                      startForeground(1, n, t)
                  } else if (Build.VERSION.SDK_INT >= 30 && mic) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                  } else if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, n, 0)
                  } else {
                      startForeground(1, n)
                  }
              }

              // ---------- helper tampilan ----------

              private fun dp(v: Int) = ui.dp(v)

              private fun bulat(v: View) {
                  v.outlineProvider = object : ViewOutlineProvider() {
                      override fun getOutline(view: View, outline: Outline) {
                          outline.setOval(0, 0, view.width, view.height)
                      }
                  }
                  v.clipToOutline = true
              }

              private fun draggable(v: View, lp: WindowManager.LayoutParams, target: View, onTap: (() -> Unit)? = null, onRelease: (() -> Unit)? = null, onDown: (() -> Unit)? = null) {
                  var sx = 0
                  var sy = 0
                  var tx = 0f
                  var ty = 0f
                  var moved = false
                  v.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              onDown?.invoke()
                              sx = lp.x; sy = lp.y; tx = e.rawX; ty = e.rawY; moved = false
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (e.rawX - tx).toInt()
                              val dy = (e.rawY - ty).toInt()
                              if (abs(dx) > dp(5) || abs(dy) > dp(5)) moved = true
                              if (moved) {
                                  lp.x = sx + dx
                                  lp.y = sy + dy
                                  try { wm.updateViewLayout(target, lp) } catch (ex: Exception) {}
                              }
                          }
                          MotionEvent.ACTION_UP -> {
                              if (!moved) onTap?.invoke() else onRelease?.invoke()
                          }
                      }
                      true
                  }
              }

              // ---------- bubble (orb) ----------

              private fun ukuranOrb(): Int = dp(listOf(46, 56, 68)[Pref.ukuranOrb(this)])

              private fun buildOrb() {
                  val s = ukuranOrb()
                  val ring = FrameLayout(this)
                  val bg = GradientDrawable()
                  bg.shape = GradientDrawable.OVAL
                  bg.setColor(Color.parseColor("#000000"))
                  bg.setStroke(dp(2), Color.parseColor(T.accent))
                  ring.background = bg
                  ring.setPadding(dp(4), dp(4), dp(4), dp(4))
                  val img = ImageView(this)
                  img.setImageResource(R.drawable.logo)
                  img.scaleType = ImageView.ScaleType.CENTER_CROP
                  bulat(img)
                  ring.addView(img, FrameLayout.LayoutParams(MATCH, MATCH))
                  orbDot = GradientDrawable()
                  orbDot.shape = GradientDrawable.OVAL
                  orbDot.setColor(Color.parseColor(T.ok))
                  orbDot.setStroke(dp(2), Color.parseColor("#000000"))
                  val dot = View(this)
                  dot.background = orbDot
                  val dl = FrameLayout.LayoutParams(dp(14), dp(14))
                  dl.gravity = Gravity.BOTTOM or Gravity.END
                  ring.addView(dot, dl)
                  ring.alpha = listOf(0.55f, 0.8f, 1f)[Pref.opasitasOrb(this)]
                  orb = ring
                  orbLp = WindowManager.LayoutParams(
                      s, s,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or
                          WindowManager.LayoutParams.FLAG_LAYOUT_NO_LIMITS,
                      PixelFormat.TRANSLUCENT
                  )
                  orbLp.gravity = Gravity.TOP or Gravity.START
                  orbLp.x = dp(10)
                  orbLp.y = dp(160)
                  draggable(orb, orbLp, orb, onTap = { expand() }, onRelease = { snapOrb() }, onDown = { unpeek() })
              }

              private fun snapOrb() {
                  val sw = resources.displayMetrics.widthPixels
                  val size = ukuranOrb()
                  orbLp.x = if (orbLp.x + size / 2 < sw / 2) dp(6) else sw - size - dp(6)
                  try { wm.updateViewLayout(orb, orbLp) } catch (e: Exception) {}
                  jadwalkanPeek()
              }

              // ---------- bubble menempel setengah di tepi layar saat tidak disentuh ----------

              private var peeking = false
              private var orbXNormal = 0
              private val peekRun = Runnable { peekOrb() }

              private fun jadwalkanPeek() {
                  h.removeCallbacks(peekRun)
                  if (Pref.peek(this)) h.postDelayed(peekRun, 3500)
              }

              private fun peekOrb() {
                  if (expanded || sembunyiOtomatis || peeking) return
                  val sw = resources.displayMetrics.widthPixels
                  val size = ukuranOrb()
                  orbXNormal = orbLp.x
                  orbLp.x = if (orbLp.x + size / 2 < sw / 2) -(size * 45 / 100) else sw - (size * 55 / 100)
                  peeking = true
                  try {
                      wm.updateViewLayout(orb, orbLp)
                  } catch (e: Exception) {
                      peeking = false
                      orbLp.x = orbXNormal
                  }
              }

              private fun unpeek() {
                  h.removeCallbacks(peekRun)
                  if (!peeking) return
                  peeking = false
                  orbLp.x = orbXNormal
                  try { wm.updateViewLayout(orb, orbLp) } catch (e: Exception) {}
              }

