          package com.asisten.hp

          import android.content.Context
          import android.content.res.ColorStateList
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.Drawable
          import android.graphics.drawable.GradientDrawable
          import android.graphics.drawable.RippleDrawable
          import android.text.InputType
          import android.view.Gravity
          import android.view.View
          import android.view.ViewGroup
          import android.widget.EditText
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.Switch
          import android.widget.TextView

          // Palet warna. Dibaca ulang lewat T.muat() setiap layar dibuat.
          object T {
              @Volatile var gelap = true

              fun muat(c: Context) {
                  gelap = Pref.gelap(c)
              }

              // Palet mengikuti logo: hitam, arang, dan perak gradasi. Tanpa warna lain.
              val bg: String get() = if (gelap) "#000000" else "#F3F3F4"
              val surface: String get() = if (gelap) "#0C0C0D" else "#FFFFFF"
              val surface2: String get() = if (gelap) "#171718" else "#EBEBED"
              val border: String get() = if (gelap) "#28282A" else "#D9D9DC"
              val text: String get() = if (gelap) "#F2F2F3" else "#0E0E10"
              val muted: String get() = if (gelap) "#8C8C91" else "#66666B"
              val accent: String get() = if (gelap) "#D9D9DC" else "#1A1A1C"
              val aksenAtas: String get() = if (gelap) "#F7F7F8" else "#2C2C2F"
              val aksenBawah: String get() = if (gelap) "#AEAEB3" else "#0A0A0B"
              val onAccent: String get() = if (gelap) "#0A0A0B" else "#FFFFFF"
              val ok: String get() = if (gelap) "#E4E4E6" else "#1A1A1C"
              val warn: String get() = if (gelap) "#8C8C91" else "#77777C"
              val err: String get() = if (gelap) "#E5605B" else "#C93A35"
          }

          // Pembantu pembuat tampilan lewat kode.
          class Ui(val c: Context) {
              val WRAP = ViewGroup.LayoutParams.WRAP_CONTENT
              val MATCH = ViewGroup.LayoutParams.MATCH_PARENT

              fun dp(v: Int): Int = (v * c.resources.displayMetrics.density).toInt()
              fun col(s: String): Int = Color.parseColor(s)

              fun redup(hex: String, a: Int): Int {
                  val k = col(hex)
                  return Color.argb(a, Color.red(k), Color.green(k), Color.blue(k))
              }

              fun shapeI(fill: Int, r: Int, stroke: Int?): GradientDrawable {
                  val g = GradientDrawable()
                  g.setColor(fill)
                  g.cornerRadius = dp(r).toFloat()
                  if (stroke != null) g.setStroke(dp(1), stroke)
                  return g
              }

              fun shape(fill: String, r: Int, stroke: String? = null): GradientDrawable =
                  shapeI(col(fill), r, if (stroke == null) null else col(stroke))

              fun oval(fill: String, stroke: String? = null): GradientDrawable {
                  val g = GradientDrawable()
                  g.shape = GradientDrawable.OVAL
                  g.setColor(col(fill))
                  if (stroke != null) g.setStroke(dp(1), col(stroke))
                  return g
              }

              // Gradasi perak seperti pada logo (hitam penuh di tema terang).
              fun gradAksen(r: Int): GradientDrawable {
                  val g = GradientDrawable(
                      GradientDrawable.Orientation.TOP_BOTTOM,
                      intArrayOf(col(T.aksenAtas), col(T.aksenBawah))
                  )
                  g.cornerRadius = dp(r).toFloat()
                  return g
              }

              fun logam(r: Int): Drawable {
                  val mask = GradientDrawable()
                  mask.setColor(Color.WHITE)
                  mask.cornerRadius = dp(r).toFloat()
                  val warna = ColorStateList.valueOf(if (T.gelap) 0x33000000 else 0x33FFFFFF)
                  return RippleDrawable(warna, gradAksen(r), mask)
              }

              fun logamOval(): Drawable {
                  val g = gradAksen(0)
                  g.shape = GradientDrawable.OVAL
                  val mask = GradientDrawable()
                  mask.shape = GradientDrawable.OVAL
                  mask.setColor(Color.WHITE)
                  val warna = ColorStateList.valueOf(if (T.gelap) 0x33000000 else 0x33FFFFFF)
                  return RippleDrawable(warna, g, mask)
              }

              fun ripple(fill: String, r: Int, stroke: String? = null): Drawable {
                  val base = shape(fill, r, stroke)
                  val mask = GradientDrawable()
                  mask.setColor(Color.WHITE)
                  mask.cornerRadius = dp(r).toFloat()
                  val warna = ColorStateList.valueOf(if (T.gelap) 0x33FFFFFF else 0x22000000)
                  return RippleDrawable(warna, base, mask)
              }

              fun rippleOval(fill: String, stroke: String? = null): Drawable {
                  val base = oval(fill, stroke)
                  val mask = GradientDrawable()
                  mask.shape = GradientDrawable.OVAL
                  mask.setColor(Color.WHITE)
                  val warna = ColorStateList.valueOf(if (T.gelap) 0x33FFFFFF else 0x22000000)
                  return RippleDrawable(warna, base, mask)
              }

              fun text(t: CharSequence, size: Float, color: String, bold: Boolean = false): TextView {
                  val v = TextView(c)
                  v.text = t
                  v.textSize = size
                  v.setTextColor(col(color))
                  if (bold) v.typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                  return v
              }

              fun lp(top: Int = 0, w: Int = MATCH, h: Int = WRAP): LinearLayout.LayoutParams {
                  val p = LinearLayout.LayoutParams(w, h)
                  p.topMargin = dp(top)
                  return p
              }

              fun bobot(): LinearLayout.LayoutParams = LinearLayout.LayoutParams(0, WRAP, 1f)

              fun label(t: String): TextView {
                  val v = text(t, 11f, T.muted, true)
                  v.letterSpacing = 0.1f
                  return v
              }

              fun kartu(): LinearLayout {
                  val l = LinearLayout(c)
                  l.orientation = LinearLayout.VERTICAL
                  l.background = shape(T.surface, 20, T.border)
                  l.setPadding(dp(18), dp(18), dp(18), dp(18))
                  return l
              }

              fun garis(): View {
                  val v = View(c)
                  v.setBackgroundColor(col(T.border))
                  return v
              }

              // jenis: 0 utama, 1 sekunder, 2 teks saja
              fun tombol(label: String, jenis: Int, onClick: () -> Unit): TextView {
                  val fill: String
                  val fg: String
                  val garisTepi: String?
                  when (jenis) {
                      0 -> {
                          fill = T.accent
                          fg = T.onAccent
                          garisTepi = null
                      }
                      1 -> {
                          fill = T.surface2
                          fg = T.text
                          garisTepi = T.border
                      }
                      else -> {
                          fill = "#00000000"
                          fg = T.muted
                          garisTepi = null
                      }
                  }
                  val v = text(label, 14.5f, fg, true)
                  v.gravity = Gravity.CENTER
                  v.background = if (jenis == 0) logam(14) else ripple(fill, 14, garisTepi)
                  v.setPadding(dp(16), dp(14), dp(16), dp(14))
                  v.setOnClickListener { onClick() }
                  return v
              }

              fun tombolKecil(label: String, onClick: () -> Unit): TextView {
                  val v = text(label, 12.5f, T.text, true)
                  v.gravity = Gravity.CENTER
                  v.background = ripple(T.surface2, 10, T.border)
                  v.setPadding(dp(14), dp(8), dp(14), dp(8))
                  v.setOnClickListener { onClick() }
                  return v
              }

              fun pil(teks: String, warna: String): TextView {
                  val v = text(teks, 11.5f, warna, true)
                  v.setPadding(dp(10), dp(4), dp(10), dp(4))
                  v.background = shapeI(redup(warna, 38), 20, null)
                  return v
              }

              fun ikon(res: Int, tint: String, pad: Int): ImageView {
                  val v = ImageView(c)
                  v.setImageResource(res)
                  v.setColorFilter(col(tint))
                  v.setPadding(dp(pad), dp(pad), dp(pad), dp(pad))
                  return v
              }

              fun isian(hint: String, nilai: String, rahasia: Boolean, uri: Boolean = false): EditText {
                  val e = EditText(c)
                  e.setText(nilai)
                  e.hint = hint
                  e.setHintTextColor(redup(T.muted, 170))
                  e.setTextColor(col(T.text))
                  e.textSize = 14f
                  e.setSingleLine()
                  e.inputType = if (rahasia) {
                      InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_PASSWORD
                  } else if (uri) {
                      InputType.TYPE_CLASS_TEXT or InputType.TYPE_TEXT_VARIATION_URI
                  } else {
                      InputType.TYPE_CLASS_TEXT
                  }
                  e.background = shape(T.surface2, 12, T.border)
                  e.setPadding(dp(14), dp(12), dp(14), dp(12))
                  return e
              }

              // Pilihan satu dari beberapa, berbentuk segmen.
              fun segmen(opsi: List<String>, awal: Int, onPilih: (Int) -> Unit): LinearLayout {
                  val box = LinearLayout(c)
                  box.orientation = LinearLayout.HORIZONTAL
                  box.background = shape(T.surface2, 13, T.border)
                  box.setPadding(dp(3), dp(3), dp(3), dp(3))
                  val daftar = ArrayList<TextView>()
                  fun warna(sel: Int) {
                      for ((i, t) in daftar.withIndex()) {
                          val on = i == sel
                          t.setTextColor(col(if (on) T.onAccent else T.muted))
                          t.background = if (on) gradAksen(10) else null
                      }
                  }
                  for ((i, o) in opsi.withIndex()) {
                      val t = text(o, 12.5f, T.muted, true)
                      t.gravity = Gravity.CENTER
                      t.setPadding(dp(4), dp(10), dp(4), dp(10))
                      t.setOnClickListener {
                          warna(i)
                          onPilih(i)
                      }
                      daftar.add(t)
                      box.addView(t, bobot())
                  }
                  warna(awal)
                  return box
              }

              fun saklar(judul: String, desc: String, awal: Boolean, onUbah: (Boolean) -> Unit): LinearLayout {
                  val kiri = LinearLayout(c)
                  kiri.orientation = LinearLayout.VERTICAL
                  kiri.addView(text(judul, 14.5f, T.text, true))
                  kiri.addView(text(desc, 12f, T.muted), lp(2))
                  val sw = Switch(c)
                  sw.isChecked = awal
                  val states = arrayOf(intArrayOf(android.R.attr.state_checked), intArrayOf())
                  sw.thumbTintList = ColorStateList(states, intArrayOf(col(T.accent), col(T.muted)))
                  sw.trackTintList = ColorStateList(states, intArrayOf(redup(T.accent, 90), col(T.border)))
                  sw.setOnCheckedChangeListener { _, v -> onUbah(v) }
                  val row = LinearLayout(c)
                  row.orientation = LinearLayout.HORIZONTAL
                  row.gravity = Gravity.CENTER_VERTICAL
                  row.addView(kiri, bobot())
                  val sl = LinearLayout.LayoutParams(WRAP, WRAP)
                  sl.leftMargin = dp(12)
                  row.addView(sw, sl)
                  row.setOnClickListener { sw.toggle() }
                  return row
              }
          }
