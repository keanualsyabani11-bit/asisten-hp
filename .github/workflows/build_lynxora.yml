              // ---------- chat ----------

              private val riwayat = mutableListOf<Pair<Boolean, String>>()
              private var typing: View? = null

              private fun scrollBawah() {
                  scroll.post { scroll.fullScroll(View.FOCUS_DOWN) }
              }

              private fun addMsg(pesan: String, user: Boolean, simpan: Boolean = true) {
                  val tv = TextView(this)
                  tv.text = if (user) pesan else Fmt.render(pesan)
                  tv.setTextColor(Color.parseColor(if (user) T.onAccent else T.text))
                  tv.textSize = 14f
                  tv.maxWidth = dp(262)
                  tv.setLineSpacing(0f, 1.12f)
                  tv.setPadding(dp(13), dp(9), dp(13), dp(9))
                  val r = dp(16).toFloat()
                  val k = dp(4).toFloat()
                  val g = if (user) ui.gradAksen(0) else GradientDrawable()
                  if (!user) g.setColor(Color.parseColor(T.surface2))
                  g.cornerRadii = if (user) floatArrayOf(r, r, r, r, k, k, r, r) else floatArrayOf(k, k, r, r, r, r, r, r)
                  tv.background = g
                  tv.setOnLongClickListener {
                      val cm = getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
                      cm.setPrimaryClip(ClipData.newPlainText("Lynxora", pesan))
                      Toast.makeText(this, "Disalin", Toast.LENGTH_SHORT).show()
                      true
                  }
                  val p = LinearLayout.LayoutParams(WRAP, WRAP)
                  p.gravity = if (user) Gravity.END else Gravity.START
                  p.topMargin = dp(3)
                  p.bottomMargin = dp(3)
                  log.addView(tv, p)
                  if (log.childCount > 50) log.removeViewAt(0)
                  if (simpan) {
                      riwayat.add(Pair(user, pesan))
                      while (riwayat.size > 200) riwayat.removeAt(0)
                      Store.simpanChat(this, riwayat)
                  }
                  scrollBawah()
              }

              // baris kecil untuk langkah yang sedang dijalankan
              private fun addAksi(teks: String) {
                  val v = ui.text("Menjalankan: " + teks, 11.5f, T.muted)
                  v.setPadding(dp(4), dp(2), dp(4), dp(2))
                  log.addView(v)
                  if (log.childCount > 50) log.removeViewAt(0)
                  scrollBawah()
              }

              private fun showTyping(label: String) {
                  removeTyping()
                  labelKerja = label
                  mulaiKerja = SystemClock.elapsedRealtime()
                  val v = ui.text("$label...", 12f, T.muted)
                  v.setPadding(dp(4), dp(6), dp(4), dp(6))
                  typing = v
                  log.addView(v)
                  scrollBawah()
                  h.removeCallbacks(ticker)
                  h.postDelayed(ticker, 1000)
              }

              private fun removeTyping() {
                  h.removeCallbacks(ticker)
                  val v = typing
                  if (v != null) log.removeView(v)
                  typing = null
              }

              private val ticker = object : Runnable {
                  override fun run() {
                      val v = typing as? TextView ?: return
                      val d = ((SystemClock.elapsedRealtime() - mulaiKerja) / 1000).toInt()
                      var t = labelKerja + " " + d.toString() + " dtk"
                      if (d >= 12) t += ". Ketuk tombol merah untuk membatalkan."
                      v.text = t
                      setStatus(labelKerja + " " + d.toString() + " dtk", T.accent)
                      h.postDelayed(this, 1000)
                  }
              }

              // ---------- alur perintah ----------

              private fun mulaiTugas(): Int {
                  gen++
                  sibuk = true
                  return gen
              }

              private fun selesaiTugas(g: Int) {
                  if (g != gen) return
                  sibuk = false
                  updateStatus()
              }

              private fun batalkan() {
                  gen++
                  sibuk = false
                  pending = null
                  removeTyping()
                  updateStatus()
                  addMsg("Dibatalkan.", false)
              }

              private fun kirim(cmd: String, suara: Boolean) {
                  val t = cmd.trim()
                  if (t.isEmpty()) return
                  hapusSaran()
                  imm.hideSoftInputFromWindow(input.windowToken, 0)
                  input.setText("")
                  input.clearFocus()
                  setFocusable(false)
                  terakhirSuara = suara
                  val tl = t.lowercase()
                  if (tl in setOf("bersihkan", "clear", "hapus chat")) {
                      log.removeAllViews()
                      Ai.reset()
                      pending = null
                      riwayat.clear()
                      Store.simpanChat(this, riwayat)
                      addMsg("Chat dibersihkan.", false, false)
                      return
                  }
                  addMsg(t, true)
                  if (tl in setOf("stop", "batal", "berhenti")) {
                      if (sibuk) batalkan() else addMsg("Tidak ada tugas yang sedang berjalan.", false)
                      return
                  }
                  if (sibuk) {
                      addMsg("Aku masih bekerja. Ketuk tombol merah untuk membatalkan.", false)
                      return
                  }
                  val p = pending
                  if (p != null) {
                      pending = null
                      if (tl in kataYa) {
                          jalankanPending(p)
                          return
                      }
                  }
                  h.postDelayed({ proses(t, suara) }, 200)
              }

              private fun jalankanPending(p: List<String>) {
                  val g = mulaiTugas()
                  setStatus("Bekerja", T.accent)
                  jalankan(g, p) { _, gagal ->
                      selesaiTugas(g)
                      if (!gagal) h.postDelayed({ collapse() }, 1500)
                  }
              }

              private fun proses(t: String, suara: Boolean) {
                  val tl = t.lowercase()
                  val kata = tl.split(" ").filter { it.isNotEmpty() }
                  val ai = Ai.siap(this)
                  if (tl == "makro" || tl.startsWith("makro ") || tl.startsWith("jalankan ")) {
                      if (tanganiMakro(t)) return
                  }
                  if (ai && (tl.startsWith("tanya ") || tl.startsWith("ai "))) {
                      tanyaAi(t.substringAfter(" ").trim(), suara)
                      return
                  }
                  if (tl == "mode" || tl.startsWith("mode ")) {
                      if (tanganiMode(tl)) return
                  }
                  // perintah majemuk yang bisa dikerjakan langsung tanpa AI
                  val rencana = Planner.pecah(t)
                  if (rencana != null) {
                      val g = mulaiTugas()
                      setStatus("Bekerja", T.accent)
                      jalankan(g, rencana) { _, gagal ->
                          selesaiTugas(g)
                          if (!gagal) h.postDelayed({ collapse() }, 1500)
                      }
                      return
                  }
                  val lokalDulu = !ai || kata.size <= 4 || kata[0] in verbLokal
                  if (lokalDulu) {
                      val r = try {
                          Executor.run(this, t)
                      } catch (e: Exception) {
                          Hasil("Terjadi kesalahan", false)
                      }
                      if (r.paham || !ai) {
                          addMsg(r.teks, false)
                          updateStatus()
                          balasSuara(suara, r.teks)
                          if (!r.paham) addMsg("Tip: isi kunci AI di aplikasi Lynxora supaya aku bisa menjawab apa saja.", false)
                          if (r.tutup) h.postDelayed({ collapse() }, 900)
                          return
                      }
                  }
                  tanyaAi(t, suara)
              }

              private fun jalankanMakro(nama: String, aksi: List<String>) {
                  val g = mulaiTugas()
                  setStatus("Menjalankan makro", T.accent)
                  addMsg("Menjalankan makro " + nama + " (" + aksi.size.toString() + " langkah)", false)
                  jalankan(g, aksi) { _, gagal ->
                      selesaiTugas(g)
                      if (!gagal) h.postDelayed({ collapse() }, 1500)
                  }
              }

              private fun tanganiMakro(t: String): Boolean {
                  val orig = t.trim()
                  val tl = orig.lowercase()
                  val data = Store.makro(this)
                  if (tl.startsWith("jalankan ")) {
                      val nama = tl.removePrefix("jalankan ").trim()
                      val aksi = data[nama] ?: return false
                      jalankanMakro(nama, aksi)
                      return true
                  }
                  val rest = orig.substring(5).trim()
                  val restL = rest.lowercase()
                  if (restL.isEmpty() || restL == "daftar" || restL == "list") {
                      val teks = if (data.isEmpty()) {
                          "Belum ada makro. Contoh: makro simpan pagi = buka wa; senter nyala"
                      } else {
                          data.entries.joinToString("\n") { "- " + it.key + ": " + it.value.joinToString("; ") }
                      }
                      addMsg(teks, false)
                      return true
                  }
                  if (restL.startsWith("simpan ") || restL.startsWith("buat ")) {
                      val isi = rest.substringAfter(" ").trim()
                      val nama = isi.substringBefore("=").trim().lowercase()
                      val aksi = isi.substringAfter("=", "").split(";").map { it.trim() }.filter { it.isNotEmpty() }
                      if (nama.isEmpty() || aksi.isEmpty()) {
                          addMsg("Format: makro simpan <nama> = perintah1; perintah2", false)
                          return true
                      }
                      Store.simpanMakro(this, nama, aksi)
                      addMsg("Makro " + nama + " disimpan (" + aksi.size.toString() + " langkah). Jalankan dengan: makro " + nama, false)
                      return true
                  }
                  if (restL.startsWith("hapus ")) {
                      val nama = restL.removePrefix("hapus ").trim()
                      addMsg(if (Store.hapusMakro(this, nama)) "Makro " + nama + " dihapus" else "Makro tidak ditemukan: " + nama, false)
                      return true
                  }
                  val aksi = data[restL]
                  if (aksi != null) {
                      jalankanMakro(restL, aksi)
                      return true
                  }
                  addMsg("Makro tidak ditemukan: " + restL + ". Ketik makro daftar.", false)
                  return true
              }

              private fun tanyaAi(t: String, suara: Boolean) {
                  if (!Ai.siap(this)) {
                      addMsg("Aku belum punya kunci AI. Buka aplikasi Lynxora AI, tab Pengaturan, lalu isi kunci API.", false)
                      return
                  }
                  var pesan = t
                  val tl = t.lowercase()
                  val perluLayar = Ai.bolehLayar(this) && !tl.contains("notif") &&
                      Regex("layar|halaman|rangkum|ringkas|chat ini|pesan ini|yang ini|di sini").containsMatchIn(tl)
                  if (perluLayar) {
                      val l = AsistenAccessibilityService.instance?.bacaLayar() ?: ""
                      if (l.isNotBlank()) pesan = t + "\n\nLayar saat ini:\n" + l
                  }
                  val g = mulaiTugas()
                  langkah(pesan, 0, suara, g)
              }

              // Untuk teks yang dibagikan dari aplikasi lain.
              private fun tanyaLangsung(tampil: String, pesan: String) {
                  if (!Ai.siap(this)) {
                      addMsg("Aku belum punya kunci AI. Isi dulu di aplikasi Lynxora AI, tab Pengaturan.", false)
                      return
                  }
                  if (sibuk) {
                      addMsg("Aku masih bekerja. Coba bagikan lagi setelah selesai.", false)
                      return
                  }
                  addMsg(tampil, true)
                  val g = mulaiTugas()
                  langkah(pesan, 0, false, g)
              }

              private fun langkah(pesan: String, n: Int, suara: Boolean, g: Int) {
                  setStatus("Menghubungi AI", T.accent)
                  showTyping("Berpikir")
                  Thread {
                      val res = Ai.tanya(this, pesan)
                      h.post {
                          if (g != gen) return@post
                          removeTyping()
                          if (!res.ok) {
                              selesaiTugas(g)
                              addMsg(res.teks, false)
                              Store.catatLog(this, "AI gagal: " + res.teks)
                              return@post
                          }
                          val r = Ai.urai(res.teks)
                          if (r.balas.isNotBlank()) {
                              addMsg(r.balas, false)
                              balasSuara(suara, r.balas)
                          }
                          val aksi = if (Pref.bolehKontrol(this)) r.aksi else emptyList()
                          if (aksi.isEmpty()) {
                              selesaiTugas(g)
                              addSaran(r.saran)
                              return@post
                          }
                          val butuh = aksi.any { a -> perluKonfirm.any { a.lowercase().startsWith(it) } }
                          if (butuh) {
                              selesaiTugas(g)
                              konfirmasi(aksi)
                              return@post
                          }
                          setStatus("Bekerja", T.accent)
                          jalankan(g, aksi) { hasil, gagal ->
                              if (r.lanjut && n < batasLangkah) {
                                  setStatus("Melihat layar", T.accent)
                                  val layar = if (Ai.bolehLayar(this)) (AsistenAccessibilityService.instance?.bacaLayar() ?: "") else ""
                                  langkah("Hasil aksi:\n" + hasil + "\nLayar sekarang:\n" + layar, n + 1, suara, g)
                              } else {
                                  if (r.lanjut) addMsg("Aku berhenti di sini karena sudah banyak langkah. Katakan lagi kalau mau lanjut.", false)
                                  selesaiTugas(g)
                                  if (!gagal) h.postDelayed({ collapse() }, 1500)
                              }
                          }
                      }
                  }.start()
              }

              private fun konfirmasi(aksi: List<String>) {
                  pending = aksi
                  addMsg("Aku perlu persetujuanmu untuk menjalankan:\n" + aksi.joinToString("\n") { "- " + it }, false)
                  barisKonfirmasi(
                      {
                          val p = pending
                          pending = null
                          if (p != null) jalankanPending(p)
                      },
                      {
                          pending = null
                          addMsg("Dibatalkan.", false)
                      }
                  )
              }

              private fun barisKonfirmasi(onYa: () -> Unit, onTidak: () -> Unit) {
                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  val ya = ui.tombolKecil("Lanjutkan") {}
                  ya.setTextColor(Color.parseColor(T.onAccent))
                  ya.background = ui.logam(10)
                  val tdk = ui.tombolKecil("Batal") {}
                  ya.setOnClickListener {
                      log.removeView(row)
                      onYa()
                  }
                  tdk.setOnClickListener {
                      log.removeView(row)
                      onTidak()
                  }
                  val a = LinearLayout.LayoutParams(WRAP, WRAP)
                  a.rightMargin = dp(8)
                  row.addView(ya, a)
                  row.addView(tdk)
                  val lp = LinearLayout.LayoutParams(WRAP, WRAP)
                  lp.topMargin = dp(2)
                  lp.bottomMargin = dp(4)
                  log.addView(row, lp)
                  scrollBawah()
              }

              private val reBerisiko = Regex(
                  "(?i)hapus|bayar|transfer|kirim uang|beli|checkout|pembayaran|keluar|logout|reset|format|delete|remove|pay|buy|send money|uninstall|copot|konfirmasi"
              )
              private val reTap = Regex("^(?:tap|klik|ketuk|pencet|tekan)\\s+(.+)$", RegexOption.IGNORE_CASE)

              // Menunggu sampai ada jendela aplikasi lain yang muncul (aplikasi sudah terbuka), maksimal sekitar 3,5 detik.
              private fun tungguJendela(g: Int, tandai: Int, t0: Long, lanjut: () -> Unit) {
                  if (g != gen) return
                  val svc = AsistenAccessibilityService.instance
                  val lewat = SystemClock.elapsedRealtime() - t0
                  val sudah = svc == null || (svc.jumlahGanti > tandai && lewat > 350)
                  if (sudah) {
                      h.postDelayed({ lanjut() }, 650)
                      return
                  }
                  if (lewat > 3500) {
                      lanjut()
                      return
                  }
                  h.postDelayed({ tungguJendela(g, tandai, t0, lanjut) }, 150)
              }

              private fun jalankan(g: Int, list: List<String>, kelar: (String, Boolean) -> Unit) {
                  val hasil = StringBuilder()
                  var gagal = false
                  fun satu(i: Int, lewati: Boolean = false) {
                      if (g != gen) return
                      if (i >= list.size) {
                          kelar(if (hasil.isEmpty()) "selesai" else hasil.toString(), gagal)
                          return
                      }
                      val a = list[i].trim()
                      val al = a.lowercase()
                      if (al.startsWith("tunggu")) {
                          val d = (Regex("\\d+").find(al)?.value?.toLongOrNull() ?: 2L).coerceIn(1L, 10L)
                          h.postDelayed({ satu(i + 1) }, d * 1000)
                          return
                      }
                      // ketukan yang bisa berdampak besar (hapus, bayar, transfer, dan sejenisnya) perlu persetujuan
                      val mt = reTap.find(a)
                      if (mt != null && !lewati && reBerisiko.containsMatchIn(mt.groupValues[1])) {
                          setStatus("Menunggu persetujuan", T.accent)
                          addMsg("Aksi ini bisa berdampak besar:\n" + a + "\nLanjutkan?", false)
                          barisKonfirmasi(
                              {
                                  if (g == gen) {
                                      setStatus("Bekerja", T.accent)
                                      satu(i, true)
                                  }
                              },
                              {
                                  if (g == gen) {
                                      addMsg("Dibatalkan.", false)
                                      selesaiTugas(g)
                                  }
                              }
                          )
                          return
                      }
                      addAksi(a)
                      val svc = AsistenAccessibilityService.instance
                      val tandai = svc?.jumlahGanti ?: 0
                      val t0 = SystemClock.elapsedRealtime()
                      val r = try {
                          Executor.run(this, a)
                      } catch (e: Exception) {
                          Hasil("Gagal menjalankan", false)
                      }
                      hasil.append(a).append(" -> ").append(r.teks).append("\n")
                      val gagalIni = !r.paham || r.teks.startsWith("Gagal") || r.teks.startsWith("Tidak") ||
                          r.teks.startsWith("Aplikasi tidak") || r.teks.startsWith("Layar")
                      if (gagalIni) {
                          gagal = true
                          addMsg(r.teks, false)
                      } else if (!r.tutup && r.teks.length > 25) {
                          // hasil berupa informasi (daftar, jawaban hitungan, dan sebagainya)
                          addMsg(r.teks, false)
                      }
                      val peluncur = al.startsWith("buka") || al.startsWith("kirim wa") || al.startsWith("youtube") ||
                          al.startsWith("cari") || al.startsWith("maps") || al.startsWith("spotify") ||
                          al.startsWith("arahkan") || al.startsWith("telepon")
                      if (peluncur && svc != null && !gagalIni) {
                          tungguJendela(g, tandai, t0) { satu(i + 1) }
                      } else {
                          val jeda = if (peluncur) 2800L else 1200L
                          h.postDelayed({ satu(i + 1) }, jeda)
                      }
                  }
                  satu(0)
              }

              // ---------- saran balasan ----------

              private var saranView: View? = null

              private fun hapusSaran() {
                  val v = saranView
                  if (v != null) log.removeView(v)
                  saranView = null
              }

              private fun addSaran(list: List<String>) {
                  hapusSaran()
                  if (list.isEmpty()) return
                  val hs = HorizontalScrollView(this)
                  hs.isHorizontalScrollBarEnabled = false
                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
