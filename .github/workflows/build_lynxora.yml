          package com.asisten.hp

          // Memecah perintah majemuk menjadi beberapa langkah lokal, tanpa memanggil AI.
          // Contoh: "buka yt lalu cari lagu santai" -> ["youtube lagu santai"]
          object Planner {
              private val sambung = Regex("\\s+(?:lalu|terus|kemudian|habis itu|abis itu|setelah itu|baru)\\s+", RegexOption.IGNORE_CASE)
              private val ytCari = Regex("^(?:buka\\s+)?(?:yt|youtube)\\s+(?:dan\\s+)?(?:cari|carikan|putar|putarkan)\\s+(.+)$", RegexOption.IGNORE_CASE)
              private val mapsCari = Regex("^buka\\s+(?:maps|peta|google maps)\\s+(?:dan\\s+)?(?:cari|carikan)\\s+(.+)$", RegexOption.IGNORE_CASE)
              private val spotifyCari = Regex("^buka\\s+spotify\\s+(?:dan\\s+)?(?:cari|carikan|putar|putarkan)\\s+(.+)$", RegexOption.IGNORE_CASE)
              private val ttCari = Regex("^buka\\s+(?:tiktok|tik tok|tt)\\s+(?:dan\\s+)?(?:cari|carikan)\\s+(.+)$", RegexOption.IGNORE_CASE)
              private val cariSaja = Regex("^(?:cari|carikan|putar|putarkan)\\s+(.+)$", RegexOption.IGNORE_CASE)

              private val ttSaja = Regex("^(?:tiktok|tik tok)\\s+(?:cari\\s+|carikan\\s+)?(.+)$", RegexOption.IGNORE_CASE)

              // Membuka TikTok, mengetuk ikon cari, mengetik kata kunci, lalu menekan enter.
              private fun tiktok(q: String): List<String> =
                  listOf("buka tiktok", "tunggu 2", "ikon cari", "tunggu 1", "ketik $q", "tunggu 1", "enter")

              fun pecah(mentah: String): List<String>? {
                  val t = mentah.trim()
                  if (t.isEmpty()) return null

                  val y = ytCari.find(t)
                  if (y != null && t.lowercase().startsWith("buka")) return listOf("youtube " + y.groupValues[1].trim())
                  val m = mapsCari.find(t)
                  if (m != null) return listOf("maps " + m.groupValues[1].trim())
                  val tk = ttCari.find(t)
                  if (tk != null) return tiktok(tk.groupValues[1].trim())
                  val ts = ttSaja.find(t)
                  if (ts != null) return tiktok(ts.groupValues[1].trim())
                  val sp = spotifyCari.find(t)
                  if (sp != null) return listOf("spotify " + sp.groupValues[1].trim())

                  val bagian = sambung.split(t).map { it.trim() }.filter { it.isNotEmpty() }
                  if (bagian.size < 2) return null

                  val hasil = mutableListOf<String>()
                  var i = 0
                  while (i < bagian.size) {
                      val a = bagian[i]
                      val al = a.lowercase()
                      if (i + 1 < bagian.size) {
                          val b = cariSaja.find(bagian[i + 1])
                          if (b != null) {
                              val isi = b.groupValues[1].trim()
                              if (al == "buka yt" || al == "buka youtube") {
                                  hasil.add("youtube $isi")
                                  i += 2
                                  continue
                              }
                              if (al == "buka maps" || al == "buka peta" || al == "buka google maps") {
                                  hasil.add("maps $isi")
                                  i += 2
                                  continue
                              }
                              if (al == "buka tiktok" || al == "buka tik tok" || al == "buka tt") {
                                  hasil.addAll(tiktok(isi))
                                  i += 2
                                  continue
                              }
                              if (al == "buka spotify") {
                                  hasil.add("spotify $isi")
                                  i += 2
                                  continue
                              }
                          }
                      }
                      hasil.add(a)
                      i++
                  }
                  for (x in hasil) if (!Executor.kenal(x)) return null
                  return hasil
              }
          }
