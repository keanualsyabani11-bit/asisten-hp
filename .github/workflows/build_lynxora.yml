              private fun alamat(ctx: Context, rest: String): Hasil {
                  if (rest.isBlank()) {
                      val m = Store.alamat(ctx)
                      val teks = if (m.isEmpty()) {
                          "Belum ada alamat. Contoh: alamat rumah = Jl. Merdeka 10, Bandung"
                      } else {
                          m.entries.joinToString("\n") { it.key + ": " + it.value }
                      }
                      return Hasil(teks, false)
                  }
                  val nama = rest.substringBefore("=").trim().lowercase()
                  val isi = rest.substringAfter("=", "").trim()
                  if (nama.isEmpty() || isi.isEmpty()) return Hasil("Format: alamat rumah = Jl. Merdeka 10", false)
                  Store.simpanAlamat(ctx, nama, isi)
                  return Hasil("Alamat $nama disimpan. Pakai: arahkan ke $nama", false)
              }

