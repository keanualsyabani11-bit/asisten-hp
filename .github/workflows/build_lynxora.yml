                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  refresh()
              }

              override fun onPause() {
                  simpanDiamDiam()
                  super.onPause()
              }

              private fun pilihTab(i: Int) {
                  if (i == 1 && Pref.kunciApp(this) && !terbuka) {
                      mintaKunci()
                      return
                  }
                  tab = i
                  Pref.setTabAktif(this, i)
                  isi.removeAllViews()
                  var v = halaman[i]
                  if (v == null) {
                      v = when (i) {
                          0 -> halamanBeranda()
                          1 -> halamanPengaturan()
                          2 -> halamanPerintah()
                          else -> halamanInfo()
                      }
                      halaman[i] = v
                  }
                  isi.addView(v)
                  sv.scrollTo(0, 0)
                  refresh()
              }

              // ---------- status ----------

              private fun izinMic(): Boolean = checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED
              private fun izinNotif(): Boolean = Build.VERSION.SDK_INT < 33 ||
                  checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) == PackageManager.PERMISSION_GRANTED
              private fun izinKontak(): Boolean = checkSelfPermission(Manifest.permission.READ_CONTACTS) == PackageManager.PERMISSION_GRANTED

              private fun refresh() {
                  for (f in penyegar) f()
                  val akses = AsistenAccessibilityService.instance != null
                  val over = Settings.canDrawOverlays(this)
                  val wajib = (if (akses) 1 else 0) + (if (over) 1 else 0) + (if (Ai.siap(this)) 1 else 0)
                  if (wajib == 3) {
                      pilStatus.text = "Siap"
                      pilStatus.background = ui.shapeI(ui.redup(T.ok, 38), 20, null)
                      pilStatus.setTextColor(Color.parseColor(T.ok))
                  } else {
                      pilStatus.text = "Belum lengkap"
                      pilStatus.background = ui.shapeI(ui.redup(T.warn, 38), 20, null)
                      pilStatus.setTextColor(Color.parseColor(T.warn))
                  }
                  if (halaman[0] != null) {
                      (progIsi.layoutParams as LinearLayout.LayoutParams).weight = wajib.toFloat()
                      (progSisa.layoutParams as LinearLayout.LayoutParams).weight = (3 - wajib).toFloat()
                      progIsi.parent.requestLayout()
                      ringkas.text = if (wajib == 3) "Semua pengaturan penting sudah siap" else "$wajib dari 3 pengaturan penting sudah siap"
                  }
              }

