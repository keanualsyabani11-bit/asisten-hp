          package com.asisten.hp
          import android.animation.Animator
          import android.animation.AnimatorListenerAdapter
          import android.animation.ObjectAnimator
          import android.content.Context
          import android.content.Intent
          import android.graphics.Color
          import android.os.Bundle
          import android.text.Editable
          import android.text.InputFilter
          import android.text.TextWatcher
          import android.view.View
          import android.view.animation.DecelerateInterpolator
          import android.view.animation.OvershootInterpolator
          import android.widget.Button
          import android.widget.EditText
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          class KeyGateActivity : AppCompatActivity() {

              private val DB = "https://lynxora-key-default-rtdb.asia-southeast1.firebasedatabase.app/keys"

              private lateinit var etKey: EditText
              private lateinit var btnActivate: Button
              private lateinit var tvStatus: TextView
              private lateinit var tvCounter: TextView
              private lateinit var cardView: View
              private lateinit var iconView: View

              override fun onCreate(s: Bundle?) {
                  super.onCreate(s)
                  val prefs = getSharedPreferences("keygate", Context.MODE_PRIVATE)
                  if (prefs.getBoolean("unlocked", false)) { goMain(); return }

                  window.statusBarColor = Color.parseColor("#08080a")
                  window.navigationBarColor = Color.parseColor("#08080a")

                  setContentView(R.layout.activity_keygate)

                  etKey       = findViewById(R.id.et_key)
                  btnActivate = findViewById(R.id.btn_activate)
                  tvStatus    = findViewById(R.id.tv_status)
                  tvCounter   = findViewById(R.id.tv_counter)
                  cardView    = findViewById(R.id.card_root)
                  iconView    = findViewById(R.id.icon_key)

                  // Format filter — auto uppercase, max 23 chars
                  etKey.filters = arrayOf(InputFilter.AllCaps(), InputFilter.LengthFilter(23))

                  // Live counter
                  etKey.addTextChangedListener(object : TextWatcher {
                      override fun beforeTextChanged(s: CharSequence?, st: Int, c: Int, a: Int) {}
                      override fun onTextChanged(s: CharSequence?, st: Int, b: Int, c: Int) {}
                      override fun afterTextChanged(e: Editable?) {
                          val len = e?.length ?: 0
                          tvCounter.text = "$len / 23"
                          tvStatus.visibility = View.GONE
                      }
                  })

                  // Card entrance animation
                  cardView.translationY = 80f
                  cardView.alpha = 0f
                  cardView.animate()
                      .translationY(0f)
                      .alpha(1f)
                      .setDuration(500)
                      .setInterpolator(DecelerateInterpolator(2f))
                      .start()

                  btnActivate.setOnClickListener {
                      val raw = etKey.text.toString().trim()
                      if (raw.isBlank()) {
                          shakeView(etKey)
                          showStatus("Key tidak boleh kosong.", false)
                          return@setOnClickListener
                      }
                      setLoading(true)
                      Thread {
                          val ok = cekKey(raw)
                          runOnUiThread {
                              setLoading(false)
                              if (ok) {
                                  getSharedPreferences("keygate", Context.MODE_PRIVATE)
                                      .edit().putBoolean("unlocked", true).apply()
                                  pulseSuccess()
                              } else {
                                  shakeView(cardView)
                                  showStatus("Key tidak valid atau sudah dipakai.", false)
                              }
                          }
                      }.start()
                  }
              }

              private fun setLoading(loading: Boolean) {
                  btnActivate.isEnabled = !loading
                  btnActivate.text = if (loading) "Memverifikasi..." else "Aktifkan"
                  btnActivate.alpha = if (loading) 0.6f else 1f
                  etKey.isEnabled = !loading
              }

              private fun showStatus(msg: String, ok: Boolean) {
                  tvStatus.text = msg
                  tvStatus.setTextColor(
                      if (ok) Color.parseColor("#4ade80") else Color.parseColor("#f87171")
                  )
                  tvStatus.visibility = View.VISIBLE
              }

              private fun shakeView(v: View) {
                  val anim = ObjectAnimator.ofFloat(v, "translationX",
                      0f, -18f, 18f, -14f, 14f, -8f, 8f, 0f)
                  anim.duration = 420
                  anim.start()
              }

              private fun pulseSuccess() {
                  showStatus("Key valid! Membuka aplikasi...", true)
                  val scale = ObjectAnimator.ofFloat(iconView, "scaleX", 1f, 1.3f, 1f)
                  val scaleY = ObjectAnimator.ofFloat(iconView, "scaleY", 1f, 1.3f, 1f)
                  scale.duration = 400; scaleY.duration = 400
                  scale.interpolator = OvershootInterpolator()
                  scaleY.interpolator = OvershootInterpolator()
                  scale.start(); scaleY.start()
                  cardView.postDelayed({ goMain() }, 900)
              }

              private fun cekKey(key: String): Boolean {
                  return try {
                      val conn = URL("$DB/$key.json").openConnection() as HttpURLConnection
                      conn.connectTimeout = 5000; conn.readTimeout = 5000
                      if (conn.responseCode != 200) return false
                      val body = conn.inputStream.bufferedReader().readText()
                      if (body == "null") return false
                      val obj = JSONObject(body)
                      if (obj.optString("status") != "active") return false
                      val exp = obj.optLong("expires", 0L)
                      if (exp != 0L && System.currentTimeMillis() > exp) return false
                      val p = URL("$DB/$key/status.json").openConnection() as HttpURLConnection
                      p.requestMethod = "PUT"; p.doOutput = true
                      p.setRequestProperty("Content-Type", "application/json")
                      p.outputStream.write("\"used\"".toByteArray()); p.responseCode
                      true
                  } catch (e: Exception) { false }
              }

              private fun goMain() {
                  startActivity(Intent(this, MainActivity::class.java))
                  overridePendingTransition(android.R.anim.fade_in, android.R.anim.fade_out)
                  finish()
              }
          }
