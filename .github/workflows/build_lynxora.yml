                      a == "tempel" || a == "paste" -> acc { it.tempel() }
                      a in setOf("saluran", "saluran dev", "channel") -> view(ctx, "https://whatsapp.com/channel/0029VbCt25oHVvTfEwfLOu1G", "Membuka saluran Dev")
