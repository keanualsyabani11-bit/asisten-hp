              private fun langkah(no: Int, judul: String, desc: String, selesai: () -> Boolean, aksi: String, onClick: () -> Unit): LinearLayout {
                  val num = ui.text(no.toString(), 12.5f, T.muted, true)
                  num.gravity = Gravity.CENTER
                  val cek = ui.ikon(R.drawable.ic_check, T.onAccent, 6)
                  val badge = FrameLayout(this)
                  badge.addView(num, FrameLayout.LayoutParams(ui.MATCH, ui.MATCH))
                  badge.addView(cek, FrameLayout.LayoutParams(ui.MATCH, ui.MATCH))

                  val kolom = LinearLayout(this)
                  kolom.orientation = LinearLayout.VERTICAL
                  kolom.addView(ui.text(judul, 14.5f, T.text, true))
                  kolom.addView(ui.text(desc, 12f, T.muted), ui.lp(2))

                  val btn = ui.tombolKecil(aksi) { onClick() }

                  val row = LinearLayout(this)
                  row.orientation = LinearLayout.HORIZONTAL
                  row.gravity = Gravity.CENTER_VERTICAL
                  row.setPadding(0, dp(12), 0, dp(12))
                  row.addView(badge, LinearLayout.LayoutParams(dp(28), dp(28)))
                  val kl = ui.bobot()
                  kl.leftMargin = dp(12)
                  kl.rightMargin = dp(10)
                  row.addView(kolom, kl)
                  row.addView(btn)

                  penyegar.add {
                      val ok = selesai()
                      num.visibility = if (ok) View.GONE else View.VISIBLE
                      cek.visibility = if (ok) View.VISIBLE else View.GONE
                      badge.background = if (ok) ui.oval(T.ok) else ui.oval(T.surface2, T.border)
                      btn.text = if (ok) "Ubah" else aksi
                  }
                  return row
              }

