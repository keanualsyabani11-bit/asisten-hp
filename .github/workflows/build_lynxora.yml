              private fun cekUpdate(hasil: TextView, tombolUnduh: TextView) {
                  val repo = BuildConfig.REPO
                  if (repo.isBlank()) {
                      hasil.text = "Alamat repositori belum diatur pada build ini."
                      return
                  }
                  hasil.text = "Memeriksa..."
                  hasil.setTextColor(Color.parseColor(T.muted))
                  Thread {
                      var teks = ""
                      var url: String? = null
                      var baru = false
                      try {
                          val conn = URL("https://api.github.com/repos/" + repo + "/releases/latest").openConnection() as HttpURLConnection
                          conn.connectTimeout = 10000
                          conn.readTimeout = 15000
                          conn.setRequestProperty("Accept", "application/vnd.github+json")
                          val code = conn.responseCode
                          if (code == 404) {
                              teks = "Belum ada rilis untuk dibandingkan."
                          } else if (code !in 200..299) {
                              teks = "Gagal memeriksa (kode " + code.toString() + ")."
                          } else {
                              val j = JSONObject(conn.inputStream.bufferedReader().use { it.readText() })
                              val tag = j.optString("tag_name", "")
                              val n = Regex("\\d+").findAll(tag).lastOrNull()?.value?.toIntOrNull() ?: 0
                              val aset = j.optJSONArray("assets")
                              if (aset != null && aset.length() > 0) url = aset.getJSONObject(0).optString("browser_download_url", "")
                              if (url.isNullOrBlank()) url = j.optString("html_url", "")
                              if (n > BuildConfig.VERSION_CODE) {
                                  baru = true
                                  teks = "Versi baru tersedia: " + tag
                              } else {
                                  teks = "Kamu sudah memakai versi terbaru."
                              }
                          }
                      } catch (e: Exception) {
                          teks = "Tidak bisa memeriksa: " + (e.message ?: "jaringan bermasalah")
                      }
                      val teksAkhir: String = teks
                      val adaBaru: Boolean = baru
                      val alamatUnduh: String = url ?: ""
                      runOnUiThread {
                          hasil.text = teksAkhir
                          hasil.setTextColor(Color.parseColor(if (adaBaru) T.ok else T.muted))
                          if (adaBaru && alamatUnduh.isNotBlank()) {
                              tombolUnduh.visibility = View.VISIBLE
                              tombolUnduh.setOnClickListener {
                                  try {
                                      startActivity(Intent(Intent.ACTION_VIEW, Uri.parse(alamatUnduh)))
                                  } catch (e: Exception) {
                                      Toast.makeText(this, "Tidak bisa membuka tautan", Toast.LENGTH_SHORT).show()
                                  }
                              }
                          } else {
                              tombolUnduh.visibility = View.GONE
                          }
                      }
                  }.start()
              }

