                      <corners android:radius="12dp" />
                  </shape>
              </item>
              <item>
                  <shape android:shape="rectangle">
                      <gradient
                          android:startColor="#7c3aed"
                          android:endColor="#8b5cf6"
                          android:angle="135"
                          android:type="linear" />
                      <corners android:radius="12dp" />
                  </shape>
              </item>
          </selector>
          __END_D3__

          # Icon background circle
          cat > app/src/main/res/drawable/kg_icon_bg.xml <<'__END_D4__'
          <?xml version="1.0" encoding="utf-8"?>
          <layer-list xmlns:android="http://schemas.android.com/apk/res/android">
              <item>
                  <shape android:shape="oval">
                      <solid android:color="#1a1228" />
                      <stroke android:width="1dp" android:color="#2a1f4a" />
                  </shape>
              </item>
          </layer-list>
          __END_D4__

          # Ambient glow top (radial-ish via gradient oval)
          cat > app/src/main/res/drawable/kg_glow_top.xml <<'__END_D5__'
          <?xml version="1.0" encoding="utf-8"?>
          <shape xmlns:android="http://schemas.android.com/apk/res/android"
              android:shape="oval">
              <gradient
                  android:type="radial"
                  android:gradientRadius="160dp"
                  android:startColor="#1a0d3d"
                  android:endColor="#08080a" />
          </shape>
          __END_D5__

          mkdir -p $(dirname app/src/main/res/layout/widget_lynxora.xml)
          cat > app/src/main/res/layout/widget_lynxora.xml <<'__END_31__'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="@drawable/widget_bg"
              android:gravity="center_vertical"
              android:orientation="horizontal"
              android:padding="12dp">

              <LinearLayout
                  android:id="@+id/w_utama"
                  android:layout_width="0dp"
                  android:layout_height="wrap_content"
                  android:layout_weight="1"
                  android:gravity="center_vertical"
                  android:orientation="horizontal">

                  <ImageView
                      android:layout_width="40dp"
                      android:layout_height="40dp"
                      android:src="@drawable/logo" />

                  <LinearLayout
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginStart="10dp"
                      android:orientation="vertical">

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Lynxora AI"
                          android:textColor="#F2F2F3"
                          android:textSize="15sp"
                          android:textStyle="bold" />

                      <TextView
                          android:layout_width="wrap_content"
                          android:layout_height="wrap_content"
                          android:text="Ketuk untuk bertanya"
                          android:textColor="#8C8C91"
                          android:textSize="12sp" />
                  </LinearLayout>
              </LinearLayout>

              <TextView
                  android:id="@+id/w_app"
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:background="@drawable/widget_btn"
                  android:paddingStart="14dp"
                  android:paddingTop="8dp"
                  android:paddingEnd="14dp"
                  android:paddingBottom="8dp"
                  android:text="Buka"
                  android:textColor="#0A0A0B"
                  android:textSize="12sp"
                  android:textStyle="bold" />
          </LinearLayout>
          __END_31__
          mkdir -p $(dirname app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml)
          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'__END_32__'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          __END_32__
          mkdir -p $(dirname app/src/main/res/values/colors.xml)
          cat > app/src/main/res/values/colors.xml <<'__END_33__'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_bg">#000000</color>
          </resources>
          __END_33__
          mkdir -p $(dirname app/src/main/res/values/strings.xml)
          cat > app/src/main/res/values/strings.xml <<'__END_34__'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Lynxora AI</string>
              <string name="acc_desc">Lynxora AI memakai layanan ini untuk mengetik, menekan tombol, dan scroll di aplikasi lain sesuai perintahmu.</string>
          </resources>
          __END_34__
