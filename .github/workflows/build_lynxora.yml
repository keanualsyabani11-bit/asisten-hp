          package com.asisten.hp

          import android.security.keystore.KeyGenParameterSpec
          import android.security.keystore.KeyProperties
          import android.util.Base64
          import java.security.KeyStore
          import javax.crypto.Cipher
          import javax.crypto.KeyGenerator
          import javax.crypto.SecretKey
          import javax.crypto.spec.GCMParameterSpec

          // Mengenkripsi teks rahasia (kunci API) dengan kunci yang disimpan di Android Keystore.
          object Secure {
              private const val ALIAS = "lynxora_key_v1"
              private const val PROV = "AndroidKeyStore"

              private fun kunci(): SecretKey {
                  val ks = KeyStore.getInstance(PROV)
                  ks.load(null)
                  if (!ks.containsAlias(ALIAS)) {
                      val g = KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES, PROV)
                      g.init(
                          KeyGenParameterSpec.Builder(ALIAS, KeyProperties.PURPOSE_ENCRYPT or KeyProperties.PURPOSE_DECRYPT)
                              .setBlockModes(KeyProperties.BLOCK_MODE_GCM)
                              .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)
                              .setKeySize(256)
                              .build()
                      )
                      g.generateKey()
                  }
                  return (ks.getEntry(ALIAS, null) as KeyStore.SecretKeyEntry).secretKey
              }

              // Hasil: "e:" + base64(iv) + ":" + base64(data). Jika Keystore gagal: "p:" + teks biasa.
              fun kunciKan(teks: String): String {
                  if (teks.isEmpty()) return ""
                  return try {
                      val c = Cipher.getInstance("AES/GCM/NoPadding")
                      c.init(Cipher.ENCRYPT_MODE, kunci())
                      val iv = c.iv
                      val data = c.doFinal(teks.toByteArray(Charsets.UTF_8))
                      "e:" + Base64.encodeToString(iv, Base64.NO_WRAP) + ":" + Base64.encodeToString(data, Base64.NO_WRAP)
                  } catch (e: Exception) {
                      "p:" + teks
                  }
              }

              fun bukaKunci(s: String): String {
                  if (s.isEmpty()) return ""
                  if (s.startsWith("p:")) return s.substring(2)
                  if (!s.startsWith("e:")) return s
                  return try {
                      val bagian = s.substring(2).split(":")
                      val iv = Base64.decode(bagian[0], Base64.NO_WRAP)
                      val data = Base64.decode(bagian[1], Base64.NO_WRAP)
                      val c = Cipher.getInstance("AES/GCM/NoPadding")
                      c.init(Cipher.DECRYPT_MODE, kunci(), GCMParameterSpec(128, iv))
                      String(c.doFinal(data), Charsets.UTF_8)
                  } catch (e: Exception) {
                      ""
                  }
              }
          }
