              private fun setFocusable(on: Boolean) {
                  panelLp.flags = if (on) withFocus else noFocus
                  if (expanded) {
                      try { wm.updateViewLayout(panel, panelLp) } catch (e: Exception) {}
                  }
              }

              private fun expand() {
                  if (expanded) return
                  expanded = true
                  unpeek()
                  try { wm.removeView(orb) } catch (e: Exception) {}
                  panelLp.flags = noFocus
                  try {
                      wm.addView(panel, panelLp)
                  } catch (e: Exception) {
                      expanded = false
                      return
                  }
                  isiChips()
                  perbaruiTombol()
                  updateStatus()
                  if (!greeted) {
                      greeted = true
                      val lama = Store.chat(this)
                      if (lama.isNotEmpty()) {
                          riwayat.clear()
                          riwayat.addAll(lama)
                          for (m in lama.takeLast(30)) addMsg(m.second, m.first, false)
                      } else {
                          val nama = Ai.nama(this)
                          val sapa = if (nama.isNotBlank()) "Halo, $nama. Aku Lynxora." else "Halo, aku Lynxora."
                          addMsg(
                              if (Ai.siap(this)) "$sapa Tanya apa saja atau suruh aku mengerjakan sesuatu di HP-mu."
                              else "$sapa Ketik bantuan untuk lihat perintah. Isi kunci AI di aplikasi Lynxora supaya aku makin pintar.",
                              false, false
                          )
                      }
                  }
              }

              private fun collapse() {
                  if (!expanded) return
                  expanded = false
                  imm.hideSoftInputFromWindow(input.windowToken, 0)
                  try { wm.removeView(panel) } catch (e: Exception) {}
                  if (!sembunyiOtomatis) {
                      try { wm.addView(orb, orbLp) } catch (e: Exception) {}
                      jadwalkanPeek()
                  }
              }

              // ---------- sembunyi sementara (screenshot) dan sembunyi di aplikasi tertentu ----------

              private var sembunyiOtomatis = false

              private val tampilLagi = Runnable {
                  if (::orb.isInitialized) orb.visibility = View.VISIBLE
                  if (::panel.isInitialized) panel.visibility = View.VISIBLE
              }

              // Bubble dan panel tidak digambar selama ms milidetik, supaya tidak ikut terfoto.
              fun sembunyiSementara(ms: Long) {
                  h.post {
                      if (::orb.isInitialized) orb.visibility = View.INVISIBLE
                      if (::panel.isInitialized) panel.visibility = View.INVISIBLE
                      h.removeCallbacks(tampilLagi)
                      h.postDelayed(tampilLagi, ms)
                  }
              }

              private fun cocokSembunyi(pkg: String): Boolean {
                  val daftar = Pref.appSembunyi(this)
                  if (daftar.isEmpty()) return false
                  val p = pkg.lowercase()
                  var label = ""
                  try {
                      label = packageManager.getApplicationLabel(packageManager.getApplicationInfo(pkg, 0)).toString().lowercase()
                  } catch (e: Exception) {
                      // nama aplikasi tidak terbaca, pakai nama paket saja
                  }
                  for (k in daftar) {
                      val kk = k.lowercase()
                      if (p.contains(kk) || label.contains(kk)) return true
                  }
                  return false
              }

              // Dipanggil layanan Aksesibilitas setiap aplikasi di layar berganti.
              fun paketBerubah(pkg: String) {
                  h.post {
                      if (!::orb.isInitialized) return@post
                      val sembunyi = cocokSembunyi(pkg)
                      if (sembunyi == sembunyiOtomatis) return@post
                      sembunyiOtomatis = sembunyi
                      if (sembunyi) {
                          try { wm.removeView(orb) } catch (e: Exception) {}
                          if (expanded) {
                              expanded = false
                              try { wm.removeView(panel) } catch (e: Exception) {}
                          }
                      } else if (!expanded) {
                          try { wm.addView(orb, orbLp) } catch (e: Exception) {}
                      }
                  }
              }

