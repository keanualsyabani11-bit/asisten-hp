          package com.asisten.hp

          import android.app.Notification
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification

          // Menyimpan notifikasi terbaru di memori (tidak ditulis ke penyimpanan) agar bisa dibaca atas perintah pengguna.
          class NotifService : NotificationListenerService() {

              companion object {
                  @Volatile var instance: NotifService? = null
                  private val daftar = ArrayList<String>()

                  fun terbaru(): List<String> = synchronized(daftar) { daftar.toList() }
              }

              override fun onListenerConnected() {
                  instance = this
              }

              override fun onListenerDisconnected() {
                  instance = null
              }

              override fun onNotificationPosted(sbn: StatusBarNotification?) {
                  if (sbn == null) return
                  if (sbn.packageName == packageName) return
                  if (Privasi.sensitifPkg(sbn.packageName)) return
                  val n = sbn.notification ?: return
                  if (n.flags and Notification.FLAG_GROUP_SUMMARY != 0) return
                  val e = n.extras ?: return
                  val judul = e.getCharSequence(Notification.EXTRA_TITLE)?.toString() ?: ""
                  val isi = e.getCharSequence(Notification.EXTRA_TEXT)?.toString() ?: ""
                  if (judul.isBlank() && isi.isBlank()) return
                  val app = try {
                      packageManager.getApplicationLabel(packageManager.getApplicationInfo(sbn.packageName, 0)).toString()
                  } catch (ex: Exception) {
                      sbn.packageName
                  }
                  synchronized(daftar) {
                      daftar.add(app + ": " + judul + " - " + isi.take(120))
                      while (daftar.size > 25) daftar.removeAt(0)
                  }
              }
          }
