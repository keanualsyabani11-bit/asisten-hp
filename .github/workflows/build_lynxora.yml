              }

              // ---------- mode siap pakai ----------

              private fun tanganiMode(tl: String): Boolean {
                  if (tl == "mode" || tl == "mode daftar") {
                      val semua = LinkedHashMap<String, List<String>>()
                      semua.putAll(Store.modeBawaan())
                      for ((k, v) in Store.makro(this)) {
                          if (k.startsWith("mode ")) semua[k] = v
                      }
                      addMsg(
                          "Mode yang tersedia:\n" + semua.entries.joinToString("\n") { "- " + it.key + ": " + it.value.joinToString("; ") } +
                              "\nUbah dengan: makro simpan mode tidur = senter mati; volume mute",
                          false
                      )
                      return true
                  }
                  val aksi = Store.cariMode(this, tl) ?: return false
                  jalankanMakro(tl, aksi)
                  return true
              }

              // ---------- riwayat ----------

              // Dipanggil layar Riwayat setelah ada pesan yang dihapus.
              fun muatUlangRiwayat() {
                  h.post {
                      riwayat.clear()
                      riwayat.addAll(Store.chat(this))
                      if (::log.isInitialized) {
                          log.removeAllViews()
                          saranView = null
                          for (m in riwayat.takeLast(30)) addMsg(m.second, m.first, false)
                      }
                  }
              }

              // ---------- teks dari menu Bagikan ----------

              private fun tanyaBagikan(mode: String, teks: String) {
                  val label: String
                  val perintah: String
                  when (mode) {
                      "terjemah" -> {
                          label = "Terjemahkan teks yang dibagikan"
                          perintah = "Terjemahkan teks berikut ke Bahasa Indonesia (jika sudah berbahasa Indonesia, terjemahkan ke Inggris). Beri hasil terjemahannya saja."
                      }
                      "perbaiki" -> {
                          label = "Perbaiki tulisan yang dibagikan"
                          perintah = "Perbaiki ejaan, tata bahasa, dan kejelasan teks berikut tanpa mengubah maksudnya. Beri teks hasil perbaikannya saja."
                      }
                      "balas" -> {
                          label = "Buat balasan untuk pesan yang dibagikan"
                          perintah = "Buatkan 2 pilihan balasan yang singkat dan sopan untuk pesan berikut."
                      }
                      else -> {
                          label = "Ringkas teks yang dibagikan"
                          perintah = "Ringkas teks berikut dengan singkat dan jelas."
                      }
                  }
                  tanyaLangsung(label + " (" + teks.length.toString() + " karakter)", perintah + "\n\n" + teks.take(6000))
              }

              // ---------- suara ----------

              private fun balasSuara(suara: Boolean, teks: String) {
                  if (suara || Ai.suara(this) || Pref.percakapan(this)) bicara(teks)
              }

              private fun bicara(t: String) {
                  if (!ttsReady) return
                  val bersih = Fmt.tanpaEmoji(t).replace("**", "").replace("`", "")
                  tts?.speak(bersih, TextToSpeech.QUEUE_FLUSH, null, "lynxora")
              }

              private fun lanjutDengar() {
                  if (Pref.percakapan(this) && terakhirSuara && !sibuk && expanded) dengar(false)
              }

              private fun dengar(awal: Boolean) {
                  if (awal) cobaUlang = false
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      addMsg("Izinkan Mikrofon dulu di aplikasi Lynxora AI, lalu tekan Mulai lagi.", false)
                      return
                  }
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      addMsg("Pengenal suara tidak tersedia di HP ini.", false)
                      return
                  }
                  recognizer?.destroy()
                  val r = SpeechRecognizer.createSpeechRecognizer(this)
                  recognizer = r
                  r.setRecognitionListener(object : RecognitionListener {
                      override fun onReadyForSpeech(params: Bundle?) {
                          setStatus("Mendengarkan", T.accent)
                      }
                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(rmsdB: Float) {}
                      override fun onBufferReceived(buffer: ByteArray?) {}
                      override fun onEndOfSpeech() {
                          setStatus("Memproses", T.accent)
                      }
                      override fun onError(error: Int) {
                          updateStatus()
                          val bisaUlang = error == SpeechRecognizer.ERROR_NO_MATCH || error == SpeechRecognizer.ERROR_SPEECH_TIMEOUT
                          if (!cobaUlang && bisaUlang) {
                              cobaUlang = true
                              h.postDelayed({ dengar(false) }, 300)
                              return
                          }
                          cobaUlang = false
                          when (error) {
                              SpeechRecognizer.ERROR_INSUFFICIENT_PERMISSIONS ->
                                  addMsg("Izin mikrofon belum diberikan.", false)
                              SpeechRecognizer.ERROR_NETWORK, SpeechRecognizer.ERROR_NETWORK_TIMEOUT ->
                                  addMsg("Pengenal suara butuh internet. Periksa koneksimu.", false)
                              else -> addMsg("Suara tidak terdengar, coba lagi.", false)
                          }
                      }
                      override fun onResults(results: Bundle?) {
                          cobaUlang = false
                          updateStatus()
                          val t = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()
                          if (t != null) kirim(t, true)
                      }
                      override fun onPartialResults(partialResults: Bundle?) {}
                      override fun onEvent(eventType: Int, params: Bundle?) {}
                  })
                  val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "id-ID")
                  r.startListening(i)
              }
          }
