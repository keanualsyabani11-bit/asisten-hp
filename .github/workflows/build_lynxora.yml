              private fun segarMemori() {
                  if (halaman[1] == null && !::tvMemori.isInitialized) return
                  val m = Store.memori(this)
                  tvMemori.text = if (m.isEmpty()) "Belum ada yang diingat." else m.joinToString("\n") { "- " + it }
              }

              private fun pilihModel() {
                  Toast.makeText(this, "Mengambil daftar model...", Toast.LENGTH_SHORT).show()
                  val k = etKey.text.toString().trim()
                  val u = etUrl.text.toString().trim()
                  val i = idx
                  Thread {
                      val r = Ai.daftarModel(this, i, k, u)
                      runOnUiThread {
                          if (isFinishing) return@runOnUiThread
                          if (!r.ok) {
                              hasilTes.text = r.pesan
                              hasilTes.setTextColor(Color.parseColor(T.err))
                              return@runOnUiThread
                          }
                          val arr = r.daftar.toTypedArray()
                          android.app.AlertDialog.Builder(this)
                              .setTitle("Pilih model")
                              .setItems(arr) { _, w -> etModel.setText(arr[w]) }
                              .show()
                      }
                  }.start()
              }

              private fun simpanDanTes() {
                  simpanDiamDiam()
                  val k = etKey.text.toString().trim()
                  if (k.isEmpty()) {
                      hasilTes.text = "Isi kunci API dulu."
                      hasilTes.setTextColor(Color.parseColor(T.warn))
                      return
                  }
                  hasilTes.text = "Menguji koneksi..."
                  hasilTes.setTextColor(Color.parseColor(T.muted))
                  Thread {
                      val r = Ai.tes(this)
                      runOnUiThread {
                          if (r.ok) {
                              hasilTes.text = "Terhubung ke " + Ai.namaPendek[idx] + " dan tersimpan."
                              hasilTes.setTextColor(Color.parseColor(T.ok))
                          } else {
                              hasilTes.text = r.teks
                              hasilTes.setTextColor(Color.parseColor(T.err))
                          }
                          refresh()
                      }
                  }.start()
              }

