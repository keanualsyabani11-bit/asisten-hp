name: Build Lynxora AI
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Buat proyek
        run: |
          mkdir -p $(dirname settings.gradle.kts)
          cat > settings.gradle.kts <<'__END_0__'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "LynxoraAI"
          include(":app")
          __END_0__
          mkdir -p $(dirname build.gradle.kts)
          cat > build.gradle.kts <<'__END_1__'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          __END_1__
          mkdir -p $(dirname gradle.properties)
          cat > gradle.properties <<'__END_2__'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          __END_2__
          mkdir -p $(dirname app/build.gradle.kts)
          cat > app/build.gradle.kts <<'__END_3__'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.asisten.hp"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.asisten.hp"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = (project.findProperty("vCode") as String?)?.toIntOrNull() ?: 8
                  versionName = "5.2"
                  buildConfigField("String", "REPO", "\"" + ((project.findProperty("repoSlug") as String?) ?: "") + "\"")
              }
              buildFeatures {
                  buildConfig = true
              }
              signingConfigs {
                  create("lynxora") {
                      storeFile = file("lynxora.keystore")
                      storePassword = System.getenv("KS_PASS") ?: "lynxora123"
                      keyAlias = "lynxora"
                      keyPassword = System.getenv("KS_PASS") ?: "lynxora123"
                  }
              }
              buildTypes {
                  getByName("debug") {
                      signingConfig = signingConfigs.getByName("lynxora")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          __END_3__
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml <<'__END_4__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.READ_CONTACTS" />
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="com.android.alarm.permission.SET_ALARM" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>
              <application
                  android:label="Lynxora AI"
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".KeyGateActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <activity android:name=".MainActivity" android:exported="false" android:windowSoftInputMode="adjustResize">
                  </activity>
                  <activity
                      android:name=".RiwayatActivity"
                      android:exported="false" />
                  <activity
                      android:name=".ShareActivity"
                      android:exported="true"
                      android:excludeFromRecents="true"
                      android:label="Lynxora AI"
                      android:theme="@android:style/Theme.Translucent.NoTitleBar">
                      <intent-filter>
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="text/plain" />
                      </intent-filter>
                  </activity>
                  <receiver
                      android:name=".LynxoraWidget"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/widget_info" />
                  </receiver>
                  <service
                      android:name=".LynxoraTile"
                      android:exported="true"
                      android:icon="@drawable/ic_tile"
                      android:label="Lynxora AI"
                      android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
                      <intent-filter>
                          <action android:name="android.service.quicksettings.action.QS_TILE" />
                      </intent-filter>
                  </service>
                  <service
                      android:name=".NotifService"
                      android:exported="true"
                      android:label="Lynxora AI"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse|microphone">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="overlay assistant" />
                  </service>
                  <service
                      android:name=".AsistenAccessibilityService"
                      android:exported="true"
                      android:label="Lynxora AI"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          __END_4__
          mkdir -p app/src/main/res/layout
          cat > app/src/main/res/layout/activity_keygate.xml <<'__END_LAYOUT_KG__'
          <?xml version="1.0" encoding="utf-8"?>
          <RelativeLayout
              xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:background="#08080a">
              <View
                  android:layout_width="360dp"
                  android:layout_height="240dp"
                  android:layout_centerHorizontal="true"
                  android:layout_alignParentTop="true"
                  android:layout_marginTop="-90dp"
                  android:background="@drawable/kg_glow_top" />
              <LinearLayout
                  android:id="@+id/card_root"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_centerInParent="true"
                  android:layout_marginStart="24dp"
                  android:layout_marginEnd="24dp"
                  android:background="@drawable/kg_card_bg"
                  android:orientation="vertical"
                  android:padding="28dp">
                  <TextView
                      android:id="@+id/icon_key"
                      android:layout_width="52dp"
                      android:layout_height="52dp"
                      android:layout_gravity="center_horizontal"
                      android:background="@drawable/kg_icon_bg"
                      android:gravity="center"
                      android:text="🗝️"
                      android:textSize="22sp" />
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_gravity="center_horizontal"
                      android:layout_marginTop="18dp"
                      android:text="Lynxora AI"
                      android:textColor="#f0f0f8"
                      android:textSize="22sp"
                      android:textStyle="bold" />
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_gravity="center_horizontal"
                      android:layout_marginTop="4dp"
                      android:gravity="center"
                      android:text="Masukkan license key untuk melanjutkan"
                      android:textColor="#606078"
                      android:textSize="12sp" />
                  <View
                      android:layout_width="match_parent"
                      android:layout_height="1dp"
                      android:layout_marginTop="22dp"
                      android:layout_marginBottom="22dp"
                      android:background="#1e1e26" />
                  <TextView
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginBottom="8dp"
                      android:text="License Key"
                      android:textColor="#9090a8"
