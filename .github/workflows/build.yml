                      maxLines = 1
                      ellipsize = TextUtils.TruncateAt.END
                      setPadding(dp(4), 0, dp(4), 0)
                  }
                  musicTitle = title
                  fun ctl(res: Int, kind: Int) = icon(res, 30).apply {
                      setPadding(dp(5), dp(5), dp(5), dp(5))
                      setOnClickListener { mediaAction(kind) }
                  }
                  music.addView(ctl(R.drawable.ic_prev, 0))
                  val pl = ctl(R.drawable.ic_play, 1)
                  playIcon = pl
                  music.addView(pl)
                  music.addView(ctl(R.drawable.ic_next, 2))
                  music.addView(title, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
