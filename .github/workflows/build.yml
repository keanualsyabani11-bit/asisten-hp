              // ---------- crosshair (statis, tanpa auto aim) ----------

              private fun drawCrosshairShape(c: Canvas, w: Int, h: Int, style: Int, color: Int, paint: Paint) {
                  val cx = w / 2f
                  val cy = h / 2f
                  val unit = w / 40f
                  paint.color = color
                  paint.style = Paint.Style.FILL
                  when (style) {
                      1 -> c.drawCircle(cx, cy, 3f * unit, paint)
                      2 -> {
                          paint.strokeWidth = 2f * unit
                          val len = 11f * unit
                          val gap = 3f * unit
                          c.drawLine(cx - gap - len, cy, cx - gap, cy, paint)
                          c.drawLine(cx + gap, cy, cx + gap + len, cy, paint)
                          c.drawLine(cx, cy - gap - len, cx, cy - gap, paint)
                          c.drawLine(cx, cy + gap, cx, cy + gap + len, paint)
                      }
                      3 -> {
                          c.drawCircle(cx, cy, 2f * unit, paint)
                          paint.style = Paint.Style.STROKE
                          paint.strokeWidth = 1.3f * unit
                          c.drawCircle(cx, cy, 10f * unit, paint)
                      }
                      4 -> {
                          paint.strokeWidth = 2f * unit
                          val len = 12f * unit
                          c.drawLine(cx - len, cy, cx + len, cy, paint)
                          c.drawLine(cx, cy - len, cx, cy + len, paint)
                      }
                  }
              }

              private inner class CrosshairView : View(this@OverlayService) {
                  private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
                  private val border = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                      style = Paint.Style.STROKE
                      color = 0xFF2F8BFF.toInt()
                      strokeWidth = dp(1).toFloat()
                      pathEffect = DashPathEffect(floatArrayOf(dp(4).toFloat(), dp(3).toFloat()), 0f)
                  }

                  override fun onDraw(c: Canvas) {
                      drawCrosshairShape(c, width, height, xhStyle, xhColors[xhColor], paint)
                      if (dragMode) c.drawRect(2f, 2f, width - 2f, height - 2f, border)
                  }
              }

              private inner class ShapeView(private val style: Int) : View(this@OverlayService) {
                  private val paint = Paint(Paint.ANTI_ALIAS_FLAG)
                  private val rect = RectF()

                  override fun onDraw(c: Canvas) {
                      paint.style = Paint.Style.FILL
                      paint.color = 0x22FFFFFF
                      rect.set(0f, 0f, width.toFloat(), height.toFloat())
                      c.drawRoundRect(rect, dp(10).toFloat(), dp(10).toFloat(), paint)
                      drawCrosshairShape(c, width, height, style, Color.WHITE, paint)
                      if (xhStyle == style) {
                          paint.style = Paint.Style.STROKE
                          paint.strokeWidth = dp(2).toFloat()
                          paint.color = accent
                          rect.inset(dp(1).toFloat(), dp(1).toFloat())
                          c.drawRoundRect(rect, dp(10).toFloat(), dp(10).toFloat(), paint)
                      }
                  }
              }

              private inner class SwatchView(private val idx: Int) : View(this@OverlayService) {
                  private val paint = Paint(Paint.ANTI_ALIAS_FLAG)

                  override fun onDraw(c: Canvas) {
                      val r = min(width, height) / 2f - dp(3)
                      paint.style = Paint.Style.FILL
                      paint.color = xhColors[idx]
                      c.drawCircle(width / 2f, height / 2f, r, paint)
                      if (xhColor == idx) {
                          paint.style = Paint.Style.STROKE
                          paint.strokeWidth = dp(2).toFloat()
                          paint.color = Color.WHITE
                          c.drawCircle(width / 2f, height / 2f, r + dp(2), paint)
                      }
                  }
              }

              private fun crosshairFlags(drag: Boolean) =
                  if (drag) WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE else untouchable

              private fun applyCrosshair() {
                  if (xhStyle == 0) {
                      removeCrosshair()
                      return
                  }
                  val size = dp(xhSizesDp[xhSize])
                  val existing = xhairView
                  if (existing == null) {
                      val v = CrosshairView()
                      v.visibility = if (overlaysVisible) View.VISIBLE else View.GONE
                      val p = lp(size, size, crosshairFlags(dragMode)).apply {
                          gravity = Gravity.CENTER
                          x = prefs.getInt("xh_dx", 0)
                          y = prefs.getInt("xh_dy", 0)
                      }
                      var sx = 0f
                      var sy = 0f
                      var ox = 0
                      var oy = 0
                      v.setOnTouchListener { _, e ->
                          when (e.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  sx = e.rawX; sy = e.rawY; ox = p.x; oy = p.y
                                  true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  p.x = ox + (e.rawX - sx).toInt()
                                  p.y = oy + (e.rawY - sy).toInt()
                                  wm.updateViewLayout(v, p)
                                  true
                              }
                              MotionEvent.ACTION_UP -> {
                                  prefs.edit().putInt("xh_dx", p.x).putInt("xh_dy", p.y).apply()
                                  true
                              }
                              else -> false
                          }
                      }
                      wm.addView(v, p)
                      xhairView = v
                      xhairParams = p
                  } else {
                      xhairParams?.let {
                          it.width = size
                          it.height = size
                          wm.updateViewLayout(existing, it)
                      }
                      existing.invalidate()
                  }
              }

              private fun setDrag(on: Boolean) {
                  dragMode = on
                  val v = xhairView ?: return
                  val p = xhairParams ?: return
                  p.flags = crosshairFlags(on)
                  wm.updateViewLayout(v, p)
                  v.invalidate()
              }

              private fun nudge(dx: Int, dy: Int) {
                  val v = xhairView ?: return
                  val p = xhairParams ?: return
                  p.x += dx * dp(2)
                  p.y += dy * dp(2)
                  wm.updateViewLayout(v, p)
                  prefs.edit().putInt("xh_dx", p.x).putInt("xh_dy", p.y).apply()
              }

              private fun resetCrosshairPos() {
                  prefs.edit().putInt("xh_dx", 0).putInt("xh_dy", 0).apply()
                  val v = xhairView
                  val p = xhairParams
                  if (v != null && p != null) {
                      p.x = 0
                      p.y = 0
                      wm.updateViewLayout(v, p)
                  }
              }

              private fun removeCrosshair() {
                  xhairView?.let { runCatching { wm.removeView(it) } }
                  xhairView = null
                  xhairParams = null
                  dragMode = false
              }

              private fun refreshShapes() {
                  shapeViews.forEach { it.invalidate() }
                  swatchViews.forEach { it.invalidate() }
              }

              private fun arrow(res: Int, dx: Int, dy: Int): ImageView {
                  val iv = icon(res, 38).apply {
                      setPadding(dp(7), dp(7), dp(7), dp(7))
                      background = rounded(0x22FFFFFF, 10)
                  }
                  val rep = object : Runnable {
                      override fun run() {
                          nudge(dx, dy)
                          ui.postDelayed(this, 60)
                      }
                  }
                  iv.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              rep.run()
                              true
                          }
                          MotionEvent.ACTION_UP, MotionEvent.ACTION_CANCEL -> {
                              ui.removeCallbacks(rep)
                              true
                          }
                          else -> false
                      }
                  }
                  return iv
              }

