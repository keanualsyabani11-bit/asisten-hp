          mkdir -p 'app/src/main/java/com/example/lynxboster'
          cat > 'app/src/main/java/com/example/lynxboster/Adv.kt' <<'LYNX_EOF_5'
          package com.example.lynxboster

          import android.content.Context
          import android.content.pm.ApplicationInfo
          import android.content.pm.PackageManager
          import android.hardware.display.DisplayManager
          import android.view.Display
          import rikka.shizuku.Shizuku

          /**
           * Mode lanjutan lewat Shizuku. Semua perintah dijalankan dengan hak shell,
           * jadi hanya aktif kalau pengguna sendiri menjalankan Shizuku dan memberi izin.
           */
          object Adv {
              private const val REQ = 4711
              private val PKG_SAFE = Regex("^[A-Za-z0-9._]+$")

              fun running(): Boolean = runCatching { Shizuku.pingBinder() }.getOrDefault(false)

              fun granted(): Boolean =
                  runCatching { Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED }.getOrDefault(false)

              fun ready(): Boolean = running() && granted()

              fun request() {
                  runCatching { Shizuku.requestPermission(REQ) }
              }

              /** newProcess bersifat private di Shizuku API 13, jadi dipanggil lewat refleksi. */
              fun exec(cmd: String): String = runCatching {
                  val m = Shizuku::class.java.getDeclaredMethod(
                      "newProcess",
                      Array<String>::class.java,
                      Array<String>::class.java,
                      String::class.java
                  )
                  m.isAccessible = true
                  val p = m.invoke(null, arrayOf("sh", "-c", cmd), null, null) as Process
                  val out = p.inputStream.bufferedReader().readText()
                  p.waitFor()
                  out.trim()
              }.getOrDefault("")

              fun maxHz(ctx: Context): Int {
                  val dm = ctx.getSystemService(Context.DISPLAY_SERVICE) as DisplayManager
                  val d = dm.getDisplay(Display.DEFAULT_DISPLAY) ?: return 60
                  val modes = d.supportedModes
                  if (modes.isEmpty()) return 60
                  return Math.round(modes.maxOf { it.refreshRate })
              }

              fun forceHighRefresh(ctx: Context) {
                  val prefs = ctx.getSharedPreferences("lx", Context.MODE_PRIVATE)
                  if (!prefs.getBoolean("hz_saved", false)) {
                      val a = exec("settings get system min_refresh_rate")
                      val b = exec("settings get system peak_refresh_rate")
                      prefs.edit().putString("hz_min", a).putString("hz_peak", b).putBoolean("hz_saved", true).apply()
                  }
                  val hz = maxHz(ctx)
                  exec("settings put system min_refresh_rate $hz; settings put system peak_refresh_rate $hz")
              }

              fun restoreRefresh(ctx: Context) {
                  val prefs = ctx.getSharedPreferences("lx", Context.MODE_PRIVATE)
                  if (!prefs.getBoolean("hz_saved", false)) return
                  val pairs = listOf("min_refresh_rate" to "hz_min", "peak_refresh_rate" to "hz_peak")
                  for ((key, pk) in pairs) {
                      val v = prefs.getString(pk, "null") ?: "null"
                      if (v.isBlank() || v == "null") exec("settings delete system $key")
                      else exec("settings put system $key $v")
                  }
                  prefs.edit().putBoolean("hz_saved", false).apply()
              }

              /** Force-stop aplikasi pengguna (bukan sistem), kecuali game, pesan instan, keyboard, dan aplikasi ini. */
              fun deepBoost(ctx: Context): Int {
                  val prefs = ctx.getSharedPreferences("lx", Context.MODE_PRIVATE)
                  val pm = ctx.packageManager
                  val ime = exec("settings get secure default_input_method").substringBefore('/')
                  val keep = (prefs.getStringSet("games", emptySet()) ?: emptySet()) + KNOWN_GAMES + setOf(
                      ctx.packageName, "com.whatsapp", "com.whatsapp.w4b", "org.telegram.messenger", ime
                  )
                  val targets = launcherApps(ctx).map { it.pkg }.filter { pkg ->
                      if (pkg in keep || !PKG_SAFE.matches(pkg)) return@filter false
                      val info = runCatching { pm.getApplicationInfo(pkg, 0) }.getOrNull() ?: return@filter false
                      (info.flags and ApplicationInfo.FLAG_SYSTEM) == 0
                  }
                  if (targets.isNotEmpty()) exec(targets.joinToString("; ") { "am force-stop $it" })
                  return targets.size
              }

              /** Menjalankan semua aksi lanjutan yang dinyalakan di Labs. Mengembalikan jumlah aplikasi yang ditutup. */
              fun boostAll(ctx: Context, game: String?): Int {
                  val p = ctx.getSharedPreferences("lx", Context.MODE_PRIVATE)
                  if (p.getBoolean("adv_hz", true)) forceHighRefresh(ctx)
                  if (p.getBoolean("adv_game", true) && game != null && PKG_SAFE.matches(game)) {
                      exec("cmd game mode performance $game")
                  }
                  return if (p.getBoolean("adv_kill", true)) deepBoost(ctx) else 0
              }

              /** Perkiraan FPS dari timestamp frame SurfaceFlinger. Eksperimental dan bergantung pada HP. */
              fun fps(pkg: String): Int? {
                  if (!PKG_SAFE.matches(pkg)) return null
                  val layers = exec("dumpsys SurfaceFlinger --list").lines()
                  val layer = layers.firstOrNull { it.contains(pkg) && it.contains("SurfaceView") }
                      ?: layers.firstOrNull { it.contains(pkg) }
                      ?: return null
                  val safe = layer.replace("'", "")
                  val out = exec("dumpsys SurfaceFlinger --latency '$safe'")
                  val times = out.lines().drop(1).mapNotNull { l ->
                      val p = l.trim().split(Regex("\\s+"))
                      if (p.size >= 3) p[1].toLongOrNull() else null
                  }.filter { it > 0 && it != Long.MAX_VALUE }
                  if (times.size < 2) return null
                  val last = times.max()
                  return times.count { it > last - 1_000_000_000L }
              }

              fun restoreAll(ctx: Context, game: String?) {
                  restoreRefresh(ctx)
                  if (game != null && PKG_SAFE.matches(game)) exec("cmd game mode standard $game")
              }
          }
          LYNX_EOF_5
          cat > 'app/src/main/java/com/example/lynxboster/BoosterAccessibilityService.kt' <<'LYNX_EOF_6'
          package com.example.lynxboster

          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.view.accessibility.AccessibilityEvent

          /** Dipakai hanya untuk tombol Screenshot (performGlobalAction). Tidak membaca isi layar. */
          class BoosterAccessibilityService : AccessibilityService() {

              companion object {
                  @Volatile
                  var instance: BoosterAccessibilityService? = null
              }

              override fun onServiceConnected() {
                  instance = this
              }

              override fun onUnbind(intent: Intent?): Boolean {
                  instance = null
                  return super.onUnbind(intent)
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {}
          }
          LYNX_EOF_6
          cat > 'app/src/main/java/com/example/lynxboster/Core.kt' <<'LYNX_EOF_7'
          package com.example.lynxboster

          import android.Manifest
          import android.app.ActivityManager
          import android.app.AppOpsManager
          import android.app.usage.UsageEvents
          import android.app.usage.UsageStatsManager
          import android.content.pm.PackageManager
          import android.os.Build
          import android.app.NotificationManager
          import android.content.ClipData
          import android.content.ClipboardManager
          import android.content.Context
          import android.content.Intent
          import android.content.IntentFilter
          import android.hardware.display.DisplayManager
          import android.net.Uri
          import android.os.BatteryManager
          import android.os.Environment
          import android.os.StatFs
          import android.provider.Settings
          import android.view.Display
          import android.widget.Toast
          import java.io.File
          import java.net.InetSocketAddress
          import java.net.Socket

          data class Stats(
              val ramPct: Int = 0,
              val storagePct: Int = 0,
              val cpuGhz: Double? = null,
              val cpuPct: Int? = null,
              val gpuPct: Int? = null,
              val pingMs: Int? = null,
              val tempC: Float? = null,
              val batPct: Int = 0,
              val fps: Int? = null,
          )

          const val CHANNEL_URL = "https://whatsapp.com/channel/0029VbCt25oHVvTfEwfLOu1G"

          /** Item HUD: kunci pref "hud_<kunci>" dan label. */
          val HUD_ITEMS = listOf(
              "cpu" to "CPU",
              "gpu" to "GPU",
              "ram" to "RAM",
              "bat" to "Baterai",
              "temp" to "Suhu",
              "fps" to "FPS (butuh Shizuku)",
              "time" to "Jam",
          )

          fun hudDefault(key: String) = key in setOf("cpu", "ram", "bat", "temp", "time")

          data class AppItem(val pkg: String, val label: String, val isGame: Boolean)

          data class DnsResult(val name: String, val host: String, val ip: String, val ms: Int?)

          val KNOWN_GAMES = setOf(
              "com.dts.freefireth", "com.dts.freefiremax",
              "com.tencent.ig", "com.pubg.imobile", "com.pubg.krmobile", "com.vng.pubgmobile",
              "com.mobile.legends", "com.activision.callofduty.shooter", "com.garena.game.codm",
              "com.miHoYo.GenshinImpact", "com.supercell.brawlstars", "com.roblox.client",
              "com.mojang.minecraftpe", "com.ea.gp.fifamobile", "com.konami.pesmobile",
              "com.levelinfinite.sgameGlobal", "com.proximabeta.mf.uamo"
          )

          val DNS_LIST = listOf(
              Triple("Google", "dns.google", "8.8.8.8"),
              Triple("Cloudflare", "one.one.one.one", "1.1.1.1"),
              Triple("Quad9", "dns.quad9.net", "9.9.9.9"),
              Triple("AdGuard", "dns.adguard-dns.com", "94.140.14.14"),
          )

          // ---------- statistik ----------

          fun readCpuGhz(): Double? {
              var best = 0L
              for (i in 0 until 16) {
                  val f = File("/sys/devices/system/cpu/cpu$i/cpufreq/scaling_cur_freq")
                  val v = runCatching { f.readText().trim().toLong() }.getOrNull() ?: continue
                  if (v > best) best = v
              }
              return if (best > 0) best / 1_000_000.0 else null
          }

          fun readPing(host: String = "8.8.8.8", port: Int = 53): Int? = runCatching {
              val start = System.nanoTime()
              Socket().use { it.connect(InetSocketAddress(host, port), 2000) }
              ((System.nanoTime() - start) / 1_000_000).toInt()
          }.getOrNull()

          fun ramPercent(ctx: Context): Int {
              val am = ctx.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
              val mi = ActivityManager.MemoryInfo()
              am.getMemoryInfo(mi)
              return (((mi.totalMem - mi.availMem) * 100.0) / mi.totalMem).toInt()
          }

          fun batteryTemp(ctx: Context): Float? {
              val bat = ctx.registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
              return bat?.getIntExtra(BatteryManager.EXTRA_TEMPERATURE, -1)?.takeIf { it > 0 }?.let { it / 10f }
          }

          fun cpuLoadPct(): Int? {
              var cur = 0L
              var max = 0L
              for (i in 0 until 16) {
                  val base = "/sys/devices/system/cpu/cpu$i/cpufreq/"
                  val c = runCatching { File(base + "scaling_cur_freq").readText().trim().toLong() }.getOrNull() ?: continue
                  val m = runCatching { File(base + "cpuinfo_max_freq").readText().trim().toLong() }.getOrNull() ?: continue
                  if (c > cur) {
                      cur = c
                      max = m
                  }
              }
              return if (max > 0) (cur * 100 / max).toInt().coerceIn(0, 100) else null
          }

          /** Beban GPU dari beberapa jalur sysfs yang umum. Banyak HP memblokirnya, hasilnya bisa null. */
          fun readGpuPct(): Int? {
              val paths = listOf(
                  "/sys/class/kgsl/kgsl-3d0/gpu_busy_percentage",
                  "/sys/class/kgsl/kgsl-3d0/devfreq/gpu_load",
                  "/sys/kernel/gpu/gpu_busy",
                  "/sys/class/devfreq/gpufreq/load",
              )
              for (p in paths) {
                  val t = runCatching { File(p).readText() }.getOrNull() ?: continue
                  val n = Regex("\\d+").find(t)?.value?.toIntOrNull() ?: continue
                  return n.coerceIn(0, 100)
              }
              return null
          }

          fun batteryPercent(ctx: Context): Int {
              val bat = ctx.registerReceiver(null, IntentFilter(Intent.ACTION_BATTERY_CHANGED))
              val lvl = bat?.getIntExtra(BatteryManager.EXTRA_LEVEL, -1) ?: -1
              val scale = bat?.getIntExtra(BatteryManager.EXTRA_SCALE, 100) ?: 100
              return if (lvl >= 0 && scale > 0) lvl * 100 / scale else 0
          }

          fun dnsTarget(ctx: Context): Triple<String, String, String> {
              val i = ctx.getSharedPreferences("lx", Context.MODE_PRIVATE).getInt("dns_idx", 0).coerceIn(0, DNS_LIST.size - 1)
              return DNS_LIST[i]
          }

          fun readStats(ctx: Context, fpsPkg: String? = null): Stats {
              val sf = StatFs(Environment.getDataDirectory().path)
              val total = sf.blockCountLong * sf.blockSizeLong
              val free = sf.availableBlocksLong * sf.blockSizeLong
              val storage = (((total - free) * 100.0) / total).toInt()
              val fps = if (fpsPkg != null && Adv.ready()) Adv.fps(fpsPkg) else null
              return Stats(
                  ramPercent(ctx), storage, readCpuGhz(), cpuLoadPct(), readGpuPct(),
                  readPing(dnsTarget(ctx).third), batteryTemp(ctx), batteryPercent(ctx), fps
              )
          }

          fun environmentScore(s: Stats): Int {
              var score = 100.0
              score -= s.ramPct * 0.4
              score -= s.storagePct * 0.25
              score -= when {
                  s.pingMs == null -> 20
                  s.pingMs > 150 -> 20
                  s.pingMs > 80 -> 10
                  else -> 0
              }
              s.tempC?.let { if (it > 40) score -= (it - 40) * 2 }
              return score.toInt().coerceIn(0, 100)
          }

          fun environmentLevel(score: Int) = when {
              score >= 85 -> 3
              score >= 65 -> 2
              score >= 45 -> 1
              else -> 0
          }

          fun refreshRateHz(ctx: Context): Int {
              val dm = ctx.getSystemService(Context.DISPLAY_SERVICE) as DisplayManager
              return dm.getDisplay(Display.DEFAULT_DISPLAY)?.refreshRate?.let { Math.round(it) } ?: 60
          }

          // ---------- game dan aplikasi ----------

          fun launcherApps(ctx: Context): List<AppItem> {
              val pm = ctx.packageManager
              val i = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
              return pm.queryIntentActivities(i, 0)
                  .map { it.activityInfo.packageName }
                  .distinct()
                  .filter { it != ctx.packageName }
                  .mapNotNull { p ->
                      runCatching {
                          AppItem(p, pm.getApplicationLabel(pm.getApplicationInfo(p, 0)).toString(), p in KNOWN_GAMES)
                      }.getOrNull()
                  }
                  .sortedWith(compareByDescending<AppItem> { it.isGame }.thenBy { it.label.lowercase() })
          }

          fun launchGame(ctx: Context, pkg: String) {
              ctx.getSharedPreferences("lx", Context.MODE_PRIVATE).edit().putString("last_game", pkg).apply()
              val i = ctx.packageManager.getLaunchIntentForPackage(pkg)
              if (i != null) {
                  i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  ctx.startActivity(i)
              } else {
                  Toast.makeText(ctx, "Aplikasi tidak ditemukan", Toast.LENGTH_SHORT).show()
              }
          }

          // ---------- Quick Boost ----------

          /** Menutup proses latar belakang aplikasi lain. Android bisa menjalankan ulang sebagian, jadi hasilnya bervariasi. */
          fun quickBoost(ctx: Context): Pair<Int, Int> {
              val prefs = ctx.getSharedPreferences("lx", Context.MODE_PRIVATE)
              val keep = (prefs.getStringSet("games", emptySet()) ?: emptySet()) + KNOWN_GAMES + ctx.packageName
              val before = ramPercent(ctx)
              val am = ctx.getSystemService(Context.ACTIVITY_SERVICE) as ActivityManager
              launcherApps(ctx).forEach {
                  if (it.pkg !in keep) runCatching { am.killBackgroundProcesses(it.pkg) }
              }
              Thread.sleep(900)
              return before to ramPercent(ctx)
          }

          // ---------- DNS ----------

          fun dnsBenchmark(): List<DnsResult> =
              DNS_LIST.map { (name, host, ip) ->
                  val best = (1..3).mapNotNull { readPing(ip, 53) }.minOrNull()
                  DnsResult(name, host, ip, best)
              }.sortedBy { it.ms ?: Int.MAX_VALUE }

          fun copyText(ctx: Context, text: String) {
              val cm = ctx.getSystemService(Context.CLIPBOARD_SERVICE) as ClipboardManager
              cm.setPrimaryClip(ClipData.newPlainText("dns", text))
              Toast.makeText(ctx, "Disalin: $text", Toast.LENGTH_SHORT).show()
          }

          // ---------- Jangan Ganggu ----------

          fun enableDnd(ctx: Context): Boolean {
              val nm = ctx.getSystemService(NotificationManager::class.java)
              if (!nm.isNotificationPolicyAccessGranted) {
                  Toast.makeText(ctx, "Izinkan akses Jangan Ganggu dulu", Toast.LENGTH_LONG).show()
                  ctx.startActivity(
                      Intent(Settings.ACTION_NOTIFICATION_POLICY_ACCESS_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  )
                  return false
              }
              nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_PRIORITY)
              return true
          }

          fun disableDnd(ctx: Context) {
              val nm = ctx.getSystemService(NotificationManager::class.java)
              if (nm.isNotificationPolicyAccessGranted) {
                  nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_ALL)
              }
          }

          // ---------- overlay dan izin ----------

          fun startOverlay(ctx: Context, auto: Boolean = false): Boolean {
              if (auto && !hasUsageAccess(ctx)) {
                  Toast.makeText(ctx, "Izinkan \"Akses penggunaan\" dulu untuk Panel Otomatis", Toast.LENGTH_LONG).show()
                  openUsageAccess(ctx)
                  return false
              }
              if (!Settings.canDrawOverlays(ctx)) {
                  Toast.makeText(ctx, "Izinkan \"Tampil di atas aplikasi lain\" dulu", Toast.LENGTH_LONG).show()
                  ctx.startActivity(
                      Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:${ctx.packageName}"))
                          .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                  )
                  return false
              }
              ctx.startForegroundService(Intent(ctx, OverlayService::class.java).putExtra("auto", auto))
              return true
          }

          fun stopOverlay(ctx: Context) {
              ctx.stopService(Intent(ctx, OverlayService::class.java))
          }

          fun openWriteSettings(ctx: Context) {
              ctx.startActivity(
                  Intent(Settings.ACTION_MANAGE_WRITE_SETTINGS, Uri.parse("package:${ctx.packageName}"))
                      .addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
              )
          }

          fun openAccessibility(ctx: Context) {
              ctx.startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
          }

          fun openDisplaySettings(ctx: Context) {
              runCatching {
                  ctx.startActivity(Intent(Settings.ACTION_DISPLAY_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
              }
          }

          fun openNetworkSettings(ctx: Context) {
              runCatching {
                  ctx.startActivity(Intent(Settings.ACTION_WIRELESS_SETTINGS).addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
              }
          }

          // ---------- preset ----------

          data class Preset(
              val name: String,
              val desc: String,
              val dnd: Boolean,
              val boost: Boolean,
              val hud: Boolean,
              val adv: Boolean,
          )

          val PRESETS = listOf(
              Preset("Hemat", "Jangan Ganggu saja, tanpa boost. Paling hemat baterai.", true, false, false, false),
              Preset("Seimbang", "Jangan Ganggu dan Quick Boost saat sesi mulai.", true, true, false, false),
              Preset("Performa", "Jangan Ganggu, Quick Boost, HUD, dan boost lanjutan (butuh Shizuku).", true, true, true, true),
          )

          fun gameSet(ctx: Context): Set<String> {
              val saved = ctx.getSharedPreferences("lx", Context.MODE_PRIVATE).getStringSet("games", emptySet()) ?: emptySet()
              return if (saved.isEmpty()) KNOWN_GAMES else saved.toSet()
          }

          // ---------- DND tanpa membuka pengaturan ----------

          /** Mengembalikan filter sebelumnya, atau null kalau izin belum ada. */
          fun enableDndQuiet(ctx: Context): Int? {
              val nm = ctx.getSystemService(NotificationManager::class.java)
              if (!nm.isNotificationPolicyAccessGranted) return null
              val prev = nm.currentInterruptionFilter
              nm.setInterruptionFilter(NotificationManager.INTERRUPTION_FILTER_PRIORITY)
              return if (prev == NotificationManager.INTERRUPTION_FILTER_UNKNOWN) NotificationManager.INTERRUPTION_FILTER_ALL else prev
          }

          fun restoreDnd(ctx: Context, prev: Int) {
              val nm = ctx.getSystemService(NotificationManager::class.java)
              if (nm.isNotificationPolicyAccessGranted) nm.setInterruptionFilter(prev)
          }

          // ---------- aplikasi di depan (untuk Panel Otomatis) ----------

          @Volatile
          private var lastForeground: String? = null

          fun foregroundPackage(ctx: Context): String? {
              val usm = ctx.getSystemService(Context.USAGE_STATS_SERVICE) as UsageStatsManager
              val now = System.currentTimeMillis()
              val window = if (lastForeground == null) 600_000L else 20_000L
              val ev = usm.queryEvents(now - window, now)
              val e = UsageEvents.Event()
              var cur: String? = null
              var seen = false
              while (ev.hasNextEvent()) {
                  ev.getNextEvent(e)
                  if (e.eventType == UsageEvents.Event.ACTIVITY_RESUMED) {
                      cur = e.packageName
                      seen = true
                  } else if (e.eventType == UsageEvents.Event.ACTIVITY_PAUSED && e.packageName == cur) {
                      cur = null
                      seen = true
                  }
              }
              if (seen) lastForeground = cur
              return lastForeground
          }

          // ---------- status izin ----------

          fun hasUsageAccess(ctx: Context): Boolean {
              val ops = ctx.getSystemService(Context.APP_OPS_SERVICE) as AppOpsManager
              val mode = ops.unsafeCheckOpNoThrow(AppOpsManager.OPSTR_GET_USAGE_STATS, android.os.Process.myUid(), ctx.packageName)
              return mode == AppOpsManager.MODE_ALLOWED
          }

          fun hasNotifListener(ctx: Context): Boolean {
              val s = Settings.Secure.getString(ctx.contentResolver, "enabled_notification_listeners") ?: return false
              return s.contains(ctx.packageName)
          }

          fun a11yEnabled(ctx: Context): Boolean {
              val s = Settings.Secure.getString(ctx.contentResolver, Settings.Secure.ENABLED_ACCESSIBILITY_SERVICES) ?: return false
              return s.contains(ctx.packageName)
          }

          fun hasPostNotif(ctx: Context): Boolean =
              Build.VERSION.SDK_INT < 33 ||
