name: Build Lynx Boster

# Satu file ini sudah berisi seluruh proyek. Cukup simpan sebagai .github/workflows/build.yml,
# lalu buka tab Actions > Build Lynx Boster > Run workflow, dan unduh APK dari Artifacts.

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Tulis seluruh berkas proyek
        run: |
          set -e
          mkdir -p proj
          cd proj
          cat > 'build.gradle.kts' <<'LYNX_EOF_0'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          LYNX_EOF_0
          cat > 'gradle.properties' <<'LYNX_EOF_1'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          LYNX_EOF_1
          cat > 'settings.gradle.kts' <<'LYNX_EOF_2'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "LynxBoster"
          include(":app")
          LYNX_EOF_2
          mkdir -p 'app'
          cat > 'app/build.gradle.kts' <<'LYNX_EOF_3'
