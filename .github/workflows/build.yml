              )
              private val akhir = setOf(
                  "dong", "donk", "ya", "yah", "deh", "aja", "saja", "nih", "sih", "please", "plis", "lah", "kak", "bro"
              )
              private val vBuka = setOf("buka", "open", "jalankan", "launch", "masuk", "bukain", "bukakan")
              private val vCari = setOf("cari", "carikan", "search", "googling", "google")
              private val vKetik = setOf("ketik", "ketikkan", "tulis", "tuliskan", "type")
              private val vTap = setOf("tap", "klik", "ketuk", "pencet", "tekan")
              private val vTelp = setOf("telepon", "telpon", "call", "hubungi")
              private val vYt = setOf("putar", "putarkan", "yt", "youtube")
              private val vMaps = setOf("maps", "peta", "navigasi")
              private val vHitung = setOf("hitung", "calc")
              private val jaga = vKetik + vCari + vYt + vMaps + vHitung + setOf("kirim")

              private var torchOn = false

              fun run(ctx: Context, raw: String): Hasil {
                  val tokens = raw.trim().split(" ").filter { it.isNotEmpty() }.toMutableList()
                  while (tokens.isNotEmpty() && tokens[0].lowercase() in awal) tokens.removeAt(0)
                  if (tokens.isEmpty()) return Hasil("Ketik perintah, misalnya: buka wa", false)
                  val verb = tokens[0].lowercase()
                  if (verb !in jaga) {
                      while (tokens.size > 1 && tokens[tokens.size - 1].lowercase() in akhir) {
                          tokens.removeAt(tokens.size - 1)
                      }
                  }
                  val rest = tokens.drop(1).joinToString(" ")
                  val restL = rest.lowercase()
                  val all = tokens.joinToString(" ").lowercase()
                  return try {
                      dispatch(ctx, verb, rest, restL, all)
                  } catch (e: Exception) {
                      Hasil("Gagal: " + (e.message ?: "kesalahan"), false)
                  }
              }

              private fun dispatch(ctx: Context, verb: String, rest: String, restL: String, all: String): Hasil {
                  val ada = rest.isNotEmpty()
                  return when {
                      verb in vBuka && ada -> buka(ctx, restL)
                      verb in vCari && ada -> view(
                          ctx, "https://www.google.com/search?q=" + Uri.encode(rest), "Mencari: $rest"
                      )
                      verb in vKetik && ada -> acc { it.ketik(rest) }
                      verb in vTap && ada -> acc { it.tap(rest) }
                      verb in vTelp && ada -> start(
                          ctx, Intent(Intent.ACTION_DIAL, Uri.parse("tel:" + Uri.encode(rest))), "Menelepon $rest"
                      )
                      verb in vYt && ada -> view(
                          ctx, "https://www.youtube.com/results?search_query=" + Uri.encode(rest), "Mencari di YouTube: $rest"
                      )
                      verb in vMaps && ada -> start(
                          ctx, Intent(Intent.ACTION_VIEW, Uri.parse("geo:0,0?q=" + Uri.encode(rest))), "Membuka peta: $rest"
                      )
                      verb == "kirim" && restL.startsWith("wa ") -> kirimWa(ctx, rest.drop(3).trim())
                      verb == "alarm" || verb == "bangunkan" || verb == "bangunin" -> alarm(ctx, restL)
                      verb == "timer" -> timer(ctx, restL)
                      verb in vHitung && ada -> hitung(rest)
                      else -> tunggal(ctx, all)
                  }
              }

              private fun acc(f: (AsistenAccessibilityService) -> String): Hasil {
                  val s = AsistenAccessibilityService.instance
                      ?: return Hasil("Aktifkan layanan Aksesibilitas dulu (Pengaturan > Aksesibilitas > Lynxora AI)", false)
                  val r = f(s)
                  val gagal = r.startsWith("Tidak") || r.startsWith("Gagal") || r.startsWith("Layar")
                  return Hasil(r, !gagal)
              }

              private fun start(ctx: Context, i: Intent, ok: String): Hasil {
                  return try {
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      ctx.startActivity(i)
                      Hasil(ok, true)
                  } catch (e: Exception) {
                      Hasil("Gagal: " + (e.message ?: "tidak diketahui"), false)
                  }
              }

              private fun view(ctx: Context, url: String, ok: String): Hasil =
                  start(ctx, Intent(Intent.ACTION_VIEW, Uri.parse(url)), ok)

              private fun cariApp(ctx: Context, n: String, longgar: Boolean): Intent? {
                  val pm = ctx.packageManager
                  val info = apps.firstOrNull { n in it.names }
                  if (info != null) {
                      for (p in info.pkgs) {
                          val i = pm.getLaunchIntentForPackage(p)
                          if (i != null) return i
                      }
                  }
                  val list = pm.queryIntentActivities(
                      Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER), 0
                  )
                  val keys = (info?.keys ?: emptyList<String>()) + n
                  for (k in keys) {
                      val m = list.firstOrNull { it.loadLabel(pm).toString().lowercase() == k }
                      if (m != null) return pm.getLaunchIntentForPackage(m.activityInfo.packageName)
                  }
                  if (longgar) {
                      for (k in keys) {
                          if (k.length < 3) continue
                          val m = list.firstOrNull { it.loadLabel(pm).toString().lowercase().contains(k) }
                          if (m != null) return pm.getLaunchIntentForPackage(m.activityInfo.packageName)
                      }
                  }
                  return null
              }

              private fun buka(ctx: Context, n: String): Hasil {
                  if (Regex("^[a-z0-9-]+(\\.[a-z0-9-]+)+(/\\S*)?$").matches(n)) {
                      val url = if (n.startsWith("http")) n else "https://$n"
                      return view(ctx, url, "Membuka $n")
                  }
                  val s = sistem(ctx, n)
                  if (s != null) return s
                  val i = cariApp(ctx, n, true)
                  if (i != null) return start(ctx, i, "Membuka $n")
                  if (n == "kamera" || n == "camera") {
                      return start(ctx, Intent(MediaStore.INTENT_ACTION_STILL_IMAGE_CAMERA), "Membuka kamera")
                  }
                  return Hasil("Aplikasi tidak ditemukan: $n", false)
              }

              private fun sistem(ctx: Context, n: String): Hasil? {
                  return when (n) {
                      "notifikasi", "notif" ->
                          acc { it.global(AccessibilityService.GLOBAL_ACTION_NOTIFICATIONS, "Membuka notifikasi") }
                      "setelan", "pengaturan", "setting", "settings" ->
                          start(ctx, Intent(Settings.ACTION_SETTINGS), "Membuka pengaturan")
                      "wifi", "wi-fi" ->
                          start(ctx, Intent(Settings.ACTION_WIFI_SETTINGS), "Membuka pengaturan Wi-Fi")
                      "bluetooth" ->
                          start(ctx, Intent(Settings.ACTION_BLUETOOTH_SETTINGS), "Membuka pengaturan Bluetooth")
                      "mode pesawat" ->
                          start(ctx, Intent(Settings.ACTION_AIRPLANE_MODE_SETTINGS), "Membuka mode pesawat")
                      "kontak" ->
                          start(ctx, Intent(Intent.ACTION_VIEW, ContactsContract.Contacts.CONTENT_URI), "Membuka kontak")
                      "telepon", "dialer" ->
                          start(ctx, Intent(Intent.ACTION_DIAL), "Membuka telepon")
                      "alarm" ->
                          start(ctx, Intent(AlarmClock.ACTION_SHOW_ALARMS), "Membuka alarm")
                      else -> null
                  }
              }

              private fun kirimWa(ctx: Context, s: String): Hasil {
                  val p = s.split(" ", limit = 2)
                  var no = p[0].filter { it.isDigit() }
                  if (no.length < 8) return Hasil("Format: kirim wa 0812xxxx isi pesan", false)
                  no = if (no.startsWith("0")) "62" + no.drop(1) else if (no.startsWith("8")) "62$no" else no
                  val pesan = if (p.size > 1) p[1] else ""
                  val r = view(ctx, "https://wa.me/" + no + "?text=" + Uri.encode(pesan), "Membuka chat WhatsApp")
                  Handler(Looper.getMainLooper()).postDelayed({
                      val svc = AsistenAccessibilityService.instance
                      if (svc != null && pesan.isNotEmpty()) {
                          if (svc.tap("Kirim").startsWith("Tidak")) svc.tap("Send")
                      }
                  }, 3500)
                  return r
              }

              private fun alarm(ctx: Context, s: String): Hasil {
                  val m = Regex("(\\d{1,2})(?:[.:](\\d{2}))?").find(s)
                      ?: return Hasil("Contoh: alarm jam 6.30", false)
                  var jam = m.groupValues[1].toInt()
                  val mnt = if (m.groupValues[2].isEmpty()) 0 else m.groupValues[2].toInt()
                  if ((s.contains("sore") || s.contains("malam")) && jam < 12) jam += 12
                  if (jam > 23 || mnt > 59) return Hasil("Jam tidak valid", false)
                  val i = Intent(AlarmClock.ACTION_SET_ALARM)
                      .putExtra(AlarmClock.EXTRA_HOUR, jam)
                      .putExtra(AlarmClock.EXTRA_MINUTES, mnt)
                      .putExtra(AlarmClock.EXTRA_MESSAGE, "Lynxora AI")
                      .putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                  return start(ctx, i, "Alarm dipasang " + String.format("%02d.%02d", jam, mnt))
              }

              private fun timer(ctx: Context, s: String): Hasil {
                  val m = Regex("(\\d+)\\s*(detik|dtk|menit|mnt|jam)?").find(s)
                      ?: return Hasil("Contoh: timer 5 menit", false)
                  val n = m.groupValues[1].toInt()
                  val u = m.groupValues[2]
                  val detik = when (u) {
                      "detik", "dtk" -> n
                      "jam" -> n * 3600
                      else -> n * 60
                  }
                  val satuan = if (u.isEmpty()) "menit" else u
                  val i = Intent(AlarmClock.ACTION_SET_TIMER)
                      .putExtra(AlarmClock.EXTRA_LENGTH, detik)
                      .putExtra(AlarmClock.EXTRA_SKIP_UI, true)
                  return start(ctx, i, "Timer $n $satuan dimulai")
              }

              private fun hitung(s: String): Hasil {
                  val e = s.lowercase()
                      .replace("kali", "*").replace("tambah", "+").replace("kurang", "-")
                      .replace("bagi", "/").replace(",", ".").replace("=", "").replace("berapa", "")
                  return try {
                      val v = Hitung(e).hasil()
                      if (v.isNaN() || v.isInfinite()) {
                          Hasil("Tidak bisa dihitung", false)
                      } else {
                          val teks = if (v % 1.0 == 0.0 && Math.abs(v) < 1e15) {
                              v.toLong().toString()
                          } else {
                              String.format(Locale.US, "%.6f", v).trimEnd('0').trimEnd('.')
                          }
                          Hasil(s + " = " + teks, false)
                      }
                  } catch (ex: Exception) {
                      Hasil("Tidak bisa dihitung. Contoh: hitung 12*5", false)
                  }
              }

              private fun senter(ctx: Context, a: String): Hasil {
                  val mati = a.contains("mati") || a.contains("off")
                  val hidup = a.contains("nyala") || a.contains("hidup") || a.contains("on")
                  val on = if (mati) false else if (hidup) true else !torchOn
                  return try {
                      val cm = ctx.getSystemService(Context.CAMERA_SERVICE) as CameraManager
                      val id = cm.cameraIdList.firstOrNull {
                          cm.getCameraCharacteristics(it).get(CameraCharacteristics.FLASH_INFO_AVAILABLE) == true
                      } ?: return Hasil("HP ini tidak punya senter", false)
                      cm.setTorchMode(id, on)
                      torchOn = on
                      Hasil(if (on) "Senter dinyalakan" else "Senter dimatikan", true)
                  } catch (e: Exception) {
                      Hasil("Gagal: " + (e.message ?: "senter"), false)
                  }
              }

              private fun volume(ctx: Context, a: String): Hasil {
                  val am = ctx.getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  val st = AudioManager.STREAM_MUSIC
                  return when {
                      a.contains("max") || a.contains("penuh") -> {
                          am.setStreamVolume(st, am.getStreamMaxVolume(st), AudioManager.FLAG_SHOW_UI)
                          Hasil("Volume maksimal", false)
                      }
                      a.contains("naik") || a.contains("besar") || a.contains("keras") -> {
                          am.adjustStreamVolume(st, AudioManager.ADJUST_RAISE, AudioManager.FLAG_SHOW_UI)
                          am.adjustStreamVolume(st, AudioManager.ADJUST_RAISE, AudioManager.FLAG_SHOW_UI)
                          Hasil("Volume dinaikkan", false)
                      }
                      a.contains("turun") || a.contains("kecil") || a.contains("pelan") -> {
                          am.adjustStreamVolume(st, AudioManager.ADJUST_LOWER, AudioManager.FLAG_SHOW_UI)
                          am.adjustStreamVolume(st, AudioManager.ADJUST_LOWER, AudioManager.FLAG_SHOW_UI)
                          Hasil("Volume diturunkan", false)
                      }
                      a.contains("mute") || a.contains("senyap") || a.contains("diam") -> {
                          am.setStreamVolume(st, 0, AudioManager.FLAG_SHOW_UI)
                          Hasil("Volume dibisukan", false)
                      }
                      else -> Hasil("Contoh: volume naik, volume turun, volume max, volume mute", false)
                  }
              }

              private fun baterai(ctx: Context): Hasil {
                  val bm = ctx.getSystemService(Context.BATTERY_SERVICE) as BatteryManager
                  val p = bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)
                  return Hasil("Baterai $p%", false)
              }

              private fun screenshot(): Hasil {
                  val s = AsistenAccessibilityService.instance
                      ?: return Hasil("Aktifkan layanan Aksesibilitas dulu", false)
                  Handler(Looper.getMainLooper()).postDelayed({
                      s.global(AccessibilityService.GLOBAL_ACTION_TAKE_SCREENSHOT, "ok")
                  }, 1800)
                  return Hasil("Screenshot dalam 2 detik...", true)
              }

              private fun appFallback(ctx: Context, a: String): Hasil {
                  val i = cariApp(ctx, a, false)
                  if (i != null) return start(ctx, i, "Membuka $a")
                  return Hasil("Aku belum paham: $a. Ketik bantuan untuk daftar perintah.", false)
              }

              private fun bantuan(): Hasil {
                  val b = "\u2022 buka wa / ml / ig / yt / tiktok / kamera ...\n" +
                      "\u2022 cari ..., youtube ..., maps ...\n" +
                      "\u2022 ketik ..., tap ..., scroll bawah/atas\n" +
                      "\u2022 kembali, beranda, notifikasi, screenshot\n" +
                      "\u2022 senter nyala/mati, volume naik/turun/max\n" +
                      "\u2022 alarm jam 6.30, timer 5 menit\n" +
                      "\u2022 hitung 12*5, jam berapa, tanggal, baterai\n" +
                      "\u2022 kirim wa 0812xxxx isi pesan\n" +
                      "\u2022 telepon 0812xxxx"
                  return Hasil(b, false)
              }

              private fun tunggal(ctx: Context, a: String): Hasil {
                  val sapa = setOf("halo", "hai", "hi", "hei", "hey", "p", "assalamualaikum", "pagi", "siang", "malam")
                  return when {
                      a in setOf("kembali", "back", "balik") ->
                          acc { it.global(AccessibilityService.GLOBAL_ACTION_BACK, "Kembali") }
                      a in setOf("beranda", "home", "layar utama") ->
                          acc { it.global(AccessibilityService.GLOBAL_ACTION_HOME, "Ke beranda") }
                      a in setOf("terbaru", "recent", "recents", "aplikasi terbaru") ->
                          acc { it.global(AccessibilityService.GLOBAL_ACTION_RECENTS, "Aplikasi terbaru") }
                      a == "scroll bawah" || a == "turun" || a == "scroll turun" -> acc { it.scroll(true) }
                      a == "scroll atas" || a == "naik" || a == "scroll naik" -> acc { it.scroll(false) }
                      a == "screenshot" || a == "ss" || a == "tangkap layar" -> screenshot()
                      a == "kunci layar" || a == "kunci" || a == "lock" ->
                          acc { it.global(AccessibilityService.GLOBAL_ACTION_LOCK_SCREEN, "Layar dikunci") }
                      a.contains("senter") || a.contains("flash") -> senter(ctx, a)
                      a.contains("volume") -> volume(ctx, a)
                      a.contains("baterai") || a == "batre" -> baterai(ctx)
                      a == "jam" || a.contains("jam berapa") || a == "waktu" -> {
                          val t = SimpleDateFormat("HH.mm", Locale("id", "ID")).format(Date())
                          Hasil("Sekarang jam $t", false)
                      }
                      a.startsWith("tanggal") || a == "hari ini" || a == "hari apa" -> {
                          val t = SimpleDateFormat("EEEE, d MMMM yyyy", Locale("id", "ID")).format(Date())
                          Hasil("Hari ini $t", false)
                      }
                      a in setOf("bantuan", "help", "menu", "?") -> bantuan()
                      a in sapa -> Hasil("Halo! Ada yang bisa kubantu? Ketik bantuan untuk daftar perintah.", false)
                      a.contains("terima kasih") || a.contains("makasih") || a == "thanks" -> Hasil("Sama-sama!", false)
                      Regex("^[0-9+\\-*/x:().,\\s]+$").matches(a) && a.any { it.isDigit() } && a.any { it in "+-*/x:" } -> hitung(a)
                      else -> sistem(ctx, a) ?: appFallback(ctx, a)
                  }
              }
          }
