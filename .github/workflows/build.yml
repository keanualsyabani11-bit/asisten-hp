              val p = remember { ctx.getSharedPreferences("lx", Context.MODE_PRIVATE) }
              var stats by remember { mutableStateOf(Stats()) }
              var apps by remember { mutableStateOf(listOf<AppItem>()) }
              var showAll by rememberSaveable { mutableStateOf(false) }
              var selected by remember { mutableStateOf<AppItem?>(null) }
              var preset by remember { mutableStateOf(p.getInt("preset", 1).coerceIn(0, PRESETS.size - 1)) }
              var autoOn by remember { mutableStateOf(p.getBoolean("auto_panel", false)) }

              LaunchedEffect(tick) {
                  apps = withContext(Dispatchers.IO) { runCatching { launcherApps(ctx) }.getOrDefault(emptyList()) }
              }
              LaunchedEffect(Unit) {
                  while (true) {
                      stats = withContext(Dispatchers.IO) { runCatching { readStats(ctx) }.getOrDefault(Stats()) }
                      delay(2500)
                  }
              }

              val score = environmentScore(stats)
              val shown = if (showAll) apps else apps.filter { it.isGame }.ifEmpty { apps.take(30) }
              val running = OverlayService.isRunning

              Box(Modifier.fillMaxSize()) {
                  LazyColumn(
                      Modifier.fillMaxSize().padding(horizontal = 16.dp),
                      verticalArrangement = Arrangement.spacedBy(12.dp)
                  ) {
                      item {
                          Row(Modifier.padding(top = 12.dp), verticalAlignment = Alignment.CenterVertically) {
                              Image(painterResource(R.drawable.logo), null, Modifier.height(36.dp).width(120.dp), contentScale = ContentScale.Fit)
                              Spacer(Modifier.weight(1f))
                              T("Baterai ${stats.batPct}%", 12, DIM)
                          }
                      }
                      item {
                          Panel {
                              Row(verticalAlignment = Alignment.CenterVertically) {
                                  Column(Modifier.weight(1f)) {
                                      T("Kondisi perangkat", 12, DIM)
                                      T(listOf("Perlu dibersihkan", "Cukup", "Baik", "Sangat baik")[environmentLevel(score).coerceIn(0, 3)], 20, bold = true)
                                  }
                                  T("$score", 34, ACC, true)
                              }
                              Spacer(Modifier.height(10.dp))
                              Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                                  StatMini(R.drawable.ic_ram, "RAM", "${stats.ramPct}%")
                                  StatMini(R.drawable.ic_cpu, "CPU", stats.cpuGhz?.let { "%.1fGHz".format(it) } ?: "-")
                                  StatMini(R.drawable.ic_thermo, "Suhu", stats.tempC?.let { "%.0fC".format(it) } ?: "-")
                                  StatMini(R.drawable.ic_refresh, "Layar", "${refreshRateHz(ctx)}Hz")
                              }
                          }
                      }
                      item {
                          Panel {
                              T("Mode", 14, bold = true)
                              Spacer(Modifier.height(8.dp))
                              Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                  PRESETS.forEachIndexed { i, pr ->
                                      Chip(pr.name, preset == i) {
                                          preset = i
                                          p.edit().putInt("preset", i).apply()
                                      }
                                  }
                              }
                              Spacer(Modifier.height(6.dp))
                              T(PRESETS[preset].desc, 12, DIM)
                          }
                      }
                      item {
                          Panel {
                              Row(Modifier.fillMaxWidth().padding(vertical = 4.dp), verticalAlignment = Alignment.CenterVertically) {
                                  Column(Modifier.weight(1f)) {
                                      T("Panel Otomatis", 14)
                                      T("Muncul sendiri saat game dibuka", 12, DIM)
                                  }
                                  Switch(
                                      checked = autoOn,
                                      onCheckedChange = { on ->
                                          if (on) {
                                              if (startOverlay(ctx, true)) {
                                                  autoOn = true
                                                  p.edit().putBoolean("auto_panel", true).apply()
                                              }
                                          } else {
                                              autoOn = false
                                              p.edit().putBoolean("auto_panel", false).apply()
                                              stopOverlay(ctx)
                                          }
                                      },
                                      colors = SwitchDefaults.colors(checkedTrackColor = ACC)
                                  )
                              }
                              Spacer(Modifier.height(6.dp))
                              Button(
                                  onClick = {
                                      if (running) {
                                          stopOverlay(ctx)
                                          p.edit().putBoolean("auto_panel", false).apply()
                                          autoOn = false
                                      } else {
                                          startOverlay(ctx, false)
                                      }
                                  },
                                  modifier = Modifier.fillMaxWidth(),
                                  colors = ButtonDefaults.buttonColors(containerColor = if (running) BAD else ACC)
                              ) {
                                  Text(if (running) "Matikan panel melayang" else "Nyalakan panel melayang")
                              }
                          }
                      }
                      item {
                          Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {
                              T("Pilih game", 16, bold = true, modifier = Modifier.weight(1f))
                              T(if (showAll) "Hanya game" else "Semua aplikasi", 12, ACC, modifier = Modifier.clickable { showAll = !showAll })
                          }
                      }
                      items(shown.size) { idx ->
                          val a = shown[idx]
                          Row(
                              Modifier
                                  .fillMaxWidth()
                                  .clip(RoundedCornerShape(14.dp))
                                  .background(CARD)
                                  .clickable { selected = a }
                                  .padding(10.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              AppIcon(a.pkg, 44)
                              Spacer(Modifier.width(12.dp))
                              Column(Modifier.weight(1f)) {
                                  T(a.label, 14, bold = true)
                                  T(if (a.isGame) "Game" else "Aplikasi", 11, DIM)
                              }
                              Ic(R.drawable.ic_arrow_right, 18, DIM)
