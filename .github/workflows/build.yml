          mkdir -p $(dirname app/src/main/java/com/asisten/hp/AsistenAccessibilityService.kt)
          cat > app/src/main/java/com/asisten/hp/AsistenAccessibilityService.kt <<'__END_10__'
          package com.asisten.hp

          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.os.Bundle
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo

          class AsistenAccessibilityService : AccessibilityService() {

              companion object {
                  var instance: AsistenAccessibilityService? = null
              }

              override fun onServiceConnected() {
                  instance = this
              }

              override fun onUnbind(intent: Intent?): Boolean {
                  instance = null
                  return super.onUnbind(intent)
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {}

              fun global(action: Int, ok: String): String =
                  if (performGlobalAction(action)) ok else "Gagal"

              fun ketik(text: String): String {
                  val root = rootInActiveWindow ?: return "Layar tidak terbaca"
                  val node = root.findFocus(AccessibilityNodeInfo.FOCUS_INPUT) ?: findEditable(root)
                      ?: return "Tidak ada kolom input. Tap kolomnya dulu"
                  val args = Bundle()
                  args.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text)
                  return if (node.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)) {
                      "Mengetik: $text"
                  } else {
                      "Gagal mengetik"
                  }
              }

              fun tap(text: String): String {
                  val root = rootInActiveWindow ?: return "Layar tidak terbaca"
                  val nodes = root.findAccessibilityNodeInfosByText(text)
                  for (n in nodes) {
                      var x: AccessibilityNodeInfo? = n
                      while (x != null && !x.isClickable) x = x.parent
                      if (x != null && x.performAction(AccessibilityNodeInfo.ACTION_CLICK)) {
                          return "Tap: $text"
                      }
                  }
                  return "Tidak menemukan: $text"
              }

              fun scroll(down: Boolean): String {
                  val root = rootInActiveWindow ?: return "Layar tidak terbaca"
                  val node = findScrollable(root) ?: return "Tidak ada yang bisa di-scroll"
                  val act = if (down) AccessibilityNodeInfo.ACTION_SCROLL_FORWARD
                  else AccessibilityNodeInfo.ACTION_SCROLL_BACKWARD
                  return if (node.performAction(act)) "Scroll" else "Gagal scroll"
              }

              private fun findEditable(n: AccessibilityNodeInfo?): AccessibilityNodeInfo? {
                  if (n == null) return null
                  if (n.isEditable) return n
                  for (i in 0 until n.childCount) {
                      val r = findEditable(n.getChild(i))
                      if (r != null) return r
                  }
                  return null
              }

              private fun findScrollable(n: AccessibilityNodeInfo?): AccessibilityNodeInfo? {
                  if (n == null) return null
                  if (n.isScrollable) return n
                  for (i in 0 until n.childCount) {
                      val r = findScrollable(n.getChild(i))
                      if (r != null) return r
                  }
                  return null
              }
          }
