                      LinearLayout.LayoutParams(dp(120), ViewGroup.LayoutParams.WRAP_CONTENT)
                  )
                  side.addView(TextView(this).apply {
                      text = "Warna"
                      textSize = 11f
                      setTextColor(dim)
                      setPadding(0, dp(8), 0, 0)
                  })
                  val sw = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
