          }

          fun openShizuku(ctx: Context) {
              val i = ctx.packageManager.getLaunchIntentForPackage("moe.shizuku.privileged.api")
              if (i != null) ctx.startActivity(i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK))
              else Toast.makeText(ctx, "Aplikasi Shizuku belum terpasang", Toast.LENGTH_LONG).show()
          }

          // ---------- waktu main, tautan ----------

          fun playTimeText(ctx: Context, pkg: String): String {
              if (!hasUsageAccess(ctx)) return "-"
              val usm = ctx.getSystemService(Context.USAGE_STATS_SERVICE) as UsageStatsManager
              val now = System.currentTimeMillis()
              val ms = usm.queryAndAggregateUsageStats(now - 7L * 24 * 3600 * 1000, now)[pkg]?.totalTimeInForeground ?: 0L
              val min = ms / 60000
              return if (min >= 60) "${min / 60}h ${min % 60}m" else "${min}m"
          }

          fun openUrl(ctx: Context, url: String) {
