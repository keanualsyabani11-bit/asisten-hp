          class Hasil(val teks: String, val tutup: Boolean = true)

          private class Hitung(val s: String) {
              var p = 0

              fun hasil(): Double {
                  val v = expr()
                  ws()
                  if (p < s.length) throw IllegalArgumentException("sisa")
                  return v
              }

              private fun ws() {
                  while (p < s.length && s[p] == ' ') p++
              }

              private fun expr(): Double {
                  var v = term()
                  var selesai = false
                  while (!selesai) {
                      ws()
                      if (p < s.length && s[p] == '+') { p++; v += term() }
                      else if (p < s.length && s[p] == '-') { p++; v -= term() }
                      else selesai = true
                  }
                  return v
              }

              private fun term(): Double {
                  var v = faktor()
                  var selesai = false
                  while (!selesai) {
                      ws()
                      if (p < s.length && (s[p] == '*' || s[p] == 'x')) { p++; v *= faktor() }
                      else if (p < s.length && (s[p] == '/' || s[p] == ':')) { p++; v /= faktor() }
                      else selesai = true
                  }
                  return v
              }

              private fun faktor(): Double {
                  ws()
                  if (p < s.length && s[p] == '-') { p++; return -faktor() }
                  if (p < s.length && s[p] == '(') {
                      p++
                      val v = expr()
                      ws()
                      if (p < s.length && s[p] == ')') p++
                      return v
                  }
                  val st = p
                  while (p < s.length && (s[p].isDigit() || s[p] == '.')) p++
                  if (st == p) throw IllegalArgumentException("angka")
                  return s.substring(st, p).toDouble()
              }
          }

