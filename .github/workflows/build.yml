              // ---------- HUD (item, posisi, ukuran, transparansi dari pref) ----------

              private fun addHud() {
                  if (hudView != null) return
                  hudTexts.clear()
                  val sizeSp = prefs.getInt("hud_size", 11).toFloat()
                  val alphaPct = prefs.getInt("hud_alpha", 60).coerceIn(0, 100)
                  val row = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(dp(10), dp(4), dp(10), dp(4))
                      background = rounded((alphaPct * 255 / 100) shl 24, 10)
                      visibility = if (overlaysVisible) View.VISIBLE else View.GONE
                  }
                  val icons = mapOf(
                      "cpu" to R.drawable.ic_cpu, "gpu" to R.drawable.ic_gpu, "ram" to R.drawable.ic_ram,
                      "bat" to R.drawable.ic_battery, "temp" to R.drawable.ic_thermo,
                      "fps" to R.drawable.ic_speed, "time" to R.drawable.ic_clock
                  )
                  var any = false
                  for ((key, _) in HUD_ITEMS) {
                      if (!prefs.getBoolean("hud_$key", hudDefault(key))) continue
                      any = true
                      val ic = icon(icons.getValue(key), 13, 0xFF7CC4FF.toInt())
                      (ic.layoutParams as LinearLayout.LayoutParams).rightMargin = dp(3)
                      row.addView(ic)
                      val tv = TextView(this).apply {
                          textSize = sizeSp
                          setTextColor(Color.WHITE)
                          typeface = Typeface.MONOSPACE
                          text = "-"
                          setPadding(0, 0, dp(10), 0)
                      }
                      hudTexts[key] = tv
                      row.addView(tv)
                  }
                  if (!any) {
                      row.addView(TextView(this).apply {
                          text = "HUD kosong"
                          textSize = sizeSp
                          setTextColor(dim)
                      })
                  }
                  val grav = when (prefs.getInt("hud_pos", 0)) {
                      1 -> Gravity.TOP or Gravity.START
                      2 -> Gravity.TOP or Gravity.END
                      else -> Gravity.TOP or Gravity.CENTER_HORIZONTAL
                  }
                  val params = lp(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT, untouchable).apply {
                      gravity = grav
                      x = dp(8)
                      y = dp(4)
                  }
                  wm.addView(row, params)
                  hudView = row
              }

              private fun removeHud() {
                  hudView?.let { runCatching { wm.removeView(it) } }
                  hudView = null
                  hudTexts.clear()
              }

              private fun rebuildHud() {
                  if (!hudOn) return
                  removeHud()
                  addHud()
              }

              private fun syncHud() {
                  val want = prefs.getBoolean("hud_on", false)
                  if (want && !hudOn) {
                      hudOn = true
                      addHud()
                  } else if (!want && hudOn) {
                      hudOn = false
                      removeHud()
                  }
              }

              // ---------- polling dan timer ----------

              private val tick = object : Runnable {
                  override fun run() {
                      if (!running) return
                      val sec = (SystemClock.elapsedRealtime() - startMs) / 1000
                      timerView?.text = "Sesi %02d:%02d".format(sec / 60, sec % 60)
                      hudTexts["time"]?.text = SimpleDateFormat("HH:mm:ss", Locale.getDefault()).format(Date())
                      ui.postDelayed(this, 1000)
                  }
              }

              private fun startPolling() {
                  running = true
                  Thread {
                      while (running) {
                          if (autoMode) watchForeground()
                          if (prefs.getBoolean("dns_on", false)) {
                              runCatching { readPing(dnsTarget(this@OverlayService).third) }
                          }
                          if (hudOn || panelOpen) {
                              val fpsPkg = if (hudOn && prefs.getBoolean("hud_fps", false)) {
                                  currentGame ?: prefs.getString("last_game", null)
                              } else null
                              val s = runCatching { readStats(this@OverlayService, fpsPkg) }.getOrNull()
                              if (s != null) {
                                  ui.post { applyStats(s) }
                                  checkHeat(s.tempC)
                              }
                          } else if (prefs.getBoolean("heat", true)) {
                              checkHeat(batteryTemp(this@OverlayService))
                          }
                          if (panelOpen) refreshMusic()
                          try {
                              Thread.sleep(2000)
                          } catch (_: InterruptedException) {
                              break
                          }
                      }
                  }.start()
              }

              /** Panel Otomatis: tampil saat salah satu game di library berada di depan, sembunyi saat ditinggalkan. */
              private fun watchForeground() {
                  val fg = runCatching { foregroundPackage(this) }.getOrNull()
                  val inGame = fg != null && fg in gameSet(this)
                  val ignorable = fg == null ||
                      fg == packageName ||
                      fg.startsWith("com.android.systemui") ||
                      fg.startsWith("com.android.permissioncontroller")
                  if (inGame) {
                      outCount = 0
                      if (!sessionActive) ui.post { onSessionStart(fg) }
                  } else if (sessionActive && !ignorable) {
                      outCount++
                      if (outCount >= 2) ui.post { onSessionEnd() }
                  }
              }

              private fun checkHeat(temp: Float?) {
                  if (temp == null || temp < 42f || !prefs.getBoolean("heat", true)) return
                  val now = SystemClock.elapsedRealtime()
                  if (now - lastHeat < 90_000) return
                  lastHeat = now
                  ui.post { toast("Suhu HP %.0f°C. Istirahatkan sebentar atau turunkan grafis.".format(temp)) }
              }

              private fun applyStats(s: Stats) {
                  hudTexts["cpu"]?.text = s.cpuGhz?.let { "%.2fGHz".format(it) } ?: "-"
                  hudTexts["gpu"]?.text = s.gpuPct?.let { "$it%" } ?: "-"
                  hudTexts["ram"]?.text = "${s.ramPct}%"
                  hudTexts["bat"]?.text = "${s.batPct}%"
                  hudTexts["temp"]?.text = s.tempC?.let { "%.0fC".format(it) } ?: "-"
                  hudTexts["fps"]?.text = s.fps?.toString() ?: "-"
                  cpuMeter?.value = s.cpuPct ?: s.ramPct
                  ramMeter?.value = s.ramPct
                  clockView?.text = SimpleDateFormat("HH:mm", Locale.getDefault()).format(Date()) + "  " + s.batPct + "%"
              }
          }
