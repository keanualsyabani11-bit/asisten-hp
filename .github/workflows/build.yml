              private fun musicController(): MediaController? = runCatching {
                  val msm = getSystemService(Context.MEDIA_SESSION_SERVICE) as MediaSessionManager
                  val list = msm.getActiveSessions(ComponentName(this, MiniNotifService::class.java))
                  list.firstOrNull { it.playbackState?.state == PlaybackState.STATE_PLAYING } ?: list.firstOrNull()
              }.getOrNull()

              private fun mediaAction(kind: Int) {
                  val c = musicController()
                  if (c != null) {
                      when (kind) {
                          0 -> c.transportControls.skipToPrevious()
                          2 -> c.transportControls.skipToNext()
                          else -> if (c.playbackState?.state == PlaybackState.STATE_PLAYING) c.transportControls.pause()
                          else c.transportControls.play()
                      }
                  } else {
                      val code = when (kind) {
                          0 -> KeyEvent.KEYCODE_MEDIA_PREVIOUS
                          2 -> KeyEvent.KEYCODE_MEDIA_NEXT
                          else -> KeyEvent.KEYCODE_MEDIA_PLAY_PAUSE
                      }
                      val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                      am.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_DOWN, code))
                      am.dispatchMediaKeyEvent(KeyEvent(KeyEvent.ACTION_UP, code))
                  }
                  ui.postDelayed({ Thread { refreshMusic() }.start() }, 500)
              }

              /** Aman dipanggil dari thread mana pun; pembaruan tampilan dikirim ke thread utama. */
              private fun refreshMusic() {
                  val c = musicController()
                  val title = c?.metadata?.getString(MediaMetadata.METADATA_KEY_TITLE)
                  val artist = c?.metadata?.getString(MediaMetadata.METADATA_KEY_ARTIST)
                  val playing = c?.playbackState?.state == PlaybackState.STATE_PLAYING
                  val text = when {
                      c == null -> if (hasNotifListener(this)) "Tidak ada musik aktif" else "Aktifkan akses notifikasi untuk judul lagu"
                      title != null -> if (artist != null) "$title - $artist" else title
                      else -> "Sedang diputar"
                  }
                  ui.post {
                      musicTitle?.text = text
                      playIcon?.setImageResource(if (playing) R.drawable.ic_pause else R.drawable.ic_play)
                  }
              }

