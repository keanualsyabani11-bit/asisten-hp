name: Build Lynxora AI
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Buat proyek
        run: |
          mkdir -p $(dirname settings.gradle.kts)
          cat > settings.gradle.kts <<'__END_0__'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "LynxoraAI"
          include(":app")
          __END_0__
          mkdir -p $(dirname build.gradle.kts)
          cat > build.gradle.kts <<'__END_1__'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          __END_1__
          mkdir -p $(dirname gradle.properties)
          cat > gradle.properties <<'__END_2__'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          __END_2__
          mkdir -p $(dirname app/build.gradle.kts)
          cat > app/build.gradle.kts <<'__END_3__'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.asisten.hp"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.asisten.hp"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          __END_3__
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml <<'__END_4__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="com.android.alarm.permission.SET_ALARM" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
                  <intent>
                      <action android:name="android.speech.RecognitionService" />
                  </intent>
                  <intent>
                      <action android:name="android.intent.action.TTS_SERVICE" />
                  </intent>
              </queries>
              <application
                  android:label="Lynxora AI"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse|microphone">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="overlay assistant" />
                  </service>
                  <service
                      android:name=".AsistenAccessibilityService"
                      android:exported="true"
                      android:label="Lynxora AI"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          __END_4__
          mkdir -p $(dirname app/src/main/res/xml/accessibility_config.xml)
          cat > app/src/main/res/xml/accessibility_config.xml <<'__END_5__'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews"
              android:canRetrieveWindowContent="true"
              android:description="@string/acc_desc"
              android:notificationTimeout="100" />
          __END_5__
          mkdir -p $(dirname app/src/main/res/values/strings.xml)
          cat > app/src/main/res/values/strings.xml <<'__END_6__'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Lynxora AI</string>
              <string name="acc_desc">Lynxora AI memakai layanan ini untuk mengetik, menekan tombol, dan scroll di aplikasi lain sesuai perintahmu.</string>
          </resources>
          __END_6__
          mkdir -p $(dirname app/src/main/java/com/asisten/hp/MainActivity.kt)
          cat > app/src/main/java/com/asisten/hp/MainActivity.kt <<'__END_7__'
          package com.asisten.hp

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.view.Gravity
          import android.view.ViewGroup
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {
              private val cBg = "#0D0B12"
              private val cSurface = "#16131E"
              private val cText = "#ECE9F4"
              private val cMuted = "#8D869F"
              private val cAccent = "#6D3FE0"
              private val cOk = "#5FD0A0"
              private val cWarn = "#E5A93D"

              private val WRAP = ViewGroup.LayoutParams.WRAP_CONTENT
              private val MATCH = ViewGroup.LayoutParams.MATCH_PARENT

              private lateinit var stAks: TextView
              private lateinit var stOver: TextView
              private lateinit var stIzin: TextView

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun rounded(fill: String, r: Int): GradientDrawable =
                  GradientDrawable().apply {
                      setColor(Color.parseColor(fill))
                      cornerRadius = dp(r).toFloat()
                  }

              private fun tv(t: String, size: Float, color: String, medium: Boolean): TextView =
                  TextView(this).apply {
                      text = t
                      textSize = size
                      setTextColor(Color.parseColor(color))
                      if (medium) typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                  }

              private fun lp(top: Int): LinearLayout.LayoutParams {
                  val p = LinearLayout.LayoutParams(MATCH, WRAP)
                  p.topMargin = dp(top)
                  return p
              }

              private fun row(judul: String, desc: String, status: TextView, aksi: String, onClick: () -> Unit): LinearLayout {
                  val kiri = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      layoutParams = LinearLayout.LayoutParams(0, WRAP, 1f)
                      addView(tv(judul, 15f, cText, true))
                      addView(tv(desc, 12f, cMuted, false), lp(2))
                      addView(status, lp(6))
                  }
                  val btn = tv(aksi, 13f, "#B79CFF", true).apply {
                      gravity = Gravity.CENTER
                      background = rounded("#251F36", 10)
                      setPadding(dp(16), dp(9), dp(16), dp(9))
                      setOnClickListener { onClick() }
                  }
                  return LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      background = rounded(cSurface, 14)
                      setPadding(dp(14), dp(14), dp(14), dp(14))
                      addView(kiri)
                      addView(btn)
                  }
              }

              private fun section(t: String): TextView =
                  tv(t, 11f, cMuted, true).apply { letterSpacing = 0.1f }

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.statusBarColor = Color.parseColor(cBg)
                  window.navigationBarColor = Color.parseColor(cBg)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(52), dp(20), dp(32))
                  }

                  root.addView(ImageView(this).apply {
                      setImageResource(R.drawable.logo)
                      layoutParams = LinearLayout.LayoutParams(dp(64), dp(64))
                  })
                  root.addView(tv("Lynxora AI", 26f, cText, true), lp(14))
                  root.addView(tv("Asisten untuk HP-mu. Perintahkan lewat teks atau suara.", 14f, cMuted, false), lp(4))

                  root.addView(section("PENGATURAN AWAL"), lp(28))
                  stAks = tv("", 12f, cMuted, true)
                  stOver = tv("", 12f, cMuted, true)
                  stIzin = tv("", 12f, cMuted, true)
                  root.addView(
                      row("Aksesibilitas", "Untuk mengetik, tap, dan scroll di aplikasi lain", stAks, "Atur") {
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                      }, lp(10)
                  )
                  root.addView(
                      row("Tampil di atas aplikasi lain", "Untuk ikon Lynxora yang melayang", stOver, "Atur") {
                          startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                      }, lp(8)
                  )
                  root.addView(
                      row("Mikrofon & notifikasi", "Untuk perintah suara dan status layanan", stIzin, "Izinkan") {
                          val p = mutableListOf(Manifest.permission.RECORD_AUDIO)
                          if (Build.VERSION.SDK_INT >= 33) p.add(Manifest.permission.POST_NOTIFICATIONS)
                          requestPermissions(p.toTypedArray(), 1)
                      }, lp(8)
                  )

                  val mulai = tv("Mulai Lynxora", 15f, "#FFFFFF", true).apply {
                      gravity = Gravity.CENTER
                      background = rounded(cAccent, 14)
                      setPadding(0, dp(16), 0, dp(16))
                      setOnClickListener {
                          if (!Settings.canDrawOverlays(this@MainActivity)) {
                              Toast.makeText(this@MainActivity, "Izinkan tampil di atas aplikasi lain dulu", Toast.LENGTH_LONG).show()
                          } else {
                              stopService(Intent(this@MainActivity, OverlayService::class.java))
                              startForegroundService(Intent(this@MainActivity, OverlayService::class.java))
                              Toast.makeText(this@MainActivity, "Lynxora aktif. Ketuk ikonnya untuk memulai.", Toast.LENGTH_SHORT).show()
                              moveTaskToBack(true)
                          }
                      }
                  }
                  root.addView(mulai, lp(22))

                  val henti = tv("Hentikan", 14f, cMuted, true).apply {
                      gravity = Gravity.CENTER
                      setPadding(0, dp(14), 0, dp(14))
                      setOnClickListener { stopService(Intent(this@MainActivity, OverlayService::class.java)) }
                  }
                  root.addView(henti, lp(4))

                  root.addView(section("CONTOH PERINTAH"), lp(20))
                  val contoh = tv(
                      "buka wa\nbuka ml\ncari resep nasi goreng\nsenter nyala\nalarm jam 6.30\n" +
                          "timer 5 menit\nhitung 12*5\nkirim wa 0812xxxx halo\nbantuan",
                      13f, "#B9B3CC", false
                  ).apply {
                      typeface = Typeface.MONOSPACE
                      setLineSpacing(0f, 1.25f)
                      background = rounded(cSurface, 14)
                      setPadding(dp(16), dp(14), dp(16), dp(14))
                  }
                  root.addView(contoh, lp(10))

                  setContentView(ScrollView(this).apply {
                      setBackgroundColor(Color.parseColor(cBg))
                      addView(root)
                  })
              }

              override fun onResume() {
                  super.onResume()
                  refresh()
              }

              override fun onRequestPermissionsResult(requestCode: Int, permissions: Array<out String>, grantResults: IntArray) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  refresh()
              }

              private fun setSt(t: TextView, aktif: Boolean, on: String, off: String) {
                  t.text = if (aktif) on else off
                  t.setTextColor(Color.parseColor(if (aktif) cOk else cWarn))
              }

              private fun refresh() {
                  setSt(stAks, AsistenAccessibilityService.instance != null, "Aktif", "Belum aktif")
                  setSt(stOver, Settings.canDrawOverlays(this), "Diizinkan", "Belum diizinkan")
                  val mic = checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED
                  val notif = Build.VERSION.SDK_INT < 33 ||
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) == PackageManager.PERMISSION_GRANTED
                  setSt(stIzin, mic && notif, "Diizinkan", "Belum diizinkan")
              }
          }
          __END_7__
          mkdir -p $(dirname app/src/main/java/com/asisten/hp/OverlayService.kt)
          cat > app/src/main/java/com/asisten/hp/OverlayService.kt <<'__END_8__'
          package com.asisten.hp

          import android.Manifest
          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.content.pm.ServiceInfo
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.speech.tts.TextToSpeech
          import android.text.InputType
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.ViewGroup
          import android.view.WindowManager
          import android.view.inputmethod.EditorInfo
          import android.view.inputmethod.InputMethodManager
          import android.widget.EditText
          import android.widget.HorizontalScrollView
          import android.widget.ImageView
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import java.util.Locale
          import kotlin.math.abs

          class OverlayService : Service() {
              private lateinit var wm: WindowManager
              private lateinit var imm: InputMethodManager
              private lateinit var orbLp: WindowManager.LayoutParams
              private lateinit var panelLp: WindowManager.LayoutParams
              private lateinit var orb: ImageView
              private lateinit var panel: LinearLayout
              private lateinit var log: LinearLayout
              private lateinit var scroll: ScrollView
              private lateinit var input: EditText
              private lateinit var status: TextView
              private lateinit var dotBg: GradientDrawable

              private val h = Handler(Looper.getMainLooper())
              private var tts: TextToSpeech? = null
              private var ttsReady = false
              private var recognizer: SpeechRecognizer? = null
              private var expanded = false
              private var greeted = false

              private val WRAP = ViewGroup.LayoutParams.WRAP_CONTENT
              private val MATCH = ViewGroup.LayoutParams.MATCH_PARENT
              private val noFocus = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                  WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or
                  WindowManager.LayoutParams.FLAG_WATCH_OUTSIDE_TOUCH
              private val withFocus = WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or
                  WindowManager.LayoutParams.FLAG_WATCH_OUTSIDE_TOUCH

              private val cPanel = "#121019"
              private val cField = "#1B1826"
              private val cText = "#ECE9F4"
              private val cMuted = "#8D869F"
              private val cAccent = "#5B34C9"
              private val cOk = "#5FD0A0"
              private val cWarn = "#E5A93D"
              private val cInfo = "#A78BFA"

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int = START_NOT_STICKY

              override fun onCreate() {
                  super.onCreate()
                  startFg()
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  imm = getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager
                  tts = TextToSpeech(this) { st ->
                      if (st == TextToSpeech.SUCCESS) {
                          tts?.setLanguage(Locale("id", "ID"))
                          ttsReady = true
                      }
                  }
                  buildOrb()
                  buildPanel()
                  try {
                      wm.addView(orb, orbLp)
                  } catch (e: Exception) {
                      stopSelf()
                  }
              }

              override fun onDestroy() {
                  recognizer?.destroy()
                  tts?.shutdown()
                  try { wm.removeView(orb) } catch (e: Exception) {}
                  try { wm.removeView(panel) } catch (e: Exception) {}
                  super.onDestroy()
              }

              private fun startFg() {
                  val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(
                      NotificationChannel("lynxora", "Lynxora AI", NotificationManager.IMPORTANCE_LOW)
                  )
                  val n: Notification = Notification.Builder(this, "lynxora")
                      .setContentTitle("Lynxora AI aktif")
                      .setContentText("Ketuk ikon yang melayang untuk membuka")
                      .setSmallIcon(R.drawable.ic_notif)
                      .build()
                  val mic = checkSelfPermission(Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED
                  if (Build.VERSION.SDK_INT >= 34) {
                      var t = ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE
                      if (mic) t = t or ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE
                      startForeground(1, n, t)
                  } else if (Build.VERSION.SDK_INT >= 30 && mic) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE)
                  } else if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(1, n, 0)
                  } else {
                      startForeground(1, n)
                  }
              }

              // ---------- helper tampilan ----------

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun shape(fill: String, r: Int): GradientDrawable =
                  GradientDrawable().apply {
                      setColor(Color.parseColor(fill))
                      cornerRadius = dp(r).toFloat()
                  }

              private fun icon(res: Int, tint: String, pad: Int): ImageView =
                  ImageView(this).apply {
                      setImageResource(res)
                      setColorFilter(Color.parseColor(tint))
                      setPadding(dp(pad), dp(pad), dp(pad), dp(pad))
                  }

              private fun draggable(v: View, lp: WindowManager.LayoutParams, target: View, onTap: (() -> Unit)? = null) {
                  var sx = 0
                  var sy = 0
                  var tx = 0f
                  var ty = 0f
                  var moved = false
                  v.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              sx = lp.x; sy = lp.y; tx = e.rawX; ty = e.rawY; moved = false
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (e.rawX - tx).toInt()
                              val dy = (e.rawY - ty).toInt()
                              if (abs(dx) > dp(5) || abs(dy) > dp(5)) moved = true
                              if (moved) {
                                  lp.x = sx + dx
                                  lp.y = sy + dy
                                  try { wm.updateViewLayout(target, lp) } catch (ex: Exception) {}
                              }
                          }
                          MotionEvent.ACTION_UP -> {
                              if (!moved) onTap?.invoke()
                          }
                      }
                      true
                  }
              }

              private fun buildOrb() {
                  orb = ImageView(this).apply {
                      setImageResource(R.drawable.logo)
                      scaleType = ImageView.ScaleType.FIT_CENTER
                  }
                  orbLp = WindowManager.LayoutParams(
                      dp(52), dp(52),
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = dp(12)
                      y = dp(160)
                  }
                  draggable(orb, orbLp, orb) { expand() }
              }

              private fun buildPanel() {
                  val avatar = ImageView(this).apply {
                      setImageResource(R.drawable.logo)
                      layoutParams = LinearLayout.LayoutParams(dp(34), dp(34))
                  }
                  val title = TextView(this).apply {
                      text = "Lynxora AI"
                      setTextColor(Color.parseColor(cText))
                      textSize = 15f
                      typeface = Typeface.create("sans-serif-medium", Typeface.NORMAL)
                  }
                  dotBg = GradientDrawable().apply {
                      setShape(GradientDrawable.OVAL)
                      setColor(Color.parseColor(cOk))
                  }
                  val dot = View(this).apply {
                      background = dotBg
                      val dl = LinearLayout.LayoutParams(dp(7), dp(7))
                      dl.rightMargin = dp(6)
                      layoutParams = dl
                  }
                  status = TextView(this).apply {
                      textSize = 11f
                      setTextColor(Color.parseColor(cMuted))
                  }
                  val statusRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      addView(dot)
                      addView(status)
                  }
                  val names = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(10), 0, 0, 0)
                      addView(title)
                      addView(statusRow)
                      layoutParams = LinearLayout.LayoutParams(0, WRAP, 1f)
                  }
                  val minim = icon(R.drawable.ic_down, "#8D869F", 7).apply {
                      layoutParams = LinearLayout.LayoutParams(dp(34), dp(34))
                      setOnClickListener { collapse() }
                  }
                  val tutup = icon(R.drawable.ic_close, "#8D869F", 9).apply {
                      layoutParams = LinearLayout.LayoutParams(dp(34), dp(34))
                      setOnClickListener { stopSelf() }
                  }
                  val header = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      addView(avatar)
                      addView(names)
                      addView(minim)
                      addView(tutup)
                  }
                  val divider = View(this).apply {
                      setBackgroundColor(Color.parseColor("#241F30"))
                  }

                  log = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(0, dp(4), 0, dp(4))
                  }
                  scroll = ScrollView(this).apply {
                      isVerticalScrollBarEnabled = false
                      addView(log)
                  }

                  val chipRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(0, dp(6), 0, dp(10))
                  }
                  val daftar = listOf("Buka WA", "Buka ML", "Senter", "Screenshot", "Bantuan")
                  for (c in daftar) {
                      val chip = TextView(this).apply {
                          text = c
                          setTextColor(Color.parseColor("#B9B3CC"))
                          textSize = 12f
                          setPadding(dp(12), dp(7), dp(12), dp(7))
                          background = shape(cField, 8)
                          setOnClickListener { kirim(c, false) }
                      }
                      val clp = LinearLayout.LayoutParams(WRAP, WRAP)
                      clp.rightMargin = dp(6)
                      chipRow.addView(chip, clp)
                  }
                  val chips = HorizontalScrollView(this).apply {
                      isHorizontalScrollBarEnabled = false
                      addView(chipRow)
                  }

                  input = EditText(this).apply {
                      hint = "Tulis perintah"
                      setHintTextColor(Color.parseColor("#6B647C"))
                      setTextColor(Color.parseColor(cText))
                      textSize = 14f
                      inputType = InputType.TYPE_CLASS_TEXT
                      setSingleLine()
                      imeOptions = EditorInfo.IME_ACTION_SEND
                      background = shape(cField, 12)
                      setPadding(dp(14), dp(10), dp(14), dp(10))
                      layoutParams = LinearLayout.LayoutParams(0, WRAP, 1f)
                  }
                  val mic = icon(R.drawable.ic_mic, "#B9B3CC", 10).apply {
                      background = shape(cField, 12)
                      setOnClickListener { dengar() }
                  }
                  val kirimBtn = icon(R.drawable.ic_send, "#FFFFFF", 10).apply {
                      background = shape(cAccent, 12)
                      setOnClickListener { kirim(input.text.toString(), false) }
                  }
                  val inputRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      addView(input)
                      val l1 = LinearLayout.LayoutParams(dp(42), dp(42))
                      l1.leftMargin = dp(6)
                      addView(mic, l1)
                      val l2 = LinearLayout.LayoutParams(dp(42), dp(42))
                      l2.leftMargin = dp(6)
                      addView(kirimBtn, l2)
                  }

                  panel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      background = shape(cPanel, 20)
