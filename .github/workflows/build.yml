                      )
                      Column(
                          Modifier
                              .align(Alignment.BottomCenter)
                              .fillMaxWidth()
                              .clip(RoundedCornerShape(topStart = 22.dp, topEnd = 22.dp))
                              .background(CARD)
                              .border(1.dp, LINE, RoundedCornerShape(topStart = 22.dp, topEnd = 22.dp))
