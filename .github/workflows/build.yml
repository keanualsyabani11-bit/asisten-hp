                  }
                  fun padRow(a: View?, b: View?, c: View?) {
                      val r = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                      for (v in listOf(a, b, c)) {
                          r.addView(v ?: View(this), LinearLayout.LayoutParams(dp(38), dp(38)).apply { setMargins(dp(2), dp(2), dp(2), dp(2)) })
