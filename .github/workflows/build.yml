          package com.example.lynxboster

          import android.app.Notification
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification

          /**
           * Meneruskan notifikasi masuk ke banner mini di atas game.
           * Teks notifikasi hanya ditampilkan sesaat dan tidak disimpan atau dikirim ke mana pun.
           */
          class MiniNotifService : NotificationListenerService() {

              override fun onNotificationPosted(sbn: StatusBarNotification) {
                  val prefs = getSharedPreferences("lx", MODE_PRIVATE)
                  if (!prefs.getBoolean("banner", false)) return
                  if (sbn.packageName == packageName) return
                  val n = sbn.notification ?: return
                  if (sbn.isOngoing || (n.flags and Notification.FLAG_GROUP_SUMMARY) != 0) return

                  if (!prefs.getBoolean("banner_all", false)) {
                      val cat = n.category
                      val allowed = cat == Notification.CATEGORY_MESSAGE ||
                          cat == Notification.CATEGORY_CALL ||
                          cat == Notification.CATEGORY_SOCIAL ||
                          cat == Notification.CATEGORY_EMAIL
                      if (!allowed) return
                  }

                  val extras = n.extras
                  val title = extras.getCharSequence(Notification.EXTRA_TITLE)?.toString() ?: return
                  val text = extras.getCharSequence(Notification.EXTRA_TEXT)?.toString() ?: ""
                  val label = runCatching {
                      packageManager.getApplicationLabel(packageManager.getApplicationInfo(sbn.packageName, 0)).toString()
                  }.getOrDefault(sbn.packageName)

                  OverlayService.instance?.showBanner(label, title, text)
              }
          }
