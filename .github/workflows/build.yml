          class OverlayService : Service() {

              companion object {
                  @Volatile var isRunning = false
                  @Volatile var auto = false
                  @Volatile var instance: OverlayService? = null
              }

              private lateinit var wm: WindowManager
              private lateinit var prefs: SharedPreferences
              private val ui = Handler(Looper.getMainLooper())

              private var handleView: View? = null
              private var panelView: View? = null
              private var hudView: LinearLayout? = null
              private var clockView: TextView? = null
              private var timerView: TextView? = null
              private var modeChip: TextView? = null
              private var musicTitle: TextView? = null
              private var playIcon: ImageView? = null
              private var cpuMeter: MeterView? = null
              private var ramMeter: MeterView? = null
              private var bannerView: View? = null
              private var monitorWin: View? = null
              private var xhWin: View? = null
              private var xhairView: View? = null
              private var xhairParams: WindowManager.LayoutParams? = null
              private val toolBoxes = mutableMapOf<String, LinearLayout>()
              private val hudTexts = mutableMapOf<String, TextView>()
              private val shapeViews = mutableListOf<View>()
              private val swatchViews = mutableListOf<View>()

              @Volatile private var running = false
              @Volatile private var panelOpen = false
              @Volatile private var hudOn = false
              @Volatile private var autoMode = false
              @Volatile private var sessionActive = false
              @Volatile private var overlaysVisible = true
              private var currentGame: String? = null
              private var prevDnd: Int? = null
              private var outCount = 0
              private var dragMode = false
              private var startMs = 0L
              private var lastHeat = 0L

              // crosshair: 0 mati, 1 titik, 2 plus berjarak, 3 lingkaran, 4 plus penuh
              private var xhStyle = 0
              private var xhColor = 0
              private var xhSize = 1
              private val xhColors = intArrayOf(
                  0xFFFF3B30.toInt(), 0xFF34C759.toInt(), 0xFFFFFFFF.toInt(), 0xFF00E5FF.toInt(), 0xFFFFD60A.toInt()
              )
              private val xhSizesDp = intArrayOf(28, 40, 56)

              private val accent = 0xFF2F8BFF.toInt()
              private val dim = 0xFF9AA7BD.toInt()
              private val touchable = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL
              private val untouchable = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE

              private val prefsListener = SharedPreferences.OnSharedPreferenceChangeListener { _, key ->
                  when {
                      key == null -> {}
                      key == "hud_on" -> ui.post { syncHud() }
                      key.startsWith("hud_") -> ui.post { rebuildHud() }
                  }
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onCreate() {
                  super.onCreate()
                  wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  prefs = getSharedPreferences("lx", Context.MODE_PRIVATE)
                  xhStyle = prefs.getInt("xh_style", 0)
                  xhColor = prefs.getInt("xh_color", 0)
                  xhSize = prefs.getInt("xh_size", 1)
                  startMs = SystemClock.elapsedRealtime()
                  prefs.registerOnSharedPreferenceChangeListener(prefsListener)
                  isRunning = true
                  instance = this
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  startAsForeground()
                  val wantAuto = intent?.getBooleanExtra("auto", false) ?: false
                  autoMode = wantAuto
                  auto = wantAuto
                  if (handleView == null) {
                      overlaysVisible = !wantAuto
                      hudOn = prefs.getBoolean("hud_on", false)
                      addHandle()
                      applyCrosshair()
                      if (hudOn) addHud()
                      startPolling()
                      ui.post(tick)
                      if (!wantAuto) onSessionStart(null) else setOverlaysVisible(false)
                  } else {
                      if (!wantAuto) {
                          setOverlaysVisible(true)
                          onSessionStart(currentGame)
                      } else if (!sessionActive) {
                          setOverlaysVisible(false)
                      }
                  }
                  return START_NOT_STICKY
              }

              override fun onDestroy() {
                  onSessionEnd()
                  isRunning = false
                  auto = false
                  instance = null
                  running = false
                  prefs.unregisterOnSharedPreferenceChangeListener(prefsListener)
                  ui.removeCallbacksAndMessages(null)
                  closePanel()
                  closeMonitorWindow()
                  closeCrosshairWindow()
                  removeHud()
                  removeCrosshair()
                  bannerView?.let { runCatching { wm.removeView(it) } }
                  bannerView = null
                  handleView?.let { runCatching { wm.removeView(it) } }
                  handleView = null
                  super.onDestroy()
              }

              private fun startAsForeground() {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("lynx", "Lynx Boster", NotificationManager.IMPORTANCE_LOW))
                  val n = Notification.Builder(this, "lynx")
                      .setContentTitle("Lynx Boster aktif")
                      .setContentText(if (autoMode) "Menunggu game dibuka" else "Panel melayang berjalan")
                      .setSmallIcon(R.drawable.ic_bolt)
                      .setOngoing(true)
                      .build()
                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  } else {
                      startForeground(1, n)
                  }
              }

              // ---------- helper ----------

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun lp(w: Int, h: Int, flags: Int) = WindowManager.LayoutParams(
                  w, h, WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY, flags, PixelFormat.TRANSLUCENT
              )

              private fun rounded(color: Int, r: Int, stroke: Int? = null) = GradientDrawable().apply {
                  setColor(color)
                  cornerRadius = dp(r).toFloat()
                  if (stroke != null) setStroke(dp(1), stroke)
              }

              private fun toast(msg: String) = Toast.makeText(this, msg, Toast.LENGTH_SHORT).show()

              private fun icon(res: Int, sizeDp: Int, tint: Int = Color.WHITE) = ImageView(this).apply {
                  setImageResource(res)
                  setColorFilter(tint)
                  layoutParams = LinearLayout.LayoutParams(dp(sizeDp), dp(sizeDp))
              }

              private fun presetColor(i: Int) = when (i) {
                  0 -> 0xFF34C759.toInt()
                  2 -> 0xFFFF453A.toInt()
                  else -> accent
              }

              private fun currentPreset() = prefs.getInt("preset", 1).coerceIn(0, PRESETS.size - 1)

              private fun ensureWrite(): Boolean {
                  if (Settings.System.canWrite(this)) return true
                  toast("Izinkan Write Settings dulu")
                  openWriteSettings(this)
                  closePanel()
                  return false
              }

              // ---------- sesi (mulai dan selesai bermain) ----------

              private fun setOverlaysVisible(v: Boolean) {
                  overlaysVisible = v
                  val vis = if (v) View.VISIBLE else View.GONE
                  handleView?.visibility = vis
                  xhairView?.visibility = vis
                  hudView?.visibility = vis
                  if (!v) {
                      closePanel()
                      closeMonitorWindow()
                      closeCrosshairWindow()
                  }
              }

              private fun onSessionStart(game: String?) {
                  if (sessionActive) return
                  sessionActive = true
                  currentGame = game ?: prefs.getString("last_game", null)
                  startMs = SystemClock.elapsedRealtime()
                  outCount = 0
                  setOverlaysVisible(true)

                  val preset = PRESETS[currentPreset()]
                  if (preset.dnd && prefs.getBoolean("auto_dnd", true)) {
                      val prev = enableDndQuiet(this)
                      if (prev == null) toast("Izin Jangan Ganggu belum aktif, buka Profil > Izin") else prevDnd = prev
                  }
                  if (preset.hud && !hudOn) {
                      hudOn = true
                      addHud()
                  }
                  if (preset.boost) runBoost()
                  if (preset.adv) runAdvanced(currentGame, false)
              }

              private fun onSessionEnd() {
                  if (!sessionActive) return
                  sessionActive = false
                  prevDnd?.let { runCatching { restoreDnd(this, it) } }
                  prevDnd = null
                  val game = currentGame
                  currentGame = null
                  val ctx = applicationContext
                  Thread { runCatching { if (Adv.ready()) Adv.restoreAll(ctx, game) } }.start()
                  if (autoMode) setOverlaysVisible(false)
              }

              private fun runAdvanced(game: String?, announce: Boolean) {
                  val ctx = applicationContext
                  Thread {
                      if (!Adv.ready()) {
                          if (announce) ui.post { toast("Shizuku belum siap. Buka Labs, bagian Mode Lanjutan") }
                          return@Thread
                      }
                      val n = runCatching { Adv.boostAll(ctx, game) }.getOrDefault(0)
                      val hz = Adv.maxHz(ctx)
                      ui.post { toast("Boost lanjutan: $n aplikasi ditutup, refresh rate $hz Hz") }
                  }.start()
              }

              private fun runBoost() {
                  toast("Quick Boost berjalan...")
                  val ctx = applicationContext
                  Thread {
                      val (before, after) = runCatching { quickBoost(ctx) }.getOrDefault(0 to 0)
                      ui.post { toast("RAM terpakai: $before% menjadi $after%") }
                  }.start()
              }

              // ---------- tombol melayang (bisa digeser, posisi disimpan) ----------

              private fun addHandle() {
                  val size = dp(44)
                  val iv = ImageView(this).apply {
                      setImageResource(R.drawable.ic_fg)
                      scaleType = ImageView.ScaleType.CENTER_CROP
                      background = rounded(0xFF05070D.toInt(), 12, accent)
                      clipToOutline = true
                      outlineProvider = ViewOutlineProvider.BACKGROUND
                      alpha = 0.92f
                      visibility = if (overlaysVisible) View.VISIBLE else View.GONE
                  }
                  val params = lp(size, size, touchable).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = prefs.getInt("h_x", dp(16))
                      y = prefs.getInt("h_y", dp(40))
                  }
                  var sx = 0f
                  var sy = 0f
                  var ox = 0
                  var oy = 0
                  var moved = false
                  iv.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> {
                              sx = e.rawX; sy = e.rawY; ox = params.x; oy = params.y; moved = false
                              true
                          }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = (e.rawX - sx).toInt()
                              val dy = (e.rawY - sy).toInt()
                              if (abs(dx) > dp(6) || abs(dy) > dp(6)) moved = true
                              if (moved) {
                                  params.x = ox + dx
                                  params.y = oy + dy
                                  wm.updateViewLayout(iv, params)
                              }
                              true
                          }
                          MotionEvent.ACTION_UP -> {
                              if (moved) prefs.edit().putInt("h_x", params.x).putInt("h_y", params.y).apply()
                              else togglePanel()
                              true
                          }
                          else -> false
                      }
                  }
                  wm.addView(iv, params)
                  handleView = iv
              }

              // ---------- meter miring CPU dan RAM ----------

              private inner class MeterView(private val label: String, private val leftSide: Boolean) : View(this@OverlayService) {
                  var value = 0
                      set(v) {
                          field = v.coerceIn(0, 100)
                          invalidate()
                      }
                  var tint = accent
                      set(c) {
                          field = c
                          invalidate()
                      }
                  private val p = Paint(Paint.ANTI_ALIAS_FLAG)
                  private val path = Path()

                  override fun onDraw(c: Canvas) {
                      val n = 6
                      val gap = dp(3).toFloat()
                      val textH = dp(14).toFloat()
                      val barH = (height - textH - gap * (n - 1)) / n
                      val skew = dp(8).toFloat() * (if (leftSide) 1 else -1)
                      val x0 = dp(6).toFloat()
                      val x1 = width - dp(14).toFloat()
                      val lit = Math.round(value / 100f * n)
                      for (i in 0 until n) {
                          val bottom = height - textH - i * (barH + gap)
                          val top = bottom - barH
                          p.style = Paint.Style.FILL
                          p.color = if (i < lit) tint else 0x33FFFFFF
                          path.reset()
                          path.moveTo(x0 + skew, top)
                          path.lineTo(x1 + skew, top)
                          path.lineTo(x1, bottom)
                          path.lineTo(x0, bottom)
                          path.close()
                          c.drawPath(path, p)
                      }
                      p.color = tint
                      p.textSize = dp(10).toFloat()
                      p.textAlign = Paint.Align.CENTER
                      p.typeface = Typeface.DEFAULT_BOLD
                      c.drawText(label, width / 2f, height - dp(2).toFloat(), p)
                  }
              }

              // ---------- panel ----------

              private fun togglePanel() {
                  if (panelOpen) closePanel() else openPanel()
              }

              private fun openPanel() {
                  val dm = resources.displayMetrics
                  val p = buildPanel()
                  val w = min((dm.widthPixels * 0.92f).toInt(), dp(720))
                  val params = lp(w, ViewGroup.LayoutParams.WRAP_CONTENT, touchable).apply {
                      gravity = Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL
                      y = dp(8)
                  }
                  wm.addView(p, params)
                  panelView = p
                  panelOpen = true
                  refreshStates()
                  Thread { refreshMusic() }.start()
              }

              private fun closePanel() {
                  panelView?.let { runCatching { wm.removeView(it) } }
                  panelView = null
                  panelOpen = false
                  clockView = null
                  timerView = null
                  modeChip = null
                  musicTitle = null
                  playIcon = null
                  cpuMeter = null
                  ramMeter = null
                  toolBoxes.clear()
              }

              private fun grid(items: List<View>): LinearLayout {
                  val col = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  items.chunked(3).forEach { rowItems ->
                      val r = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }
                      rowItems.forEach { r.addView(it, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)) }
                      repeat(3 - rowItems.size) { r.addView(View(this), LinearLayout.LayoutParams(0, 1, 1f)) }
                      col.addView(r)
                  }
                  return col
              }

              private fun buildPanel(): View {
                  val dm = resources.displayMetrics
                  val compact = dm.widthPixels < dp(520)
                  val pc = presetColor(currentPreset())
                  val am = getSystemService(Context.AUDIO_SERVICE) as AudioManager
                  val briNow = Settings.System.getInt(contentResolver, Settings.System.SCREEN_BRIGHTNESS, 128)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(12), dp(10), dp(12), dp(10))
                  }

                  // baris atas: slider cahaya, slider volume, tombol tutup
                  val top = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                  }
                  top.addView(
                      sliderRow(R.drawable.ic_brightness, 255, briNow) { p ->
                          if (ensureWrite()) {
                              Settings.System.putInt(contentResolver, Settings.System.SCREEN_BRIGHTNESS_MODE, 0)
                              Settings.System.putInt(contentResolver, Settings.System.SCREEN_BRIGHTNESS, max(p, 10))
                          }
                      },
                      LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                  )
                  top.addView(
                      sliderRow(R.drawable.ic_volume, am.getStreamMaxVolume(AudioManager.STREAM_MUSIC), am.getStreamVolume(AudioManager.STREAM_MUSIC)) { p ->
                          am.setStreamVolume(AudioManager.STREAM_MUSIC, p, 0)
                      },
                      LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f)
                  )
                  top.addView(icon(R.drawable.ic_close, 22).apply {
                      (layoutParams as LinearLayout.LayoutParams).leftMargin = dp(4)
                      setOnClickListener { closePanel() }
                  })
                  root.addView(top)

                  val left = grid(
                      listOf(
                          tool("hud", R.drawable.ic_info, "Info Monitor") {
                              closePanel()
                              toggleMonitorWindow()
                          },
                          tool("dns", R.drawable.ic_wifi, "DNS Tuner") {
                              val on = !prefs.getBoolean("dns_on", false)
                              prefs.edit().putBoolean("dns_on", on).apply()
                              toast(if (on) "DNS Tuner aktif: koneksi dijaga tetap hangat" else "DNS Tuner mati")
                          },
                          tool("hz", R.drawable.ic_refresh, "Refresh Rate") {
                              toast("Layar saat ini ${refreshRateHz(this)} Hz")
                              openDisplaySettings(this)
                              closePanel()
                          },
                          tool("rot", R.drawable.ic_rotate, "Kunci Rotasi") {
                              if (ensureWrite()) {
                                  val locked = Settings.System.getInt(contentResolver, Settings.System.ACCELEROMETER_ROTATION, 1) == 0
                                  Settings.System.putInt(contentResolver, Settings.System.ACCELEROMETER_ROTATION, if (locked) 1 else 0)
                              }
                          },
                          tool("dnd", R.drawable.ic_moon, "Jangan Ganggu") {
                              val nm = getSystemService(NotificationManager::class.java)
                              if (nm.currentInterruptionFilter == NotificationManager.INTERRUPTION_FILTER_ALL) enableDnd(this) else disableDnd(this)
                          },
                          tool("bri", R.drawable.ic_brightness, "Kunci Cahaya") {
                              if (ensureWrite()) {
                                  val manual = Settings.System.getInt(contentResolver, Settings.System.SCREEN_BRIGHTNESS_MODE, 1) == 0
                                  Settings.System.putInt(contentResolver, Settings.System.SCREEN_BRIGHTNESS_MODE, if (manual) 1 else 0)
                              }
                          }
                      )
                  )
                  val right = grid(
                      listOf(
                          tool("xh", R.drawable.ic_crosshair, "Crosshair") {
                              closePanel()
                              toggleCrosshairWindow()
                          },
                          tool("boost", R.drawable.ic_speed, "Quick Boost") { runBoost() },
                          tool("adv", R.drawable.ic_bolt, "Boost Tuntas") { runAdvanced(currentGame, true) },
                          tool("shot", R.drawable.ic_camera, "Screenshot") { takeScreenshot() },
                          tool("rec", R.drawable.ic_record, "Rekam Layar") { toggleRecording() },
                      )
                  )
                  val center = buildCenter(pc)

                  if (compact) {
                      root.addView(center)
                      root.addView(left)
                      root.addView(right)
                  } else {
                      val body = LinearLayout(this).apply {
                          orientation = LinearLayout.HORIZONTAL
                          gravity = Gravity.CENTER_VERTICAL
                          setPadding(0, dp(6), 0, 0)
                      }
                      val cm = MeterView("CPU", true).also { it.tint = pc }
                      val rm = MeterView("RAM", false).also { it.tint = pc }
                      cpuMeter = cm
                      ramMeter = rm
                      body.addView(cm, LinearLayout.LayoutParams(dp(44), dp(120)))
                      body.addView(left, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1.5f))
                      body.addView(center, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1.4f))
                      body.addView(right, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1.5f))
                      body.addView(rm, LinearLayout.LayoutParams(dp(44), dp(120)))
                      root.addView(body)
                  }

                  return ScrollView(this).apply {
                      background = rounded(0xF005070D.toInt(), 18, pc)
                      isVerticalScrollBarEnabled = false
                      addView(root)
                  }
              }

              private fun buildCenter(pc: Int): LinearLayout {
                  val c = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER_HORIZONTAL
                      setPadding(dp(8), dp(4), dp(8), 0)
                  }
                  val chip = TextView(this).apply {
                      text = PRESETS[currentPreset()].name.uppercase()
                      textSize = 11f
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                      setTextColor(pc)
                      letterSpacing = 0.12f
                      setPadding(dp(16), dp(4), dp(16), dp(4))
                      background = rounded(0x22FFFFFF, 10, pc)
                      setOnClickListener { cyclePreset() }
                  }
                  modeChip = chip
                  c.addView(chip, LinearLayout.LayoutParams(ViewGroup.LayoutParams.WRAP_CONTENT, ViewGroup.LayoutParams.WRAP_CONTENT).apply {
                      bottomMargin = dp(4)
                  })
                  val clk = TextView(this).apply {
                      setTextColor(dim)
                      textSize = 11f
                      text = "--:--"
                  }
                  clockView = clk
                  c.addView(clk)
                  c.addView(TextView(this).apply {
                      text = "LYNX BOSTER"
                      textSize = 18f
                      typeface = Typeface.DEFAULT_BOLD
                      setTextColor(Color.WHITE)
                      letterSpacing = 0.06f
                      setPadding(0, dp(4), 0, 0)
                  })
                  c.addView(TextView(this).apply {
                      text = "GAME BOOSTER"
                      textSize = 9f
                      setTextColor(accent)
                      letterSpacing = 0.2f
                  })
                  val tm = TextView(this).apply {
                      setTextColor(dim)
                      textSize = 11f
                      text = "Sesi 00:00"
                      setPadding(0, dp(2), 0, dp(4))
                  }
                  timerView = tm
                  c.addView(tm)
                  c.addView(musicRow())
                  return c
              }

              private fun cyclePreset() {
                  val next = (currentPreset() + 1) % PRESETS.size
                  prefs.edit().putInt("preset", next).apply()
                  val col = presetColor(next)
                  modeChip?.apply {
                      text = PRESETS[next].name.uppercase()
                      setTextColor(col)
                      background = rounded(0x22FFFFFF, 10, col)
                  }
                  cpuMeter?.tint = col
                  ramMeter?.tint = col
                  toast("Mode ${PRESETS[next].name}: berlaku saat sesi berikutnya")
              }

              private fun tool(key: String, res: Int, label: String, action: () -> Unit): View {
                  val box = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      gravity = Gravity.CENTER
                      setPadding(dp(2), dp(7), dp(2), dp(7))
                      setOnClickListener {
                          action()
                          refreshStates()
                      }
                  }
                  box.addView(icon(res, 22, dim))
                  box.addView(TextView(this).apply {
                      text = label
                      textSize = 9.5f
                      gravity = Gravity.CENTER
                      setTextColor(dim)
                      maxLines = 1
                      setPadding(0, dp(3), 0, 0)
                  })
                  toolBoxes[key] = box
                  return box
              }

              private fun setActive(key: String, active: Boolean) {
                  val box = toolBoxes[key] ?: return
                  box.background = if (active) rounded(0x332F8BFF, 12, accent) else null
                  val c = if (active) accent else dim
                  (box.getChildAt(0) as ImageView).setColorFilter(c)
                  (box.getChildAt(1) as TextView).setTextColor(c)
              }

              private fun refreshStates() {
                  val nm = getSystemService(NotificationManager::class.java)
                  val f = nm.currentInterruptionFilter
                  setActive("hud", hudOn)
                  setActive("dns", prefs.getBoolean("dns_on", false))
                  setActive("dnd", f != NotificationManager.INTERRUPTION_FILTER_ALL && f != NotificationManager.INTERRUPTION_FILTER_UNKNOWN)
                  setActive("rot", Settings.System.getInt(contentResolver, Settings.System.ACCELEROMETER_ROTATION, 1) == 0)
                  setActive("bri", Settings.System.getInt(contentResolver, Settings.System.SCREEN_BRIGHTNESS_MODE, 1) == 0)
                  setActive("xh", xhStyle != 0)
                  setActive("rec", RecorderService.isRecording)
              }

              private fun sliderRow(res: Int, maxValue: Int, progressValue: Int, onChange: (Int) -> Unit): View {
                  val r = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      setPadding(0, dp(2), dp(10), 0)
                  }
                  r.addView(icon(res, 18, dim))
                  val sb = SeekBar(this).apply {
                      this.max = maxValue
                      this.progress = progressValue
                      progressTintList = ColorStateList.valueOf(accent)
                      thumbTintList = ColorStateList.valueOf(accent)
                      setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                          override fun onProgressChanged(s: SeekBar?, p: Int, fromUser: Boolean) {
                              if (fromUser) onChange(p)
                          }
                          override fun onStartTrackingTouch(s: SeekBar?) {}
                          override fun onStopTrackingTouch(s: SeekBar?) {}
                      })
                  }
                  r.addView(sb, LinearLayout.LayoutParams(0, ViewGroup.LayoutParams.WRAP_CONTENT, 1f))
                  return r
              }

              private fun takeScreenshot() {
                  val svc = BoosterAccessibilityService.instance
                  if (svc == null) {
                      toast("Aktifkan layanan aksesibilitas Lynx Boster dulu")
                      openAccessibility(this)
                      closePanel()
                  } else {
                      closePanel()
                      ui.postDelayed({
                          svc.performGlobalAction(android.accessibilityservice.AccessibilityService.GLOBAL_ACTION_TAKE_SCREENSHOT)
                      }, 350)
                  }
              }

