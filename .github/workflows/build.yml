                  }
                  if (isRecording) return START_NOT_STICKY

                  startAsForeground()
                  val code = intent?.getIntExtra("code", 0) ?: 0
                  @Suppress("DEPRECATION")
                  val data = intent?.getParcelableExtra<Intent>("data")
                  if (data == null) {
                      stopSelf()
                      return START_NOT_STICKY
                  }
                  val result = runCatching { startRecording(code, data) }
                  if (result.isFailure) {
                      Toast.makeText(this, "Perekaman gagal dimulai", Toast.LENGTH_LONG).show()
                      stopRecording()
                      stopSelf()
                  }
                  return START_NOT_STICKY
              }

              override fun onDestroy() {
                  stopRecording()
                  super.onDestroy()
              }

              private fun startAsForeground() {
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("rec", "Perekam layar", NotificationManager.IMPORTANCE_LOW))
                  val stop = PendingIntent.getService(
                      this, 0,
                      Intent(this, RecorderService::class.java).setAction(ACTION_STOP),
                      PendingIntent.FLAG_IMMUTABLE
                  )
                  val n = Notification.Builder(this, "rec")
                      .setContentTitle("Merekam layar")
                      .setContentText("Ketuk Berhenti untuk menyimpan video")
                      .setSmallIcon(R.drawable.ic_record)
                      .setOngoing(true)
                      .addAction(Notification.Action.Builder(Icon.createWithResource(this, R.drawable.ic_stop), "Berhenti", stop).build())
                      .build()
                  startForeground(2, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
              }

              private fun startRecording(code: Int, data: Intent) {
                  val mpm = getSystemService(Context.MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  val proj = mpm.getMediaProjection(code, data)
                  projection = proj
                  proj.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() {
                          stopRecording()
                          stopSelf()
                      }
                  }, Handler(Looper.getMainLooper()))

                  val dm = DisplayMetrics()
                  val disp = (getSystemService(Context.DISPLAY_SERVICE) as DisplayManager).getDisplay(Display.DEFAULT_DISPLAY)
                  disp.getRealMetrics(dm)
                  var w = dm.widthPixels
                  var h = dm.heightPixels
                  val longSide = max(w, h)
                  if (longSide > 1920) {
                      val f = 1920f / longSide
                      w = (w * f).toInt()
                      h = (h * f).toInt()
                  }
                  w = w and 1.inv()
                  h = h and 1.inv()

                  val name = "LynxBoster_" + SimpleDateFormat("yyyyMMdd_HHmmss", Locale.US).format(Date()) + ".mp4"
                  val values = ContentValues().apply {
                      put(MediaStore.Video.Media.DISPLAY_NAME, name)
                      put(MediaStore.Video.Media.MIME_TYPE, "video/mp4")
                      put(MediaStore.Video.Media.RELATIVE_PATH, "Movies/LynxBoster")
                      put(MediaStore.Video.Media.IS_PENDING, 1)
                  }
                  val u = contentResolver.insert(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, values)
                      ?: throw IllegalStateException("insert gagal")
                  uri = u
                  val p = contentResolver.openFileDescriptor(u, "w") ?: throw IllegalStateException("buka berkas gagal")
                  pfd = p

                  val micOn = getSharedPreferences("lx", MODE_PRIVATE).getBoolean("rec_mic", false) && hasMic(this)
                  @Suppress("DEPRECATION")
                  val r = if (Build.VERSION.SDK_INT >= 31) MediaRecorder(this) else MediaRecorder()
                  if (micOn) r.setAudioSource(MediaRecorder.AudioSource.MIC)
                  r.setVideoSource(MediaRecorder.VideoSource.SURFACE)
                  r.setOutputFormat(MediaRecorder.OutputFormat.MPEG_4)
                  r.setOutputFile(p.fileDescriptor)
                  r.setVideoEncoder(MediaRecorder.VideoEncoder.H264)
                  if (micOn) {
                      r.setAudioEncoder(MediaRecorder.AudioEncoder.AAC)
                      r.setAudioEncodingBitRate(128_000)
                      r.setAudioSamplingRate(44_100)
                  }
                  r.setVideoSize(w, h)
                  r.setVideoFrameRate(30)
                  r.setVideoEncodingBitRate(8_000_000)
                  r.prepare()
                  recorder = r

                  display = proj.createVirtualDisplay(
                      "lynx_rec", w, h, dm.densityDpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                      r.surface, null, null
                  )
                  r.start()
                  isRecording = true
                  Toast.makeText(this, "Perekaman dimulai", Toast.LENGTH_SHORT).show()
              }

              private fun stopRecording() {
                  if (stopping) return
                  stopping = true
                  val wasRecording = isRecording
                  isRecording = false

                  // Lepaskan referensi lebih dulu supaya callback yang terpanggil dari projection.stop() tidak menyentuh berkas.
                  val r = recorder
                  val d = display
                  val proj = projection
                  val f = pfd
                  val u = uri
                  recorder = null
                  display = null
                  projection = null
                  pfd = null
                  uri = null

                  runCatching { r?.stop() }
                  runCatching { r?.reset() }
                  runCatching { r?.release() }
                  runCatching { d?.release() }
                  runCatching { proj?.stop() }
                  runCatching { f?.close() }

                  if (u != null) {
                      if (wasRecording) {
                          runCatching {
                              contentResolver.update(u, ContentValues().apply { put(MediaStore.Video.Media.IS_PENDING, 0) }, null, null)
                          }
                          Toast.makeText(this, "Video disimpan di Movies/LynxBoster", Toast.LENGTH_LONG).show()
                      } else {
                          runCatching { contentResolver.delete(u, null, null) }
                      }
                  }
                  runCatching { stopForeground(STOP_FOREGROUND_REMOVE) }
                  stopping = false
              }
          }
