name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Buat proyek
        run: |
          mkdir -p $(dirname settings.gradle.kts)
          cat > settings.gradle.kts <<'__END_0__'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "AsistenHP"
          include(":app")
          __END_0__
          mkdir -p $(dirname build.gradle.kts)
          cat > build.gradle.kts <<'__END_1__'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          __END_1__
          mkdir -p $(dirname gradle.properties)
          cat > gradle.properties <<'__END_2__'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          __END_2__
          mkdir -p $(dirname app/build.gradle.kts)
          cat > app/build.gradle.kts <<'__END_3__'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.asisten.hp"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.asisten.hp"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          __END_3__
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml <<'__END_4__'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <queries>
                  <intent>
                      <action android:name="android.intent.action.MAIN" />
                      <category android:name="android.intent.category.LAUNCHER" />
                  </intent>
              </queries>
              <application
                  android:label="Asisten HP"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="specialUse">
                      <property
                          android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                          android:value="overlay assistant" />
                  </service>
                  <service
                      android:name=".AsistenAccessibilityService"
                      android:exported="true"
                      android:label="Asisten HP"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_config" />
                  </service>
              </application>
          </manifest>
          __END_4__
          mkdir -p $(dirname app/src/main/res/xml/accessibility_config.xml)
          cat > app/src/main/res/xml/accessibility_config.xml <<'__END_5__'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:accessibilityFlags="flagDefault|flagIncludeNotImportantViews"
              android:canRetrieveWindowContent="true"
              android:description="@string/acc_desc"
              android:notificationTimeout="100" />
          __END_5__
          mkdir -p $(dirname app/src/main/res/values/strings.xml)
          cat > app/src/main/res/values/strings.xml <<'__END_6__'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="acc_desc">Dipakai asisten untuk mengetik, menekan tombol, dan scroll di aplikasi lain sesuai perintahmu.</string>
          </resources>
          __END_6__
          mkdir -p $(dirname app/src/main/java/com/asisten/hp/MainActivity.kt)
          cat > app/src/main/java/com/asisten/hp/MainActivity.kt <<'__END_7__'
          package com.asisten.hp

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.ScrollView
          import android.widget.TextView
          import android.widget.Toast

          class MainActivity : Activity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(40, 100, 40, 40)
                  }
                  root.addView(TextView(this).apply {
                      text = "Asisten HP\n\nLakukan langkah 1-3 sekali saja, lalu tekan Mulai.\n\n" +
                          "Contoh perintah:\nbuka tiktok\ncari resep nasi goreng\nbuka google.com\n" +
                          "ketik halo dunia\ntap login\nkembali / beranda / notifikasi\nscroll bawah / scroll atas\ntelepon 08123456789"
                      textSize = 16f
                  })
                  fun btn(t: String, a: () -> Unit) {
                      root.addView(Button(this).apply { text = t; setOnClickListener { a() } })
                  }
                  btn("1. Aktifkan Aksesibilitas") {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }
                  btn("2. Izin Overlay") {
                      startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                  }
                  btn("3. Izin Notifikasi") {
                      if (Build.VERSION.SDK_INT >= 33) {
                          requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
                      }
                  }
                  btn("4. Mulai Asisten") {
                      if (!Settings.canDrawOverlays(this)) {
                          Toast.makeText(this, "Izinkan Overlay dulu (langkah 2)", Toast.LENGTH_LONG).show()
                      } else {
                          startForegroundService(Intent(this, OverlayService::class.java))
                      }
                  }
                  btn("Hentikan Asisten") {
                      stopService(Intent(this, OverlayService::class.java))
                  }
                  setContentView(ScrollView(this).apply { addView(root) })
              }
          }
          __END_7__
          mkdir -p $(dirname app/src/main/java/com/asisten/hp/OverlayService.kt)
          cat > app/src/main/java/com/asisten/hp/OverlayService.kt <<'__END_8__'
          package com.asisten.hp

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.os.Build
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.WindowManager
          import android.view.inputmethod.EditorInfo
          import android.view.inputmethod.InputMethodManager
          import android.widget.Button
          import android.widget.EditText
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast

          class OverlayService : Service() {
              private lateinit var wm: WindowManager
              private lateinit var lp: WindowManager.LayoutParams
              private var box: LinearLayout? = null
              private val h = Handler(Looper.getMainLooper())
              private val noFocus = WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                  WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL
              private val withFocus = WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int = START_STICKY

              override fun onCreate() {
                  super.onCreate()
                  startFg()
                  wm = getSystemService(WINDOW_SERVICE) as WindowManager
                  buildOverlay()
              }

              override fun onDestroy() {
                  box?.let { try { wm.removeView(it) } catch (e: Exception) {} }
                  box = null
                  super.onDestroy()
              }

              private fun startFg() {
                  val nm = getSystemService(NOTIFICATION_SERVICE) as NotificationManager
                  nm.createNotificationChannel(
                      NotificationChannel("asisten", "Asisten HP", NotificationManager.IMPORTANCE_LOW)
                  )
                  val n: Notification = Notification.Builder(this, "asisten")
                      .setContentTitle("Asisten HP aktif")
                      .setContentText("Widget melayang sedang berjalan")
                      .setSmallIcon(android.R.drawable.ic_dialog_info)
                      .build()
                  if (Build.VERSION.SDK_INT >= 34) {
                      startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_SPECIAL_USE)
                  } else {
                      startForeground(1, n)
                  }
              }

              private fun dp(v: Int) = (v * resources.displayMetrics.density).toInt()

              private fun setFocusable(on: Boolean) {
                  lp.flags = if (on) withFocus else noFocus
                  box?.let { wm.updateViewLayout(it, lp) }
              }

              private fun buildOverlay() {
                  val imm = getSystemService(INPUT_METHOD_SERVICE) as InputMethodManager
                  val bg = GradientDrawable().apply {
                      setColor(Color.parseColor("#E6101828"))
                      cornerRadius = dp(16).toFloat()
                      setStroke(dp(1), Color.parseColor("#4FC3F7"))
                  }
                  val handle = TextView(this).apply {
                      text = "\u2261"
                      setTextColor(Color.WHITE)
                      textSize = 24f
                      setPadding(dp(6), 0, dp(10), 0)
                  }
                  val input = EditText(this).apply {
                      hint = "ketik perintah"
                      setHintTextColor(Color.GRAY)
                      setTextColor(Color.WHITE)
                      textSize = 14f
                      setSingleLine()
                      imeOptions = EditorInfo.IME_ACTION_GO
                      layoutParams = LinearLayout.LayoutParams(dp(150), LinearLayout.LayoutParams.WRAP_CONTENT)
                  }
                  val go = Button(this).apply {
                      text = "GO"
                      minWidth = 0
                      minimumWidth = 0
                      setPadding(dp(14), 0, dp(14), 0)
                  }
                  val close = TextView(this).apply {
                      text = "\u2715"
                      setTextColor(Color.LTGRAY)
                      textSize = 18f
                      setPadding(dp(10), 0, dp(4), 0)
                  }
                  val container = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      gravity = Gravity.CENTER_VERTICAL
                      background = bg
                      setPadding(dp(8), dp(6), dp(8), dp(6))
                      addView(handle)
                      addView(input)
                      addView(go)
                      addView(close)
                  }
                  box = container

                  lp = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.WRAP_CONTENT,
                      WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                      noFocus,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = dp(20)
                      y = dp(120)
                  }

                  var sx = 0
                  var sy = 0
                  var tx = 0f
                  var ty = 0f
                  handle.setOnTouchListener { _, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> { sx = lp.x; sy = lp.y; tx = e.rawX; ty = e.rawY }
                          MotionEvent.ACTION_MOVE -> {
                              lp.x = sx + (e.rawX - tx).toInt()
                              lp.y = sy + (e.rawY - ty).toInt()
                              wm.updateViewLayout(container, lp)
                          }
                      }
                      true
                  }

                  input.setOnTouchListener { v, e ->
                      if (e.action == MotionEvent.ACTION_DOWN) {
                          setFocusable(true)
                          v.requestFocus()
                          h.postDelayed({ imm.showSoftInput(v, 0) }, 150)
                      }
                      false
                  }

                  fun submit() {
                      val cmd = input.text.toString()
                      if (cmd.isBlank()) return
                      imm.hideSoftInputFromWindow(input.windowToken, 0)
                      input.setText("")
                      input.clearFocus()
                      setFocusable(false)
                      h.postDelayed({
                          val r = Executor.run(this, cmd)
                          Toast.makeText(this, r, Toast.LENGTH_SHORT).show()
                      }, 400)
                  }
                  go.setOnClickListener { submit() }
                  input.setOnEditorActionListener { _, a, _ ->
                      if (a == EditorInfo.IME_ACTION_GO) { submit(); true } else false
                  }
                  close.setOnClickListener { stopSelf() }

                  wm.addView(container, lp)
              }
          }
          __END_8__
          mkdir -p $(dirname app/src/main/java/com/asisten/hp/Executor.kt)
          cat > app/src/main/java/com/asisten/hp/Executor.kt <<'__END_9__'
          package com.asisten.hp

          import android.accessibilityservice.AccessibilityService
          import android.content.Context
          import android.content.Intent
          import android.net.Uri

          object Executor {

              fun run(ctx: Context, raw: String): String {
                  val t = raw.trim()
                  val c = t.lowercase()
                  return when {
                      c.startsWith("buka ") -> buka(ctx, c.drop(5).trim())
                      c.startsWith("cari ") -> view(
                          ctx,
                          "https://www.google.com/search?q=" + Uri.encode(t.drop(5).trim()),
                          "Mencari: " + t.drop(5).trim()
                      )
                      c.startsWith("telepon ") -> {
                          val no = t.drop(8).trim()
                          start(ctx, Intent(Intent.ACTION_DIAL, Uri.parse("tel:" + Uri.encode(no))), "Menelepon $no")
                      }
                      c.startsWith("ketik ") -> acc { it.ketik(t.drop(6)) }
                      c.startsWith("tap ") -> acc { it.tap(t.drop(4).trim()) }
                      c == "kembali" -> acc { it.global(AccessibilityService.GLOBAL_ACTION_BACK, "Kembali") }
                      c == "beranda" || c == "home" ->
                          acc { it.global(AccessibilityService.GLOBAL_ACTION_HOME, "Beranda") }
                      c == "terbaru" || c == "recent" ->
                          acc { it.global(AccessibilityService.GLOBAL_ACTION_RECENTS, "Aplikasi terbaru") }
                      c == "notifikasi" ->
                          acc { it.global(AccessibilityService.GLOBAL_ACTION_NOTIFICATIONS, "Notifikasi") }
                      c == "scroll bawah" -> acc { it.scroll(true) }
                      c == "scroll atas" -> acc { it.scroll(false) }
                      else -> "Perintah tidak dikenal: $t"
                  }
              }

              private fun acc(f: (AsistenAccessibilityService) -> String): String {
                  val s = AsistenAccessibilityService.instance
                      ?: return "Aktifkan layanan Aksesibilitas dulu"
                  return f(s)
              }

              private fun start(ctx: Context, i: Intent, ok: String): String {
                  return try {
                      i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK)
                      ctx.startActivity(i)
                      ok
                  } catch (e: Exception) {
                      "Gagal: " + (e.message ?: "tidak diketahui")
                  }
              }

              private fun view(ctx: Context, url: String, ok: String): String =
                  start(ctx, Intent(Intent.ACTION_VIEW, Uri.parse(url)), ok)

              private fun buka(ctx: Context, target: String): String {
                  if (target.contains(".") && !target.contains(" ")) {
                      val url = if (target.startsWith("http")) target else "https://$target"
                      return view(ctx, url, "Membuka $target")
                  }
                  val pm = ctx.packageManager
                  val main = Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_LAUNCHER)
                  val list = pm.queryIntentActivities(main, 0)
                  val found = list.firstOrNull { it.loadLabel(pm).toString().lowercase() == target }
                      ?: list.firstOrNull { it.loadLabel(pm).toString().lowercase().contains(target) }
                      ?: return "Aplikasi tidak ditemukan: $target"
                  val i = pm.getLaunchIntentForPackage(found.activityInfo.packageName)
                      ?: return "Tidak bisa membuka $target"
                  return start(ctx, i, "Membuka " + found.loadLabel(pm))
              }
          }
          __END_9__
          mkdir -p $(dirname app/src/main/java/com/asisten/hp/AsistenAccessibilityService.kt)
          cat > app/src/main/java/com/asisten/hp/AsistenAccessibilityService.kt <<'__END_10__'
          package com.asisten.hp

          import android.accessibilityservice.AccessibilityService
          import android.content.Intent
          import android.os.Bundle
          import android.view.accessibility.AccessibilityEvent
          import android.view.accessibility.AccessibilityNodeInfo

          class AsistenAccessibilityService : AccessibilityService() {

              companion object {
                  var instance: AsistenAccessibilityService? = null
              }

              override fun onServiceConnected() {
                  instance = this
              }

              override fun onUnbind(intent: Intent?): Boolean {
                  instance = null
                  return super.onUnbind(intent)
              }

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}

              override fun onInterrupt() {}

              fun global(action: Int, ok: String): String =
                  if (performGlobalAction(action)) ok else "Gagal"

              fun ketik(text: String): String {
                  val root = rootInActiveWindow ?: return "Layar tidak terbaca"
                  val node = root.findFocus(AccessibilityNodeInfo.FOCUS_INPUT) ?: findEditable(root)
                      ?: return "Tidak ada kolom input. Tap kolomnya dulu"
                  val args = Bundle()
                  args.putCharSequence(AccessibilityNodeInfo.ACTION_ARGUMENT_SET_TEXT_CHARSEQUENCE, text)
                  return if (node.performAction(AccessibilityNodeInfo.ACTION_SET_TEXT, args)) {
                      "Mengetik: $text"
                  } else {
                      "Gagal mengetik"
                  }
              }

              fun tap(text: String): String {
                  val root = rootInActiveWindow ?: return "Layar tidak terbaca"
                  val nodes = root.findAccessibilityNodeInfosByText(text)
                  for (n in nodes) {
                      var x: AccessibilityNodeInfo? = n
                      while (x != null && !x.isClickable) x = x.parent
                      if (x != null && x.performAction(AccessibilityNodeInfo.ACTION_CLICK)) {
                          return "Tap: $text"
                      }
                  }
                  return "Tidak menemukan: $text"
              }

              fun scroll(down: Boolean): String {
                  val root = rootInActiveWindow ?: return "Layar tidak terbaca"
                  val node = findScrollable(root) ?: return "Tidak ada yang bisa di-scroll"
                  val act = if (down) AccessibilityNodeInfo.ACTION_SCROLL_FORWARD
                  else AccessibilityNodeInfo.ACTION_SCROLL_BACKWARD
                  return if (node.performAction(act)) "Scroll" else "Gagal scroll"
              }

              private fun findEditable(n: AccessibilityNodeInfo?): AccessibilityNodeInfo? {
                  if (n == null) return null
                  if (n.isEditable) return n
                  for (i in 0 until n.childCount) {
                      val r = findEditable(n.getChild(i))
                      if (r != null) return r
                  }
                  return null
              }

              private fun findScrollable(n: AccessibilityNodeInfo?): AccessibilityNodeInfo? {
                  if (n == null) return null
                  if (n.isScrollable) return n
                  for (i in 0 until n.childCount) {
                      val r = findScrollable(n.getChild(i))
                      if (r != null) return r
                  }
                  return null
              }
          }
          __END_10__
      - name: Build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AsistenHP-apk
          path: app/build/outputs/apk/debug/app-debug.apk
